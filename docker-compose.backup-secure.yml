# 🛡️ Docker Compose BACKUP SECURE - Sin docker.sock
# Versión segura sin acceso root al host

services:
  backup:
    image: alpine:3.19
    restart: unless-stopped
    container_name: workplace_backup
    volumes:
      - redis_data:/redis:ro
      - uploads_data:/uploads:ro
      - /opt/workplace/backups:/backups
    command: >
      sh -c "
        LOCK_FILE='/tmp/workplace_backup.lock'
        if [ -f \"\$LOCK_FILE\" ]; then
          echo 'Backup ya en ejecución' &&
          exit 1
        fi &&
        trap 'rm -f \"\$LOCK_FILE\"' EXIT &&
        touch \"\$LOCK_FILE\" &&
        echo 'Installing dependencies...' &&
        apk add --no-cache postgresql-client redis &&
        echo 'Starting backup service...' &&
        while true; do
          echo 'Running backup cycle...' &&
          DATE=\$(date +%Y%m%d_%H%M%S) &&
          
          # PostgreSQL backup (direct connection + compression)
          echo 'PostgreSQL backup...' &&
          if pg_dump -h postgres -U \${POSTGRES_USER} \${POSTGRES_DB} | gzip > /backups/postgres_\${DATE}.sql.gz; then
            echo '✅ PostgreSQL OK (compressed)'
          else
            echo '❌ PostgreSQL failed'
          fi &&
          
          # Redis backup (async + volume mount)
          echo 'Redis backup...' &&
          if docker exec redis redis-cli -h redis -a \${REDIS_PASSWORD} BGSAVE; then
            sleep 3 &&
            if cp /var/lib/docker/volumes/redis_data/_data/dump.rdb /backups/redis_\${DATE}.rdb; then
              echo '✅ Redis OK (direct copy)'
              gzip /backups/redis_\${DATE}.rdb || true
            else
              echo '❌ Redis copy failed'
            fi
          else
            echo '❌ Redis save failed'
          fi &&
          
          # Uploads backup
          echo 'Uploads backup...' &&
          if tar czf /backups/uploads_\${DATE}.tar.gz -C /uploads .; then
            echo '✅ Uploads OK'
          else
            echo '❌ Uploads failed'
          fi &&
          
          # Verify backup integrity
          echo 'Verifying backup integrity...' &&
          if [ -f \"/backups/postgres_\${DATE}.sql.gz\" ] && [ -f \"/backups/redis_\${DATE}.rdb.gz\" ] && [ -f \"/backups/uploads_\${DATE}.tar.gz\" ]; then
            echo '✅ All backups verified'
          else
            echo '⚠️ Some backups may be incomplete'
          fi &&
          
          # Cleanup old backups
          echo 'Cleaning old backups...' &&
          find /backups -name '*.sql*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.sql.gz*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.rdb*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.rdb.gz*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.tar.gz*' -mtime +7 -delete 2>/dev/null || true &&
          
          echo 'Backup cycle completed. Next run in 24 hours...' &&
          sleep 86400;
        done
      "
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - workplace_private_network
    cpus: "0.1"
    mem_limit: 64m
    mem_reservation: 32m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  workplace_private_network:
    external: true
