# 🚀 Docker Compose DEV HÍBRIDO
# Backend en Docker + Frontend en host para máxima velocidad de desarrollo
#
# ⚠️ IMPORTANTE: Ejecutar SIEMPRE con --env-file .env.dev
# Comando correcto:
#   docker compose --env-file .env.dev -f docker-compose.hybrid.yml up -d
#
# 🎨 Para correr frontend en host (después de levantar Docker):
#   cd frontend && pnpm install && pnpm dev
#
# Accesos disponibles:
#   - Frontend (host): http://localhost:3000
#   - Backend API: http://localhost:3001
#   - PostgreSQL: localhost:5432
#   - Redis: localhost:6379
#   - Traefik Dashboard: http://localhost:8080
#   - Mailhog: http://localhost:8025
#   - Adminer: http://localhost:8081

services:
  # 🌐 Traefik - Router para DEV
  traefik:
    image: traefik:v3.0
    container_name: traefik-hybrid
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public_network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"  # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public_network
      - private_network

  # 🔧 Backend - En Docker
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: backend-hybrid
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
      PORT: ${NODE_PORT:-3001}
      DEBUG: "*"
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # CORS para permitir frontend en host
      CORS_ORIGIN: "http://localhost:3000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - uploads_data:/app/backend/uploads
    ports:
      - "3001:3001"
    networks:
      - public_network
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NODE_PORT:-3001}/api/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-localhost}`) || Host(`localhost`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=${NODE_PORT:-3001}"

  # 🗄️ PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres-hybrid
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./backend/prisma/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 🔴 Redis
  redis:
    image: redis:7-alpine
    container_name: redis-hybrid
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - private_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 📧 Mailhog - Email testing
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog-hybrid
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - public_network
      - private_network
    environment:
      MH_STORAGE: memory
      MH_CORS_ORIGIN: "*"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # 🛠️ Adminer - Database UI
  adminer:
    image: adminer:latest
    container_name: adminer-hybrid
    ports:
      - "8081:8080"
    networks:
      - public_network
      - private_network
    environment:
      ADMINER_DESIGN: dracula
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`db.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
    internal: false
