version: 2.1

jobs:
  backend:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    environment:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Activate repository pnpm version
          command: |
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Validate Prisma schema and generate client
          command: |
            pnpm --filter backend exec prisma validate --schema=./prisma/schema.prisma
            pnpm --filter backend prisma:generate
      - run:
          name: Backend type-check
          command: pnpm --filter backend type-check
      - run:
          name: Validate domain boundaries
          command: pnpm --filter backend deps:check
      - run:
          name: Reject new floating-point schema fields
          command: pnpm --filter backend schema:float-check
      - run:
          name: Check backend formatting
          command: pnpm --filter backend format:check
      - run:
          name: Audit critical dependency vulnerabilities
          command: cd backend && pnpm audit --audit-level critical
          no_output_timeout: 5m
      - run:
          name: Build backend
          command: pnpm --filter backend build
      - run:
          name: Check backend bundle size
          command: |
            DIST_SIZE=$(du -sm backend/dist | cut -f1)
            echo "Backend bundle size: ${DIST_SIZE}MB"
            if [ "${DIST_SIZE}" -gt 50 ]; then
              echo "Backend bundle exceeds the 50MB limit"
              exit 1
            fi
      - run:
          name: Run backend unit tests
          command: pnpm --filter backend test:ci --runInBand
          no_output_timeout: 10m
      - store_artifacts:
          path: backend/coverage
          destination: backend-coverage

  frontend:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Activate repository pnpm version
          command: |
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Build frontend
          command: pnpm --filter frontend build
      - run:
          name: Run frontend tests
          command: pnpm --filter frontend exec vitest run --passWithNoTests
      - run:
          name: Frontend type-check ratchet
          command: pnpm --filter frontend type-check:ratchet

  migrations:
    docker:
      - image: cimg/node:22.14
      - image: cimg/postgres:15.8
        environment:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
    working_directory: ~/project
    environment:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - checkout
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-
      - run:
          name: Activate repository pnpm version
          command: |
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                exit 0
              fi
              sleep 2
            done
            echo "PostgreSQL did not become ready in time"
            exit 1
      - run:
          name: Apply all migrations to an empty database
          command: pnpm --filter backend exec prisma migrate deploy --schema=./prisma/schema.prisma
      - run:
          name: Ensure migrated database matches Prisma schema
          command: |
            pnpm --filter backend exec prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel ./prisma/schema.prisma \
              --exit-code

  docker-build:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Build backend production image
          command: docker build --pull --file backend/Dockerfile.prod --target production --tag workplace-backend:ci .
      - run:
          name: Build frontend production image
          command: docker build --pull --file frontend/Dockerfile.prod --target production --tag workplace-frontend:ci .

  security:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install pinned Trivy release
          command: |
            set -eu
            VERSION=0.64.1
            mkdir -p "$HOME/.local/bin" /tmp/trivy
            curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy/trivy.tar.gz
            tar -xzf /tmp/trivy/trivy.tar.gz -C /tmp/trivy trivy
            install /tmp/trivy/trivy "$HOME/.local/bin/trivy"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Scan source and dependencies for critical vulnerabilities and misconfiguration
          command: trivy fs --scanners vuln,misconfig,secret --severity CRITICAL --exit-code 0 --no-progress .

workflows:
  validate:
    jobs:
      - backend
      - frontend
      - migrations
      - docker-build
      - security
