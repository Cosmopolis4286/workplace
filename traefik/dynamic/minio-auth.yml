# MinIO Authentication Middleware - Production Security

http:
  middlewares:
    minio-auth:
      basicAuth:
        users:
          - "minioadmin:$apr1$7L8k5wS2d$VQmT5X6bB7K9n8d4c6"
        realm: "MinIO Admin Panel"
        headerField: "X-WebAuth-User"
    
    minio-whitelist:
      ipWhiteList:
        sourceRange:
          - "127.0.0.1/32"  # Localhost
          - "10.0.0.0/8"     # Private networks
          - "172.16.0.0/12"   # Docker networks
          - "192.168.0.0/16"  # Private networks
          # Add your office IP here for production access
          # - "YOUR.OFFICE.IP/32"
