# 🚦 Rate Limit Middleware - Production Ready

http:
  middlewares:
    # Global Rate Limiting
    rate-limit:
      rateLimit:
        average: 100
        period: "1m"
        burst: 50
        
    # Aggressive Rate Limiting (for API)
    rate-limit-aggressive:
      rateLimit:
        average: 50
        period: "1m"
        burst: 25
        
    # Per-User Rate Limiting
    rate-limit-user:
      rateLimit:
        average: 200
        period: "1m"
        burst: 100
