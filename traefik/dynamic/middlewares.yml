# 🛡️ Traefik Middlewares - Security & Performance

http:
  middlewares:
    # Global Rate Limiting
    global-rate-limit:
      rateLimit:
        average: 100
        period: "1m"
        burst: 200
    
    # Security Headers
    security-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          X-XSS-Protection: "1; mode=block"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    # Rate Limiting específico para auth (más estricto)
    rate-limit-auth:
      rateLimit:
        average: 10
        period: "1m"
        burst: 20

    # Rate Limiting general
    # Escudo contra abuso por IP. Holgado a propósito: muchos usuarios móviles
    # comparten IP (CGNAT). El límite por usuario lo aplica el backend.
    rate-limit:
      rateLimit:
        average: 600
        period: "1m"
        burst: 300

    # Compression
    compression:
      compress:
        excludedContentTypes:
          - "text/event-stream"
          - "application/grpc"
        minResponseBodyBytes: 1024

    # API Stripping
    api-stripprefix:
      stripPrefix:
        prefixes:
          - "/api"

    # CORS: lo resuelve el backend (main.ts, enableCors con whitelist de
    # FRONTEND_URL + https://localhost de la app Android). No se configura
    # aquí: Traefik responde los preflight OPTIONS por su cuenta y, con otra
    # lista de orígenes, bloqueaba orígenes válidos para el backend.
