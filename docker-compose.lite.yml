# 🚀 Docker Compose LITE - Optimizado para 2CPU/4GB RAM
# Stack esencial para producción con recursos limitados

version: '3.8'

services:
  # 🌐 Traefik - Router SSL esencial
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    container_name: traefik
    command:
      - "--api.dashboard=false"  # Sin dashboard para ahorrar RAM
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=public_network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL:-admin@${DOMAIN:-localhost}}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=WARN"  # Logs mínimos
      - "--accesslog=false"  # Sin access logs para ahorrar I/O
      - "--serversTransport.insecureSkipVerify=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - public_network
      - private_network
    environment:
      - "DOMAIN=${DOMAIN:-localhost}"
      - "EMAIL=${EMAIL:-admin@${DOMAIN:-localhost}}"
    cpus: "0.3"
    mem_limit: 128m
    mem_reservation: 64m

  # 🔧 Backend - Core API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: ${NODE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      UV_THREADPOOL_SIZE: 4
    volumes:
      - uploads_data:/app/uploads
    networks:
      - private_network
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${NODE_PORT}/api/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=${NODE_PORT}"
      - "traefik.http.routers.backend.middlewares=api-stripprefix@file,cors-api@file"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🎨 Frontend - Nuxt optimizado
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
    tmpfs:
      - /tmp
      - /app/frontend/.nuxt:rw,size=50m,mode=1777
    networks:
      - public_network
    cpus: "0.5"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${FRONTEND_PORT} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`, `www.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=${FRONTEND_PORT}"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,compression@file"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🗄️ PostgreSQL - Optimizado para 4GB RAM
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=40
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - private_network
    cpus: "0.5"
    mem_limit: 600m
    mem_reservation: 300m
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🔴 Redis - Ligero y rápido
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --protected-mode yes
      --tcp-keepalive 300
      --timeout 0
      --save ""
    volumes:
      - redis_data:/data
    networks:
      - private_network
    cpus: "0.2"
    mem_limit: 150m
    mem_reservation: 75m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  traefik_letsencrypt:

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
    internal: true
