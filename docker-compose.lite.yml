# 🚀 Docker Compose LITE (PROD) - Optimizado para 2CPU/4GB RAM
# Stack esencial para producción con recursos limitados

services:
  # 🌐 Traefik - Router SSL esencial
  traefik:
    image: traefik:v3.6  # >= v3.6: compatible con la API de Docker Engine 29
    restart: unless-stopped
    init: true
    container_name: traefik
    command:
      # Usar archivo de configuración estático
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - public_network
      - private_network
    environment:
      - "DOMAIN=${DOMAIN:-localhost}"
      - "EMAIL=${EMAIL:-admin@localhost}"
    cpus: "0.3"
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 🔧 Backend - Core API
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 100
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      USE_DEMO: ${USE_DEMO:-false}
      PORT: ${NODE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UV_THREADPOOL_SIZE: 4
    volumes:
      - uploads_data:/app/uploads
    networks:
      - public_network
      - private_network
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${NODE_PORT:-3001}/api/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=(Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.tls.options=modern@file"
      - "traefik.http.routers.backend.tls.domains[0].main=${DOMAIN:-localhost}"
      - "traefik.http.routers.backend.tls.domains[0].sans=www.${DOMAIN:-localhost}"
      - "traefik.http.routers.backend.priority=100"
      - "traefik.http.services.backend.loadbalancer.server.port=${NODE_PORT:-3001}"
      - "traefik.http.routers.backend.middlewares=security-headers@file,rate-limit@file"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🎨 Frontend - Nuxt optimizado
  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
      USE_DEMO: ${USE_DEMO:-false}
    tmpfs:
      - /tmp
      - /app/frontend/.nuxt:rw,size=50m,mode=1777
    networks:
      - public_network
    cpus: "0.5"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${FRONTEND_PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`) || Host(`www.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.tls.options=modern@file"
      - "traefik.http.routers.frontend.tls.domains[0].main=${DOMAIN:-localhost}"
      - "traefik.http.routers.frontend.tls.domains[0].sans=www.${DOMAIN:-localhost}"
      - "traefik.http.routers.frontend.priority=50"
      - "traefik.http.services.frontend.loadbalancer.server.port=${FRONTEND_PORT:-3000}"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,compression@file"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🗄️ PostgreSQL - Optimizado para 4GB RAM
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    command: >
      postgres
      -c max_connections=40
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
    pids_limit: 100
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - private_network
    cpus: "0.5"
    mem_limit: 600m
    mem_reservation: 300m
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 🔴 Redis - Cache y rate limiting (NO crítico para seguridad tras migración a JWT+DB)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --protected-mode yes
      --tcp-keepalive 300
      --timeout 0
      --save ""
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - redis_data:/data
    networks:
      - private_network
    cpus: "0.2"
    mem_limit: 150m
    mem_reservation: 75m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # 💾 Backups: no hay contenedor dedicado. scripts/backup/host-backup.sh corre
  # desde el cron del host (lo instala el deploy) y antes de cada deploy.

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  traefik_letsencrypt:

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
    internal: true
