# Canary deployment configuration
# This file extends docker-compose.yml for canary deployments
services:
  backend_canary:
    image: ${DOCKER_USER}/workplace-backend:main
    container_name: workplace_backend_canary
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: 3002  # Different port for canary
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CANARY: "true"
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
      - private_uploads_data:/app/backend/private-uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 3 http://localhost:3002/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    tmpfs:
      - /tmp
    ports:
      - "3002:3002"  # Expose canary on different port for testing
