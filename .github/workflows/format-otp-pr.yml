name: Formatear integración OTP temporal

on:
  push:
    branches:
      - feat/verificacion-telefonica-messangi

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(auth): aplicar Prettier a integración OTP'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener rama de trabajo
        uses: actions/checkout@v7
        with:
          ref: feat/verificacion-telefonica-messangi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar Prettier a los archivos afectados
        run: |
          cd backend
          pnpm exec prettier --config .prettierrc --write \
            src/domains/identity-access/auth/auth.controller.ts \
            src/domains/identity-access/auth/phone-verification.service.ts \
            src/test/unit/phone-verification.service.test.ts

      - name: Eliminar formateador temporal
        run: rm .github/workflows/format-otp-pr.yml .tmp-trigger-otp-format

      - name: Guardar corrección de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(auth): aplicar Prettier a integración OTP"
          git push origin HEAD:feat/verificacion-telefonica-messangi
