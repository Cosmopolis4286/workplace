name: Development Environment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  dev-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: workplace_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run database migrations
      run: |
        cd backend
        pnpm prisma migrate deploy
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Run integration tests
      run: |
        cd backend
        pnpm test:integration
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Run E2E tests
      run: |
        cd backend
        pnpm test:e2e
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test
      timeout-minutes: 15
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  dev-deploy:
    needs: dev-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.force_deploy == 'true'
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push dev image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to development
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=3 ${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }} << 'EOF'
          set -e
          
          echo "🚀 Starting development deployment at $(date)"
          
          # Login a Docker Hub para repositorio private
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Verificar directorio
          echo "🔍 Verificando directorio: /opt/workplace-dev"
          if [ ! -d "/opt/workplace-dev" ]; then
            echo "❌ El directorio no existe: /opt/workplace-dev"
            echo "🔧 Creando directorio..."
            mkdir -p /opt/workplace-dev
            echo "✅ Directorio creado"
          fi
          
          cd /opt/workplace-dev
          
          # Verificar Docker está corriendo
          if ! docker info > /dev/null 2>&1; then
            echo "❌ Docker no está disponible"
            exit 1
          fi
          
          echo "⬇️ Pull new image"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop workplace-backend:latest
          
          # Backup antes de actualizar
          echo "💾 Creating backup..."
          docker tag workplace-backend:latest workplace-backend:backup-$(date +%Y%m%d-%H%M%S)
          
          echo "🔄 Running migrations on dev..."
          if docker-compose run --rm migrate; then
            echo "✅ Migrations completed"
          else
            echo "⚠️ Migrations failed, continuing..."
          fi
          
          echo "🔄 Restart services"
          docker-compose down
          docker-compose up -d
          
          echo "⏳ Waiting for services..."
          sleep 20
          
          # Health checks
          echo "🔍 Verificando health de servicios"
          if docker-compose ps | grep -q "Up"; then
            echo "✅ Development environment updated successfully"
            
            # Logout de Docker Hub
            docker logout
          else
            echo "❌ Services not running properly"
            docker logout
            exit 1
          fi
        EOF
