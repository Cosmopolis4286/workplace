name: Development CI

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Continuar aunque fallen los tests'
        required: false
        default: false
        type: boolean

jobs:
  # ─── Tests en rama develop ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: workplace_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Migraciones DB
      run: cd backend && pnpm prisma migrate deploy
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev

    - name: Lint
      run: cd backend && pnpm lint:ci
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Tests unitarios
      run: cd backend && pnpm test:ci
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        APP_ENV: test

    - name: Tests de integración
      run: cd backend && pnpm test:integration
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        APP_ENV: test

    - name: Subir coverage
      uses: codecov/codecov-action@v5
      with:
        file: ./backend/coverage/lcov.info
        flags: develop
        fail_ci_if_error: false

  # ─── Build imagen de desarrollo ────────────────────────────────────────────
  build-dev:
    name: Build Dev Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.event.inputs.force_deploy == 'true'
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build y push imagen develop
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:develop
        cache-from: type=gha,scope=develop-backend
        cache-to: type=gha,mode=max,scope=develop-backend
