name: Development Environment

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  dev-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: workplace_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run database migrations
      run: |
        cd backend
        pnpm prisma migrate deploy
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev

    - name: Run unit tests
      run: |
        cd backend
        pnpm test --coverage
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Run integration tests
      run: |
        cd backend
        pnpm test:integration
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Run E2E tests
      run: |
        cd backend
        pnpm test:e2e
      env:
        DATABASE_URL: postgresql://dev:dev@localhost:5432/workplace_dev
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  dev-deploy:
    needs: dev-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push dev image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to development
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DEV_HOST }}
        username: ${{ secrets.DEV_USER }}
        key: ${{ secrets.DEV_SSH_KEY }}
        script: |
          cd /opt/workplace-dev
          
          # Pull new image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop workplace-backend:latest
          
          # Run migrations
          echo "🔄 Running migrations on dev..."
          docker-compose run --rm migrate
          
          # Restart services
          docker-compose up -d
          
          echo "✅ Development environment updated"
