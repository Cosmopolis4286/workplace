name: One-time payment formatting repair

on:
  push:
    branches:
      - codex/payment-orchestration-foundation

permissions:
  contents: write

jobs:
  format-payment-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/payment-orchestration-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '22'
      - name: Format payment orchestration files with project Prettier
        run: |
          cd backend
          pnpm exec prettier --write \
            src/domains/money/payments/payment-provider.interface.ts \
            src/domains/money/payments/payments.service.spec.ts \
            src/domains/money/payments/payments.service.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/domains/money/payments/payment-provider.interface.ts backend/src/domains/money/payments/payments.service.spec.ts backend/src/domains/money/payments/payments.service.ts
          git commit -m "style(payments): apply Prettier formatting"
          git push origin HEAD:codex/payment-orchestration-foundation
