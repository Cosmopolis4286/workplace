name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

  build-backend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-backend" >> $GITHUB_OUTPUT
        echo "🏷️ Backend image tag: main-${{ github.sha }}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-frontend" >> $GITHUB_OUTPUT
        echo "🏷️ Frontend image tag: main-${{ github.sha }}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  verify-images:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Verify built images
      run: |
        echo "🔍 Verificando imágenes construidas..."
        
        # Crear red Docker para los tests
        docker network create test-net || true
        
        # Levantar Postgres para el test
        echo "🗄️ Levantando Postgres para test..."
        docker run -d --name test-postgres --network test-net \
          -e POSTGRES_USER=test \
          -e POSTGRES_PASSWORD=test \
          -e POSTGRES_DB=test_db \
          --health-cmd pg_isready \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5 \
          postgres:16-alpine
        
        # Levantar Redis para el test
        echo "🔴 Levantando Redis para test..."
        docker run -d --name test-redis --network test-net \
          --health-cmd "redis-cli ping" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5 \
          redis:7-alpine
        
        # Esperar a que las bases de datos estén ready usando health checks
        echo "⏳ Esperando que las bases de datos estén ready..."
        timeout 60 bash -c 'until docker inspect test-postgres --format="{{.State.Health.Status}}" | grep -q "healthy"; do sleep 2; done'
        timeout 60 bash -c 'until docker inspect test-redis --format="{{.State.Health.Status}}" | grep -q "healthy"; do sleep 2; done'
        
        # Probar que el backend se ejecute correctamente
        echo "🧪 Testeando backend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        # Correr backend con health check
        docker run -d --name test-backend --network test-net \
          -e DATABASE_URL="postgresql://test:test@test-postgres:5432/test_db" \
          -e DB_HOST=test-postgres \
          -e DB_PORT=5432 \
          -e REDIS_HOST=test-redis \
          -e REDIS_PORT=6379 \
          -e JWT_SECRET="test-jwt-secret-for-ci-only" \
          -e JWT_REFRESH_SECRET="test-jwt-refresh-secret-for-ci-only" \
          -e JWT_ACCESS_SECRET="test-jwt-access-secret-for-ci-only" \
          -e GOOGLE_CLIENT_ID="test-google-client-id-for-ci-only" \
          -e GOOGLE_CLIENT_SECRET="test-google-client-secret-for-ci-only" \
          -e NODE_ENV=test \
          -p 3001:3001 \
          --health-cmd "curl -f http://localhost:3001/api/health || exit 1" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        # Esperar health check usando docker inspect
        echo "⏳ Esperando health check del backend..."
        timeout 120 bash -c 'until docker inspect test-backend --format="{{.State.Health.Status}}" | grep -q "healthy"; do sleep 2; done'
        
        echo "✅ Backend health check OK"
        
        # Probar que el frontend se ejecute correctamente
        echo "🧪 Testeando frontend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        # Correr frontend con health check
        docker run -d --name test-frontend \
          -e BACKEND_API_URL=http://localhost:3001/api \
          -e NITRO_HOST=0.0.0.0 \
          -e NITRO_PORT=3000 \
          -p 3000:3000 \
          --health-cmd "curl -f http://localhost:3000/ || exit 1" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        # Esperar health check usando docker inspect
        echo "⏳ Esperando health check del frontend..."
        timeout 120 bash -c 'until docker inspect test-frontend --format="{{.State.Health.Status}}" | grep -q "healthy"; do sleep 2; done'
        
        echo "✅ Frontend health check OK"
        
        # Verificaciones adicionales
        if docker exec test-frontend test -d "/app/.output"; then
          echo "✅ Frontend .output folder exists"
        else
          echo "❌ Frontend .output folder missing"
          docker stop test-frontend
          exit 1
        fi
        
        # Verificar archivos críticos del build
        if docker exec test-frontend test -f "/app/.output/server/index.mjs"; then
          echo "✅ Frontend server entrypoint exists"
        else
          echo "❌ Frontend server entrypoint missing"
          docker stop test-frontend
          exit 1
        fi
        
        # Debug de estructura (solo para referencia)
        echo "📋 Frontend container structure:"
        docker exec test-frontend ls -la /app/.output/ 2>/dev/null || echo "No .output directory readable"
        echo "📋 Server files:"
        docker exec test-frontend ls -la /app/.output/server/ 2>/dev/null || echo "No server directory readable"
        
        docker rm -f test-backend test-postgres test-redis test-frontend || true
        docker network rm test-net || true
        echo "✅ Todas las imágenes verificadas correctamente"

  deploy:
    needs: verify-images
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.force_deploy == 'true')
    
    # Control de concurrencia - evita pipelines simultáneos
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Copy deploy scripts
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          
          # Crear directorio de scripts si no existe
          mkdir -p /opt/workplace/scripts/deploy
          echo "✅ Directorio /opt/workplace/scripts/deploy creado"
        EOF
        
        scp -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          -r scripts/deploy/* ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deploy/
        
        echo "📋 Scripts copiados:"
        echo "- rolling_update_backend.sh (nuevo - zero downtime)"
        echo "- verify_load_balancing.sh (nuevo - validación)"
        echo "- deploy_backend.sh (fallback)"
        echo "- rolling_update.sh (frontend)"
        echo "- rollback.sh (híbrido)"
        echo "- canary_check.sh"
        echo "- cleanup.sh"

    - name: Deploy Backend
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Variables de entorno
          export CURRENT_SHA="${{ github.sha }}"
          export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}"
          export BACKEND_TAG="main-${{ github.sha }}"
          export FRONTEND_TAG="main-${{ github.sha }}"
          export BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
          
          # Login a Docker Hub
          echo "$DOCKER_PASSWORD" | docker login -u $DOCKER_USERNAME --password-stdin
          
          # Ejecutar rolling update del backend (zero downtime)
          chmod +x scripts/deploy/rolling_update_backend.sh
          if bash scripts/deploy/rolling_update_backend.sh; then
            echo "✅ Backend rolling update completado"
          else
            echo "❌ Backend rolling update falló, intentando método fallback..."
            # Fallback al método anterior si rolling falla
            chmod +x scripts/deploy/deploy_backend.sh
            bash scripts/deploy/deploy_backend.sh
          fi
        EOF

    - name: Canary Check
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Variables de entorno
          export CURRENT_SHA="${{ github.sha }}"
          export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export BACKEND_TAG="main-${{ github.sha }}"
          export FRONTEND_TAG="main-${{ github.sha }}"
          export BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
          
          # Ejecutar canary check
          chmod +x scripts/deploy/canary_check.sh
          if bash scripts/deploy/canary_check.sh; then
            echo "✅ Canary validation passed"
          else
            echo "❌ Canary validation failed"
            exit 1
          fi
        EOF

    - name: Verify Load Balancing
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Verificar que load balancing esté funcionando antes de rolling update
          echo "🔍 Verificando load balancing pre-rolling..."
          chmod +x scripts/deploy/verify_load_balancing.sh
          if bash scripts/deploy/verify_load_balancing.sh; then
            echo "✅ Load balancing pre-rolling OK"
          else
            echo "⚠️ Load balancing pre-rolling tiene issues, pero continuando..."
          fi
        EOF

    - name: Rolling Update
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Variables de entorno
          export FRONTEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}"
          
          # Ejecutar rolling update
          chmod +x scripts/deploy/rolling_update.sh
          bash scripts/deploy/rolling_update.sh
        EOF

    - name: Cleanup
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Ejecutar cleanup
          chmod +x scripts/deploy/cleanup.sh
          bash scripts/deploy/cleanup.sh
          
          # Logout de Docker
          docker logout
        EOF

    - name: Verify
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/workplace
          docker compose ps | grep Up
        EOF
      if: always()

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'failure'

    steps:
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Copy rollback script
      run: |
        scp -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          scripts/deploy/rollback.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deploy/ || echo "Rollback script already exists"

    - name: Complete Rollback
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Variables de entorno
          export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          
          # Ejecutar rollback
          chmod +x scripts/deploy/rollback.sh
          bash scripts/deploy/rollback.sh
        EOF
