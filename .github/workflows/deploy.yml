# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Fixed secrets validation - using proper GitHub Actions syntax
name: Production Deploy

concurrency:
  group: production-deploy
  cancel-in-progress: true

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging/production)'
        required: false
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      force_rollback:
        description: 'Ejecutar rollback manual si el deploy falla'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.sha) }}
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:${{ github.event_name == 'release' && github.event.release.tag_name || format('main-{0}', github.sha) }}
  DEPLOY_TIMEOUT: '25'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ─── 0. Validación de Secrets ───────────────────────────────────────────────
  validate-secrets:
    name: Validar Secrets Requeridos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Validar secrets requeridos
      run: |
        echo "🔍 Validando secrets requeridos..."
        
        # Validar DOCKER_USERNAME
        if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
          echo "❌ Secret DOCKER_USERNAME no configurado"
          exit 1
        fi
        
        # Validar DOCKER_PASSWORD
        if [[ -z "${{ secrets.DOCKER_PASSWORD }}" ]]; then
          echo "❌ Secret DOCKER_PASSWORD no configurado"
          exit 1
        fi
        
        # Validar SSH_PRIVATE_KEY
        if [[ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]]; then
          echo "❌ Secret SSH_PRIVATE_KEY no configurado"
          exit 1
        fi
        
        echo "✅ Todos los secrets requeridos están configurados"
        echo "📋 DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}"

  # ─── 1. Tests unitarios ────────────────────────────────────────────────────
  test:
    name: Tests con Coverage
    runs-on: ubuntu-latest
    needs: validate-secrets
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - uses: ./.github/actions/setup-tests
      with:
        node-version: '22'

    - name: Ejecutar tests
      uses: ./.github/actions/run-tests
      with:
        coverage-threshold: '5'

  # ─── 2. Tests E2E ──────────────────────────────────────────────────────────
  e2e-tests:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: [validate-secrets, test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - name: Cache E2E dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.pnpm-store
          e2e-tests/node_modules
        key: ${{ runner.os }}-e2e-pnpm-${{ hashFiles('e2e-tests/**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-e2e-pnpm-

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Ejecutar tests E2E
      run: |
        chmod +x scripts/ci/run-e2e-optimized.sh
        ./scripts/ci/run-e2e-optimized.sh

    - name: Logs de diagnóstico si falla
      if: failure()
      run: |
        cd e2e-tests
        echo "=== Estado de contenedores ==="
        docker compose -f docker-compose.test.yml ps
        echo "=== Logs test-backend ==="
        docker compose -f docker-compose.test.yml logs test-backend --tail 100
        echo "=== Logs postgres ==="
        docker compose -f docker-compose.test.yml logs postgres --tail 30
        echo "=== Inspect healthcheck test-backend ==="
        docker inspect e2e-tests-test-backend-1 --format='{{json .State.Health}}' 2>/dev/null || true

    - name: Subir reporte Playwright
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30

  # ─── 3. Build imágenes Docker (paralelo) ───────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [validate-secrets, test, e2e-tests]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - uses: actions/checkout@v3
    - uses: ./.github/actions/build-image
      with:
        service: backend
        dockerfile: ./backend/Dockerfile.prod
        image-name: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        image-tag: main-${{ github.sha }}
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-password: ${{ secrets.DOCKER_PASSWORD }}
        github-token: ${{ secrets.WORKPLACE_PAT }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [validate-secrets, test, e2e-tests]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - uses: actions/checkout@v3
    - uses: ./.github/actions/build-image
      with:
        service: frontend
        dockerfile: ./frontend/Dockerfile.prod
        image-name: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        image-tag: main-${{ github.sha }}
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-password: ${{ secrets.DOCKER_PASSWORD }}
        github-token: ${{ secrets.WORKPLACE_PAT }}
        build-args: |
          USE_DEMO=${{ vars.USE_DEMO || 'false' }}
          APP_ENV=production
          API_URL=${{ vars.API_URL || '/api' }}

  # ─── 4. Deploy a staging ────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event.inputs.environment == 'staging'
    timeout-minutes: 20
    environment: 
      name: staging
      url: https://staging.${{ vars.PRODUCTION_DOMAIN }}
    permissions:
      contents: read
      deployments: write
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.STAGING_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - uses: ./.github/actions/deploy-server
      with:
        ssh-user: ${{ secrets.STAGING_USER }}
        ssh-host: ${{ secrets.STAGING_HOST }}
        backend-image: ${{ env.BACKEND_IMAGE }}
        frontend-image: ${{ env.FRONTEND_IMAGE }}
        current-sha: ${{ github.sha }}
        acme-email: ${{ secrets.ACME_EMAIL }}

        domain: staging.${{ vars.PRODUCTION_DOMAIN }}

  # Smoke test staging
  smoke-test-staging:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.STAGING_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Health Check con Reintentos
      id: check-staging
      run: |
        DOMAIN="staging.${{ vars.PRODUCTION_DOMAIN }}"
        if [ -z "$DOMAIN" ]; then
          echo "STAGING_DOMAIN no configurado - omitiendo smoke test"
          exit 0
        fi
        
        echo "Verificando staging en $DOMAIN..."
        
        # Verificar SSL
        for i in {1..5}; do
          if echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -dates >/dev/null 2>&1; then
            echo "✅ Certificado SSL válido"
            break
          else
            echo "⏳ Verificando SSL... intento $i/5"
            [ $i -lt 5 ] && sleep 5
          fi
        done
        
        # Verificar backend con reintentos
        for i in {1..12}; do
          if curl -f -s --max-time 10 "https://$DOMAIN/api/health" >/dev/null; then
            echo "✅ Backend saludable en intento $i"
            break
          else
            echo "⏳ Verificando backend... intento $i/12"
            [ $i -lt 12 ] && sleep 10
          fi
        done
        
        # Verificar frontend con reintentos
        for i in {1..8}; do
          if curl -f -s --max-time 10 "https://$DOMAIN/" >/dev/null; then
            echo "✅ Frontend saludable en intento $i"
            break
          else
            echo "⏳ Verificando frontend... intento $i/8"
            [ $i -lt 8 ] && sleep 10
          fi
        done
        
        # Validación interna servicios críticos
        echo "Validando servicios internos críticos..."
        
        # Verificar conexión a base de datos (si endpoint disponible)
        if curl -f -s --max-time 5 "https://$DOMAIN/api/health/db" >/dev/null 2>&1; then
          echo "✅ DB connection OK"
        else
          echo "⚠️ WARNING: No se puede validar DB connection"
        fi
        
        # Verificar Redis (si endpoint disponible)
        if curl -f -s --max-time 5 "https://$DOMAIN/api/health/redis" >/dev/null 2>&1; then
          echo "✅ Redis connection OK"
        else
          echo "⚠️ WARNING: No se puede validar Redis connection"
        fi
        
        # Verificar readiness state
        if curl -f -s --max-time 5 "https://$DOMAIN/api/ready" >/dev/null; then
          echo "✅ Application ready state OK"
        else
          echo "⚠️ WARNING: Application no está en ready state"
        fi
        
        echo "🎉 Smoke test staging exitoso con validación interna"
        echo "staging_url=https://$DOMAIN" >> $GITHUB_OUTPUT

  # ─── 5. Deploy a producción ────────────────────────────────────────────────
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, deploy-staging, smoke-test-staging]
    if: github.event.inputs.environment == 'production' || github.event_name == 'release'
    timeout-minutes: 25
    environment: 
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    permissions:
      contents: read
      deployments: write
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Create deployment
      id: deployment
      uses: actions/github-script@v6
      with:
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            task: 'deploy',
            environment: 'production',
            description: `Deploy to production - SHA: ${context.sha.substring(0, 7)}`,
            payload: {
              backend_image: '${{ env.BACKEND_IMAGE }}',
              frontend_image: '${{ env.FRONTEND_IMAGE }}',
              sha: '${{ github.sha }}'
            }
          });
          console.log('Deployment created:', deployment.data.id);
          return deployment.data.id;

    - uses: ./.github/actions/deploy-server
      with:
        ssh-user: ${{ secrets.PRODUCTION_USER }}
        ssh-host: ${{ secrets.PRODUCTION_HOST }}
        backend-image: ${{ env.BACKEND_IMAGE }}
        frontend-image: ${{ env.FRONTEND_IMAGE }}
        current-sha: ${{ github.sha }}
        acme-email: ${{ secrets.ACME_EMAIL }}
        domain: ${{ vars.PRODUCTION_DOMAIN }}

    - name: Registrar Métricas
      run: |
        echo "📊 Deploy duration: ${{ job.status }}"
        echo "📊 SHA: ${{ github.sha }}"
        echo "📊 Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "📊 Actor: ${{ github.actor }}"

    - name: Update deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const deploymentId = '${{ steps.deployment.outputs.result }}';
          const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: parseInt(deploymentId),
            state: status,
            environment_url: 'https://${{ vars.PRODUCTION_DOMAIN }}',
            log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });
          
          console.log(`Deployment status updated to: ${status}`);

  # ─── 5. Rollback manual ────────────────────────────────────────────────────
  rollback:
    name: Rollback Manual
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.inputs.force_rollback == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - uses: ./.github/actions/rollback
      with:
        ssh-user: ${{ secrets.PRODUCTION_USER }}
        ssh-host: ${{ secrets.PRODUCTION_HOST }}

  # ─── 6. Rollback automático ───────────────────────────────────────────────────
  rollback-auto:
    name: Rollback Automático
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: needs.smoke-test.result == 'failure'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Rollback Automático
      run: |
        echo "🚨 Iniciando rollback automático debido a fallo en smoke test"
        echo "🔄 SHA actual: ${{ github.sha }}"
        
        # Obtener imagen anterior del registry
        PREVIOUS_SHA=$(git rev-parse HEAD~1)
        echo "📦 Rollback a SHA: $PREVIOUS_SHA"
        
        # Ejecutar rollback action
        # (asumimos que la action rollback maneja la lógica específica)
        # Aquí podrías añadir lógica adicional si es necesario
  # ─── 7. Smoke test externo ─────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test Externo
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: SSH Hardening
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Health Check con Reintentos
      id: check
      run: |
        DOMAIN="${{ vars.PRODUCTION_DOMAIN }}"
        if [ -z "$DOMAIN" ]; then
          echo "PRODUCTION_DOMAIN no configurado — omitiendo smoke test"
          exit 0
        fi

        echo "🔍 Smoke test para: $DOMAIN"
        
        # Verificar SSL primero
        for i in {1..5}; do
          SSL_OK=false
          if echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | grep -q "Verify return code: 0"; then
            SSL_OK=true
            echo "✅ SSL válido en intento $i"
            break
          else
            echo "⏳ Verificando SSL... intento $i/5"
            [ $i -lt 5 ] && sleep 5
          fi
        done
        
        # Verificar servicios con reintentos
        for i in {1..12}; do
          BACKEND_HTTP=$(curl -so /dev/null -w "%{http_code}" --max-time 15 \
            "https://$DOMAIN/api/ready" 2>/dev/null || echo "000")
          FRONTEND_HTTP=$(curl -so /dev/null -w "%{http_code}" --max-time 15 \
            "https://$DOMAIN" 2>/dev/null || echo "000")

          echo "🔍 Intento $i/12 — Backend: $BACKEND_HTTP | Frontend: $FRONTEND_HTTP | SSL: $SSL_OK"

          if [[ "$BACKEND_HTTP" =~ ^(200|204)$ ]] && \
             [[ "$FRONTEND_HTTP" =~ ^(200|301|302)$ ]] && \
             [ "$SSL_OK" = true ]; then
            echo "🎉 Smoke test PASADO"
            exit 0
          fi
          [ $i -lt 12 ] && sleep 10
        done

        echo "❌ Smoke test FALLO — diagnóstico del servidor:"
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
          "cd /opt/workplace
           COMPOSE='docker compose -f docker-compose.lite.yml'
           echo '=== Contenedores ==='
           \$COMPOSE ps
           echo '=== Routers Traefik ==='
           curl -sf http://localhost:8080/api/http/routers 2>/dev/null \
             | python3 -c \"import sys,json; [print(r.get('name'), r.get('status')) for r in json.load(sys.stdin)]\" || echo 'API Traefik no disponible'
           echo '=== Logs Traefik (ultimas 10 lineas) ==='
           docker logs traefik --tail 10 2>&1
           echo '=== UFW puertos 80/443 ==='
           ufw status | grep -E '80|443' || true" || true
        exit 1

  # ─── 8. Notificación ───────────────────────────────────────────────────────
  notify:
    name: Notificar Estado
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test, rollback-auto]
    if: always()
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3

    - name: Determinar Estado Final
      id: status
      run: |
        if [[ "${{ needs.deploy.result }}" == "success" && "${{ needs.smoke-test.result }}" != "failure" && "${{ needs.rollback-auto.result }}" != "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=🎉 Deploy exitoso a producción" >> $GITHUB_OUTPUT
        elif [[ "${{ needs.rollback-auto.result }}" == "success" ]]; then
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=🚨 Deploy falló con rollback automático" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=❌ Deploy falló" >> $GITHUB_OUTPUT
        fi

    - uses: ./.github/actions/notify
      with:
        status: ${{ steps.status.outputs.status }}
        repository: ${{ github.repository }}
        branch: ${{ github.ref_name }}
        sha: ${{ github.sha }}
        actor: ${{ github.actor }}
        message: ${{ steps.status.outputs.message }}
        discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
        slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
