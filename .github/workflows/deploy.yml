name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

  buildeploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.force_deploy == 'true')
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Validate production deployment
      run: |
        set -e
        echo "🔍 Validando entorno de producción..."
        
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "❌ Solo permitido en main"
          exit 1
        fi
        
        if [ "$GITHUB_EVENT_NAME" == "push" ]; then
          COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          if echo "$COMMIT_MESSAGE" | grep -q "Merge branch 'develop'"; then
            echo "❌ Merges desde develop bloqueados"
            exit 1
          fi
        fi
        
        echo "✅ Validación OK"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Set image tags
      run: |
        echo "BACKEND_IMAGE_TAG=main-${{ github.sha }}" >> $GITHUB_ENV
        echo "FRONTEND_IMAGE_TAG=main-${{ github.sha }}" >> $GITHUB_ENV
        echo "🏷️ Backend image tag: main-${{ github.sha }}"
        echo "🏷️ Frontend image tag: main-${{ github.sha }}"

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      

    - name: Build and push backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Verify built images
      run: |
        echo "🔍 Verificando imágenes construidas..."
        
        # Probar que el backend se ejecute correctamente
        echo "🧪 Testeando backend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        docker run --rm -d --name test-backend \
          -e NODE_ENV=production \
          -e DATABASE_URL="sqlite:memory:" \
          -e REDIS_HOST="localhost" \
          -e REDIS_PORT=6379 \
          -e REDIS_PASSWORD="test" \
          -e DISABLE_DB_CONNECTION=true \
          -p 3001:3001 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        # Esperar hasta 60s a que el health check responda
        echo "⏳ Esperando health check del backend (hasta 60s)..."
        if timeout 60 bash -c 'until curl -f http://localhost:3001/api/health; do sleep 2; done'; then
          echo "✅ Backend health check OK"
        else
          echo "❌ Backend health check falló después de 60s"
          docker logs test-backend --tail=30
          docker stop test-backend
          exit 1
        fi
        
        # Verificaciones adicionales
        if docker exec test-backend test -d "/app/backend/dist"; then
          echo "✅ Backend dist folder exists"
        else
          echo "❌ Backend dist folder missing"
          docker stop test-backend
          exit 1
        fi
        
        if docker exec test-backend test -f "/app/backend/package.json"; then
          echo "✅ Backend package.json exists"
        else
          echo "❌ Backend package.json missing"
          docker stop test-backend
          exit 1
        fi
        
        docker stop test-backend
        echo "✅ Backend verificado correctamente"
        
        # Probar que el frontend se ejecute correctamente
        echo "🧪 Testeando frontend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        docker run --rm -d --name test-frontend \
          -e BACKEND_API_URL=http://localhost:3001/api \
          -e NITRO_HOST=0.0.0.0 \
          -e NITRO_PORT=3000 \
          -p 3000:3000 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        # Esperar hasta 60s a que el health check responda
        echo "⏳ Esperando health check del frontend (hasta 60s)..."
        if timeout 60 bash -c 'until curl -f http://localhost:3000/; do sleep 2; done'; then
          echo "✅ Frontend health check OK"
        else
          echo "❌ Frontend health check falló después de 60s"
          docker logs test-frontend --tail=30
          docker stop test-frontend
          exit 1
        fi
        
        # Verificaciones adicionales
        if docker exec test-frontend test -d "/app/.output"; then
          echo "✅ Frontend .output folder exists"
        else
          echo "❌ Frontend .output folder missing"
          docker stop test-frontend
          exit 1
        fi
        
        if docker exec test-frontend test -f "/app/package.json"; then
          echo "✅ Frontend package.json exists"
        else
          echo "❌ Frontend package.json missing"
          docker stop test-frontend
          exit 1
        fi
        
        docker stop test-frontend
        echo "✅ Frontend verificado correctamente"
        
        echo "🎉 Todas las imágenes verificadas correctamente"

  deploy:
    needs: buildeploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'

    steps:
    - uses: actions/checkout@v6

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS (Rolling Update)
      run: |
        set -euo pipefail
        
        echo "🚀 Iniciando Rolling Update..."
        
        # Copiar archivos de configuración
        echo "📁 Copiando configuración..."
        scp docker-compose.prod.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/docker-compose.yml
        scp nginx/nginx.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/nginx.conf
        scp nginx/conf.d/default.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/conf.d/default.conf
        scp scripts/setup-ssl-v2.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/setup-ssl-v2.sh
        scp scripts/backup-postgres.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/backup-postgres.sh
        scp scripts/production-monitor.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/production-monitor.sh
        
        # Ejecutar deploy rolling update
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          
          echo "� Rolling Update en producción..."
          cd /opt/workplace
          
          # Evitar deploys simultáneos
          if [ -f ".deploy.lock" ]; then
            echo "❌ Deploy en progreso, abortando..."
            exit 1
          fi
          
          # Crear lock file
          touch .deploy.lock
          trap "rm -f .deploy.lock" EXIT
          
          # Login a Docker Hub
          echo "� Login Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Pull nuevas imágenes con tags consistentes
          echo "⬇️ Pull nuevas imágenes..."
          echo "🏷️ Backend tag: main-${{ github.sha }}"
          echo "🏷️ Frontend tag: main-${{ github.sha }}"
          
          docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
          
          # Taggear como latest para el deploy
          docker tag ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/workplace-backend:latest
          docker tag ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:latest
          
          # Backup de imágenes actuales
          echo "💾 Backup de imágenes actuales..."
          if docker image inspect workplace-backend:latest > /dev/null 2>&1; then
            docker tag workplace-backend:latest workplace-backend:backup-$(date +%s)
          fi
          if docker image inspect workplace-frontend:latest > /dev/null 2>&1; then
            docker tag workplace-frontend:latest workplace-frontend:backup-$(date +%s)
          fi
          
          # Canary Deploy con métricas reales
          echo "🚀 Iniciando Canary Deploy con métricas..."
          
          # Obtener SHA del deploy actual
          CURRENT_SHA="${{ github.sha }}"
          echo "📦 Deployando SHA: $CURRENT_SHA"
          
          # Backup versión actual
          docker compose stop backend
          
          # Deploy canary (misma imagen pero con validación extendida)
          echo "🧪 Desplegando versión canary..."
          docker compose up -d --no-deps backend
          
          # Esperar health check del canary
          echo "⏳ Esperando health check del canary..."
          if ! timeout 60 bash -c 'until curl -f http://localhost:3001/api/health; do sleep 2; done'; then
            echo "❌ Canary health check falló"
            docker compose logs backend --tail=30
            # Restaurar backup si existe
            if docker images | grep -q "workplace-backend:backup"; then
              LATEST_BACKUP=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup" | sort -r | head -n 1)
              docker tag $LATEST_BACKUP ${{ secrets.DOCKER_USERNAME }}/workplace-backend:latest
              docker compose up -d --no-deps backend
            fi
            exit 1
          fi
          
          # Verificar métricas reales por 60 segundos
          echo "📊 Verificando métricas del canary (60s)..."
          CANARY_SUCCESS=true
          
          for i in {1..12}; do
            # Verificar error rate (simulado con health checks)
            if ! curl -f -s http://localhost:3001/api/health > /dev/null; then
              echo "❌ Error detectado en iteración $i"
              CANARY_SUCCESS=false
              break
            fi
            
            # Verificar latencia (debe ser < 1000ms)
            LATENCY=$(curl -o /dev/null -s -w '%{time_total}' http://localhost:3001/api/health | awk '{printf "%.0f", $1*1000}')
            if [ "$LATENCY" -gt 1000 ]; then
              echo "⚠️ Alta latencia detectada: ${LATENCY}ms"
              CANARY_SUCCESS=false
              break
            fi
            
            echo "✅ Métrica OK ($i/12) - Latencia: ${LATENCY}ms"
            sleep 5
          done
          
          if [ "$CANARY_SUCCESS" = "true" ]; then
            echo "✅ Canary exitoso, versión establecida como producción"
          else
            echo "❌ Canary falló, restaurando versión anterior"
            # Restaurar backup más reciente
            LATEST_BACKUP=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup" | sort -r | head -n 1)
            if [ -n "$LATEST_BACKUP" ]; then
              docker tag $LATEST_BACKUP ${{ secrets.DOCKER_USERNAME }}/workplace-backend:latest
              docker compose up -d --no-deps backend
            fi
            exit 1
          fi
          
          # Rolling Update Frontend (nginx no depende de frontend)
          echo "🔄 Actualizando Frontend..."
          
          # Escalar frontend a 2 instancias
          docker compose up -d --scale frontend=2 --no-deps frontend
          
          # Esperar a que la nueva instancia esté healthy
          echo "⏳ Esperando health check del nuevo frontend..."
          timeout 60 bash -c 'until docker compose ps frontend | grep -q "healthy"; do sleep 2; done'
          
          # Detener instancia antigua
          docker compose up -d --scale frontend=1 --no-deps frontend
          
          # Reiniciar nginx para que tome los cambios (depende solo de backend)
          echo "🔄 Reiniciando Nginx..."
          docker compose restart nginx
          
          # Configurar SSL si es necesario
          echo "🔧 Configurando SSL..."
          chmod +x setup-ssl-v2.sh
          ./setup-ssl-v2.sh
          
          # Verificar estado final
          echo "🔍 Verificando estado final..."
          docker compose ps
          
          # Health checks finales (nginx solo depende de backend)
          if ! docker compose ps postgres | grep -q "healthy"; then
            echo "❌ Postgres no está healthy"
            docker compose logs postgres --tail=20
            exit 1
          fi
          
          if ! docker compose ps redis | grep -q "healthy"; then
            echo "❌ Redis no está healthy"
            docker compose logs redis --tail=20
            exit 1
          fi
          
          if ! docker compose ps backend | grep -q "healthy"; then
            echo "❌ Backend no está healthy"
            docker compose logs backend --tail=20
            exit 1
          fi
          
          # Nginx debe estar Up (no necesita estar healthy)
          if ! docker compose ps nginx | grep -q "Up"; then
            echo "❌ Nginx no está Up"
            docker compose logs nginx --tail=20
            exit 1
          fi
          
          # Frontend es opcional para nginx, pero verificamos si está healthy
          if docker compose ps frontend | grep -q "Up" && ! docker compose ps frontend | grep -q "healthy"; then
            echo "⚠️ Frontend está Up pero no healthy (nginx puede servir fallback)"
          fi
          
          echo "✅ Rolling Update completado exitosamente!"
          
          # Cleanup seguro de imágenes antiguas (mantener últimas 10 versiones)
          echo "🧹 Cleanup seguro de imágenes antiguas..."
          
          # Solo hacer cleanup si el deploy fue exitoso
          if docker compose ps | grep -q "healthy"; then
            # Mantener últimas 10 versiones de cada imagen
            docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-" | grep -v "latest" | grep -v "backup" | sort -r | tail -n +11 | xargs -r docker rmi || true
            
            # Limpiar imágenes dangling (sin etiquetas)
            docker image prune -f --filter "until=24h" || true
          else
            echo "⚠️ Omitiendo cleanup por seguridad (servicios no healthy)"
          fi
          
          docker logout
        EOF

    - name: Verify
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/workplace
          docker compose ps | grep Up
        EOF
      if: always()

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'failure'

    steps:
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Complete Rollback
      run: |
        set -euo pipefail
        
        echo "🔄 Iniciando Rollback Completo..."
        
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          
          cd /opt/workplace
          
          echo "🔍 Buscando backup más reciente..."
          
          # Encontrar backup más reciente
          BACKUP_BACKEND=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup" | sort -r | head -n 1)
          BACKUP_FRONTEND=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-frontend:backup" | sort -r | head -n 1)
          
          if [ -z "$BACKUP_BACKEND" ] || [ -z "$BACKUP_FRONTEND" ]; then
            echo "❌ No se encontraron backups para rollback"
            echo "Backups disponibles:"
            docker images --format "{{.Repository}}:{{.Tag}}" | grep backup || echo "No hay backups"
            exit 1
          fi
          
          echo "📦 Usando backups:"
          echo "Backend: $BACKUP_BACKEND"
          echo "Frontend: $BACKUP_FRONTEND"
          
          # Detener servicios actuales
          echo "🔄 Deteniendo servicios actuales..."
          docker compose down
          
          # Hacer rollback de imágenes
          echo "🔄 Haciendo rollback de imágenes..."
          docker tag $BACKUP_BACKEND workplace-backend:latest
          docker tag $BACKUP_FRONTEND workplace-frontend:latest
          
          # Iniciar servicios con versiones anteriores
          echo "🚀 Iniciando servicios con rollback..."
          docker compose up -d
          
          # Esperar a que los servicios inicien
          echo "⏳ Esperando que los servicios inicien..."
          sleep 30
          
          # Verificar health checks post-rollback (nginx solo depende de backend)
          if ! docker compose ps postgres | grep -q "healthy"; then
            echo "❌ Postgres no está healthy después de rollback"
            docker compose logs postgres --tail=20
            exit 1
          fi
          
          if ! docker compose ps redis | grep -q "healthy"; then
            echo "❌ Redis no está healthy después de rollback"
            docker compose logs redis --tail=20
            exit 1
          fi
          
          if ! docker compose ps backend | grep -q "healthy"; then
            echo "❌ Backend no está healthy después de rollback"
            docker compose logs backend --tail=20
            exit 1
          fi
          
          # Nginx debe estar Up (depende solo de backend)
          if ! docker compose ps nginx | grep -q "Up"; then
            echo "❌ Nginx no está Up después de rollback"
            docker compose logs nginx --tail=20
            exit 1
          fi
          
          # Frontend es opcional
          if docker compose ps frontend | grep -q "Up" && ! docker compose ps frontend | grep -q "healthy"; then
            echo "⚠️ Frontend Up pero no healthy después de rollback (nginx puede servir fallback)"
          fi
          
          echo "✅ Rollback completado exitosamente!"
          echo "🎉 Servicios restaurados a versión anterior"
          
          # Limpiar imágenes fallidas
          echo "🧹 Limpiando imágenes fallidas..."
          docker image prune -f
        EOF