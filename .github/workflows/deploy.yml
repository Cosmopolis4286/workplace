name: Production Deploy

concurrency:
  group: production-deploy
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy saltando tests (solo admin)'
        required: false
        default: false
        type: boolean
      force_rollback:
        description: 'Ejecutar rollback manual si el deploy falla'
        required: false
        default: false
        type: boolean

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}

jobs:
  # ─── 1. Tests unitarios ────────────────────────────────────────────────────
  test:
    name: Tests con Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-tests
      with:
        node-version: '22'

    - name: Ejecutar tests
      if: github.event.inputs.force_deploy != 'true' || github.actor != 'admin'
      uses: ./.github/actions/run-tests
      with:
        force-deploy: ${{ github.event.inputs.force_deploy }}
        coverage-threshold: '5'

  # ─── 2. Tests E2E ──────────────────────────────────────────────────────────
  e2e-tests:
    name: Tests E2E
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Ejecutar tests E2E
      run: |
        chmod +x scripts/ci/run-e2e-optimized.sh
        ./scripts/ci/run-e2e-optimized.sh

    - name: Subir reporte Playwright
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30

  # ─── 3. Build imágenes Docker (paralelo) ───────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/build-image
      with:
        service: backend
        dockerfile: ./backend/Dockerfile.prod
        image-name: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        image-tag: main-${{ github.sha }}
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-password: ${{ secrets.DOCKER_PASSWORD }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/build-image
      with:
        service: frontend
        dockerfile: ./frontend/Dockerfile.prod
        image-name: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        image-tag: main-${{ github.sha }}
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-password: ${{ secrets.DOCKER_PASSWORD }}

  # ─── 4. Deploy a producción ────────────────────────────────────────────────
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - uses: ./.github/actions/deploy-server
      with:
        ssh-user: ${{ secrets.PRODUCTION_USER }}
        ssh-host: ${{ secrets.PRODUCTION_HOST }}
        backend-image: ${{ env.BACKEND_IMAGE }}
        frontend-image: ${{ env.FRONTEND_IMAGE }}
        current-sha: ${{ github.sha }}
        acme-email: ${{ secrets.ACME_EMAIL }}

    - uses: ./.github/actions/health-check
      with:
        ssh-user: ${{ secrets.PRODUCTION_USER }}
        ssh-host: ${{ secrets.PRODUCTION_HOST }}
        current-sha: ${{ github.sha }}
        backend-image: ${{ env.BACKEND_IMAGE }}
        frontend-image: ${{ env.FRONTEND_IMAGE }}

  # ─── 5. Rollback manual ────────────────────────────────────────────────────
  rollback:
    name: Rollback Manual
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'failure' && github.event.inputs.force_rollback == 'true'
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - uses: ./.github/actions/rollback
      with:
        ssh-user: ${{ secrets.PRODUCTION_USER }}
        ssh-host: ${{ secrets.PRODUCTION_HOST }}

  # ─── 6. Smoke test externo ─────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test Externo
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    timeout-minutes: 5
    steps:
    - name: Verificar desde internet
      id: check
      run: |
        DOMAIN="${{ secrets.PRODUCTION_DOMAIN }}"
        if [ -z "$DOMAIN" ]; then
          echo "PRODUCTION_DOMAIN no configurado — omitiendo smoke test"
          exit 0
        fi

        echo "Smoke test para: $DOMAIN"
        for i in $(seq 1 12); do
          echo "Intento $i/12..."
          BACKEND_HTTP=$(curl -so /dev/null -w "%{http_code}" --max-time 15 \
            "https://$DOMAIN/api/ready" 2>/dev/null || echo "000")
          FRONTEND_HTTP=$(curl -so /dev/null -w "%{http_code}" --max-time 15 \
            "https://$DOMAIN" 2>/dev/null || echo "000")
          SSL_OK=false
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" \
            2>/dev/null | grep -q "Verify return code: 0" && SSL_OK=true

          echo "  Backend: $BACKEND_HTTP | Frontend: $FRONTEND_HTTP | SSL: $SSL_OK"

          if [[ "$BACKEND_HTTP" =~ ^(200|204)$ ]] && \
             [[ "$FRONTEND_HTTP" =~ ^(200|301|302)$ ]] && \
             [ "$SSL_OK" = true ]; then
            echo "Smoke test PASADO"
            exit 0
          fi
          [ $i -lt 12 ] && sleep 10
        done

        echo "Smoke test FALLO (advertencia — el health-check interno ya valido los servicios)"
        exit 1

  # ─── 7. Notificación ───────────────────────────────────────────────────────
  notify:
    name: Notificar Estado
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/notify
      with:
        status: ${{ needs.deploy.result == 'success' && needs.smoke-test.result != 'failure' && 'success' || 'failure' }}
        repository: ${{ github.repository }}
        branch: ${{ github.ref_name }}
        sha: ${{ github.sha }}
        actor: ${{ github.actor }}
        discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
        slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
