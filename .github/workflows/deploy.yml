name: Production Deploy (Pipeline Híbrido)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy incluso si los tests fallan'
        required: false
        default: false
        type: boolean
      force_rollback:
        description: 'Forzar rollback si el deployment falla'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  # 1. Tests Unitarios con Coverage (YAML para setup + Shell para lógica) - COMENTADO TEMPORALMENTE
  # test:
