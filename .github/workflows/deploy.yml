name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile
      timeout-minutes: 5

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test
      timeout-minutes: 10

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      timeout-minutes: 5
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

  buildeploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.force_deploy == 'true')
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate production deployment
      run: |
        echo "🔍 Validando entorno de producción..."
        
        # Verificar que es la rama correcta
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "❌ Error: Este workflow solo debe ejecutarse en la rama main"
          echo "📋 Rama actual: $GITHUB_REF"
          echo "🚨 Evento: $GITHUB_EVENT_NAME"
          exit 1
        fi
        
        # Verificar que no es un push automático desde develop
        if [ "$GITHUB_EVENT_NAME" == "push" ]; then
          # Obtener información del commit para verificar si viene de develop
          COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          if echo "$COMMIT_MESSAGE" | grep -q "Merge branch 'develop'"; then
            echo "❌ Error: Los merges desde develop están bloqueados en producción"
            echo "📋 Mensaje del commit: $COMMIT_MESSAGE"
            echo "🔄 Por favor, usa workflow_dispatch para despliegues manuales"
            exit 1
          fi
        fi
        
        echo "✅ Validación exitosa - Desplegando a producción"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: buildeploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o ConnectionAttempts=3 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -e
          
          echo "🚀 Starting deployment at $(date)"
          
          # Login a Docker Hub para repositorio private
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Verificar directorio
          echo "🔍 Verificando directorio: /opt/workplace"
          if [ ! -d "/opt/workplace" ]; then
            echo "❌ El directorio no existe: /opt/workplace"
            echo "🔧 Creando estructura de directorios..."
            mkdir -p /opt/workplace
            echo "✅ Estructura creada"
          fi
          
          cd /opt/workplace
          
          # Verificar Docker está corriendo
          if ! docker info > /dev/null 2>&1; then
            echo "❌ Docker no está disponible"
            exit 1
          fi
          
          echo "💾 Backup de Postgres"
          BACKUP_FILE="backup_$(date +%F_%H-%M-%S).sql"
          POSTGRES_USER=workplace
          if docker exec -t workplace_postgres pg_dumpall -U $POSTGRES_USER > "$BACKUP_FILE"; then
            echo "✅ Backup completado: $BACKUP_FILE"
          else
            echo "⚠️ Backup falló, continuando deploy..."
          fi

          echo "⬇️ Actualizando contenedores"
          docker pull ${{ secrets.DOCKER_USERNAME }}/workplace:main
          docker tag ${{ secrets.DOCKER_USERNAME }}/workplace:main workplace-backend:latest
          docker compose build --no-cache
          
          echo "🔄 Deteniendo servicios"
          docker compose down
          
          echo "🚀 Iniciando servicios"
          docker compose up -d
          
          echo "⏳ Esperando health checks..."
          sleep 30
          
          # Health checks
          echo "🔍 Verificando health de servicios"
          POSTGRES_HEALTH=$(docker compose ps -q postgres | xargs docker inspect --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
          REDIS_HEALTH=$(docker compose ps -q redis | xargs docker inspect --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
          BACKEND_HEALTH=$(docker compose ps -q backend | xargs docker inspect --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
          
          echo "Postgres Health: $POSTGRES_HEALTH"
          echo "Redis Health: $REDIS_HEALTH"
          echo "Backend Health: $BACKEND_HEALTH"
          
          if [[ "$POSTGRES_HEALTH" == "healthy" && "$REDIS_HEALTH" == "healthy" ]]; then
            echo "✅ Deploy completado exitosamente"
            
            # Limpiar imágenes antiguas
            docker image prune -f
            
            # Logout de Docker Hub
            docker logout
            
            # Notificación (opcional)
            if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
              curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                -H 'Content-type: application/json' \
                --data "{\"text\":\"✅ Workplace deployed successfully to production\"}"
            fi
          else
            echo "❌ Deploy falló - servicios no saludables"
            docker logout
            exit 1
          fi
        EOF

    - name: Health check verification
      run: |
        sleep 10
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/workplace
          
          # Verificar que los contenedores estén corriendo
          if ! docker compose ps | grep -q "Up"; then
            echo "❌ Contenedores no están corriendo"
            exit 1
          fi
          
          echo "✅ Verificación final completada"
        EOF
      if: always()

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure() && (github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true')
    timeout-minutes: 15

    steps:
    - name: Debug secrets
      run: |
        echo "=== DEBUG SECRETS ==="
        echo "User: ${{ secrets.PRODUCTION_USER }}"
        echo "Host: ${{ secrets.PRODUCTION_HOST }}"
        echo "Docker User: ${{ secrets.DOCKER_USERNAME }}"
        echo "Docker Password length: ${{ secrets.DOCKER_PASSWORD && 'SET' || 'NOT_SET' }}"
        echo "SSH Key length: ${{ secrets.SSH_PRIVATE_KEY && 'SET' || 'NOT_SET' }}"
        echo "=== END DEBUG ==="

    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Rollback deployment
      run: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -e
          
          echo "🔄 Starting rollback at $(date)"
          
          # Login a Docker Hub para repositorio private
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Verificar directorio
          echo "🔍 Verificando directorio: /opt/workplace"
          if [ ! -d "/opt/workplace" ]; then
            echo "❌ El directorio no existe: /opt/workplace"
            exit 1
          fi
          
          cd /opt/workplace
          echo "🔄 Rolling back to previous version..."
          docker-compose down
          
          # Get latest backup image
          BACKUP_IMAGE=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup-" | tail -1)
          
          if [ ! -z "$BACKUP_IMAGE" ]; then
            echo "📦 Usando backup image: $BACKUP_IMAGE"
            docker tag $BACKUP_IMAGE workplace-backend:latest
            docker-compose up -d
            
            echo "⏳ Esperando servicios..."
            sleep 20
            
            echo "✅ Rollback completado"
            
            # Logout de Docker Hub
            docker logout
            
            # Notificación
            if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
              curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                -H 'Content-type: application/json' \
                --data "{\"text\":\"🔄 Workplace rolled back to previous version\"}"
            fi
          else
            echo "❌ No backup image found for rollback"
            echo "📦 Available images:"
            docker images | grep workplace
            docker logout
            exit 1
          fi
        EOF

    - name: Notify rollback
      if: always()
      run: |
        echo "🔄 Rollback process completed"
        echo "Check the application status manually"
