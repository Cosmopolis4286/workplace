name: Production Deploy (Hybrid)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  # 1. Tests Unitarios con Coverage (YAML para setup + Shell para lógica)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Test Environment
      uses: ./.github/actions/setup-tests
      with:
        node-version: '20'

    - name: Run Tests with Coverage
      uses: ./.github/actions/run-tests
      with:
        force-deploy: ${{ github.event.inputs.force_deploy }}
        coverage-threshold: '80'

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # 2. Tests E2E (YAML para setup + Shell para lógica)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '20'

    - name: Run E2E Tests
      shell: bash
      run: |
        chmod +x scripts/ci/run-e2e.sh
        ./scripts/ci/run-e2e.sh

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30

  # 3. Build Docker Images (YAML - estándar)
  build-backend:
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-backend" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-frontend" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 4. Deploy (YAML para setup + Shell para lógica compleja)
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH known hosts (YAML)
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Copy Configuration Files (YAML)
      run: |
        # Copiar archivos base
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          docker-compose.prod.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/
        
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          nginx/nginx.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/
        
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          nginx/conf.d/common.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/conf.d/
        
        # Copiar scripts
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          scripts/deployment/setup-nginx-prod.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deployment/
        
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          -r scripts/deploy/* ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deploy/

    - name: Deploy Infrastructure (Shell - lógica compleja)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Setup nginx
          chmod +x scripts/deployment/setup-nginx-prod.sh
          DOMAIN_NAME='${{ secrets.DOMAIN_NAME || 'localhost' }}' ./scripts/deployment/setup-nginx-prod.sh
          
          # Pre-deploy check
          echo "🔍 Pre-deploy check..."
          if docker compose ps | grep -q "Up"; then
            echo "✅ System running, proceeding with canary"
          else
            echo "⚠️ System not running, starting base services"
            docker compose up -d postgres redis nginx
            sleep 10
          fi
          
          # Canary deployment (lógica compleja)
          echo "🚀 Starting Canary Deployment..."
          export BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
          export FRONTEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}"
          
          if [ -f "scripts/deploy/canary-traffic-split.sh" ]; then
            chmod +x scripts/deploy/canary-traffic-split.sh
            ./scripts/deploy/canary-traffic-split.sh
          else
            echo "❌ Canary script not found, using rolling update"
            docker compose up -d --force-recreate
          fi
          
          echo "✅ Deployment completed"
        EOF

    - name: Post-Deploy Verification (Shell)
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔍 Post-deploy verification..."
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"
          
          # Health checks
          echo "🏥 Health checks:"
          if docker compose exec --no-TTY backend curl -f http://localhost:3001/api/health; then
            echo "✅ Backend health check OK"
          else
            echo "❌ Backend health check FAILED"
            exit 1
          fi
          
          if docker compose exec --no-TTY frontend curl -f http://localhost:3000; then
            echo "✅ Frontend health check OK"
          else
            echo "❌ Frontend health check FAILED"
            exit 1
          fi
          
          echo "✅ Deployment verification completed"
        EOF

  # 5. Notify Success
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
    - name: Deployment Status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "🎉 Deployment completed successfully!"
          echo "📊 Summary:"
          echo "- ✅ Tests passed"
          echo "- ✅ E2E tests passed" 
          echo "- ✅ Images built and pushed"
          echo "- ✅ Infrastructure deployed"
          echo "- ✅ Health checks passed"
        else
          echo "❌ Deployment failed!"
          echo "🔍 Check the logs for details"
        fi
