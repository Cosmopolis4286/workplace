name: Production Deploy (Pipeline Híbrido)

concurrency:
  group: production-deploy
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Forzar deploy incluso si los tests fallan - SOLO ADMIN'
        required: false
        default: false
        type: boolean
      force_rollback:
        description: 'Forzar rollback si el deployment falla'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  # 1. Tests Unitarios con Coverage (YAML para setup + Shell para lógica)
  test:
    name: Ejecutar Tests con Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar Entorno de Tests
      uses: ./.github/actions/setup-tests
      with:
        node-version: '24'

    - name: Ejecutar Tests con Coverage
      if: ${{ !github.event.inputs.force_deploy || github.actor != 'admin' }}
      uses: ./.github/actions/run-tests
      with:
        force-deploy: ${{ github.event.inputs.force_deploy }}
        coverage-threshold: '5'

    - name: Subir Reportes de Coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # 1.5. Backup de Versión Actual (Enterprise)
  backup-current:
    name: Backup Versión Actual
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5
      
    - name: Configurar SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}
    
    - name: Backup Enterprise de Versión Actual
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔄 Backup Enterprise de versión actual..."
          
          # Crear directorio de versiones si no existe
          mkdir -p /opt/workplace/versions
          mkdir -p /opt/workplace/backups/versions
          
          # Obtener información de contenedores actuales (manejar primer deploy)
          echo "🔍 Detectando estado actual..."
          
          # Verificar si hay contenedores corriendo
          if docker compose ps --format "table {{.Name}}" | grep -q "workplace"; then
            echo "📦 Contenedores detectados - extrayendo imágenes..."
            BACKEND_IMAGE=$(docker compose ps -q backend | xargs docker inspect --format='{{.Config.Image}}' 2>/dev/null || echo "unknown")
            FRONTEND_IMAGE=$(docker compose ps -q frontend | xargs docker inspect --format='{{.Config.Image}}' 2>/dev/null || echo "unknown")
            DEPLOY_STATUS="running"
          else
            echo "🚀 Primer deploy detectado - no hay contenedores corriendo"
            BACKEND_IMAGE="none"
            FRONTEND_IMAGE="none"
            DEPLOY_STATUS="first-deploy"
          fi
          
          CURRENT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          
          echo "📦 Imágenes actuales:"
          echo "  Backend: $BACKEND_IMAGE"
          echo "  Frontend: $FRONTEND_IMAGE"
          echo "  SHA: $CURRENT_SHA"
          
          # Guardar versión actual con timestamp
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          VERSION_FILE="/opt/workplace/versions/current-${TIMESTAMP}.env"
          
          cat > "$VERSION_FILE" << VERSIONEOF
          # Versión actual backup - $TIMESTAMP
          BACKEND_CURRENT_IMAGE=$BACKEND_IMAGE
          FRONTEND_CURRENT_IMAGE=$FRONTEND_IMAGE
          CURRENT_SHA=$CURRENT_SHA
          BACKUP_TIMESTAMP=$TIMESTAMP
          DEPLOY_STATUS=current
          VERSIONEOF
          
          # Crear symlink a versión actual
          ln -sf "$VERSION_FILE" /opt/workplace/versions/current.env
          
          # Crear directorios si no existen
          mkdir -p /opt/workplace/backups/versions
          touch /opt/workplace/backups/versions/version_history.txt
          
          # Guardar en archivo de versiones anteriores (máximo 5)
          echo "$TIMESTAMP:$BACKEND_IMAGE:$FRONTEND_IMAGE:$CURRENT_SHA" >> /opt/workplace/backups/versions/version_history.txt
          
          # Mantener solo últimas 5 versiones
          tail -5 /opt/workplace/backups/versions/version_history.txt > /tmp/version_history.tmp && \
          mv /tmp/version_history.tmp /opt/workplace/backups/versions/version_history.txt
          
          # Backup de imágenes locales
          echo "📦 Creando backup de imágenes locales..."
          docker save "$BACKEND_IMAGE" -o "/opt/workplace/backups/versions/backend-${TIMESTAMP}.tar" 2>/dev/null || true
          docker save "$FRONTEND_IMAGE" -o "/opt/workplace/backups/versions/frontend-${TIMESTAMP}.tar" 2>/dev/null || true
          
          # Limpiar backups antiguos (más de 7 días)
          find /opt/workplace/backups/versions/ -name "*.tar" -mtime +7 -delete 2>/dev/null || true
          find /opt/workplace/versions/ -name "*.env" -mtime +7 -delete 2>/dev/null || true
          
          echo "✅ Backup versión actual completado"
          echo "📁 Archivo: $VERSION_FILE"
          echo "📊 Historial: $(wc -l < /opt/workplace/backups/versions/version_history.txt) versiones"
        EOF

  # 2. Tests E2E (YAML para setup + Shell para lógica)
  e2e-tests:
    name: Ejecutar Tests E2E
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar Node.js y pnpm
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '24'

    - name: Ejecutar Tests E2E
      shell: bash
      run: |
        echo "🧪 Running E2E tests with optimized environment..."
        
        # Usar script ultra-optimizado
        chmod +x scripts/ci/run-e2e-optimized.sh
        ./scripts/ci/run-e2e-optimized.sh

    - name: Subir Resultados de Tests E2E
      uses: actions/upload-artifact@v5
      if: always()
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30

  # 3. Construir Imágenes Docker (YAML - estándar)
  build-backend:
    name: Construir Imagen Backend
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout del código
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Establecer tag de imagen
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-backend" >> $GITHUB_OUTPUT

    - name: Extraer metadatos
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Construir y publicar backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:stable
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend:
    name: Construir Imagen Frontend
    runs-on: ubuntu-latest
    needs: [test, e2e-tests]
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout del código
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Establecer tag de imagen
      id: set-tag
      run: |
        echo "tag=main-${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "name=${{ secrets.DOCKER_USERNAME }}/workplace-frontend" >> $GITHUB_OUTPUT

    - name: Extraer metadatos
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Construir y publicar frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:stable
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 4. Deploy a Producción (YAML para setup + Shell para lógica compleja)
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, backup-current]
    timeout-minutes: 30
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: Copiar Archivos de Configuración (YAML)
      run: |
        # Copiar archivos base
        scp -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          docker-compose.lite.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/
        
        # Copiar configuración de Traefik
        scp -r traefik/ ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/
        
        # Copiar scripts
        scp -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          -r scripts/deploy/* ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deploy/

    - name: Deploy de Infraestructura (Shell - lógica compleja)
      run: |
        # Crear archivo .env.deploy con imágenes nuevas pero manteniendo variables del servidor
        cat > /tmp/deploy.env << ENVEOF
        BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        CURRENT_SHA=${{ github.sha }}
        ENVEOF
        
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Combinar variables existentes con nuevas imágenes
          if [ -f ".env" ]; then
            echo "📋 Usando variables existentes del .env del servidor"
            # Copiar .env existente como base
            cp .env .env.deploy
            
            # Reemplazar solo las variables de imágenes
            sed -i '/^BACKEND_IMAGE=/d' .env.deploy
            sed -i '/^FRONTEND_IMAGE=/d' .env.deploy
            sed -i '/^CURRENT_SHA=/d' .env.deploy
          else
            echo "⚠️ No hay .env existente, creando archivo mínimo"
            touch .env.deploy
          fi
        EOF
        
        # Agregar variables de imágenes al .env.deploy
        cat /tmp/deploy.env | ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} 'cat >> /opt/workplace/.env.deploy'
        rm -f /tmp/deploy.env
        
        # Generar y copiar checksum del script canary (supply-chain security)
        if [ -f "scripts/deploy/canary-traffic-split.sh" ]; then
          sha256sum scripts/deploy/canary-traffic-split.sh > /tmp/canary-traffic-split.sh.sha256
          scp /tmp/canary-traffic-split.sh.sha256 ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/deploy/canary-traffic-split.sh.sha256
          rm -f /tmp/canary-traffic-split.sh.sha256
          echo "✅ Checksum del script canary copiado al servidor"
        fi
        
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Lock de infraestructura - evita deploys concurrentes
          exec 200>/tmp/deploy.lock
          echo "🔒 Adquiriendo lock de deploy..."
          if ! flock -n 200; then
            echo "❌ Otro deploy está en progreso. Abortando."
            exit 1
          fi
          echo "✅ Lock adquirido"
          
          # Cargar variables del archivo .env.deploy con trap para limpieza segura
          trap "rm -f .env.deploy" EXIT ERR INT TERM
          
          set -a
          source .env.deploy
          set +a
          
          echo "🔐 Variables de entorno cargadas (archivo se limpiará automáticamente al salir)"
          
          # Verificación pre-deploy
          echo "🔍 Verificación pre-deploy..."
          
          # Logging de FORCE DEPLOY si está activado
          if [ "${FORCE_DEPLOY:-false}" = "true" ] || [ "${FORCE_DEPLOY:-}" = "1" ]; then
            echo "⚠️ FORCE DEPLOY ACTIVADO - Este deploy salta validaciones de calidad"
            echo "👤 Usuario que activó force_deploy: ${{ github.actor }}"
            echo "🕐 Timestamp: $(date -Iseconds)"
            echo "📝 Commit SHA: ${{ github.sha }}"
          fi
          
          if docker compose ps | grep -q "Up"; then
            echo "✅ Sistema corriendo, procediendo con canary"
          else
            echo "⚠️ Sistema no corriendo, iniciando servicios base"
            docker compose --env-file .env.deploy up -d postgres redis traefik
            sleep 10
          fi
          
          # Canary deployment (lógica compleja)
          echo "🚀 Iniciando Canary Deployment..."
          
          if [ -f "scripts/deploy/canary-traffic-split.sh" ]; then
            chmod +x scripts/deploy/canary-traffic-split.sh
            
            # Validación de integridad del script (supply-chain security)
            if [ -f "scripts/deploy/canary-traffic-split.sh.sha256" ]; then
              echo "🔐 Validando integridad del script canary..."
              if sha256sum -c scripts/deploy/canary-traffic-split.sh.sha256; then
                echo "✅ Script canary verificado (SHA256 OK)"
              else
                echo "❌ Error de integridad: el script canary fue modificado"
                echo "🛑 Abortando por seguridad - posible supply-chain attack"
                exit 1
              fi
            else
              echo "⚠️ No hay archivo SHA256 para validar - generando checksum actual"
              sha256sum scripts/deploy/canary-traffic-split.sh > scripts/deploy/canary-traffic-split.sh.sha256
            fi
            
            # DB Migrations pre-deploy (backward compatible only)
            echo "🗄️ Verificando estado de migraciones de base de datos..."
            if docker compose exec -T backend npx prisma migrate status 2>/dev/null | grep -q "Database schema is up to date"; then
              echo "✅ DB schema está actualizado"
            else
              echo "🗄️ Aplicando migraciones pendientes (backward compatible)..."
              # Solo migraciones seguras (no destructive)
              docker compose exec -T backend npx prisma migrate deploy || echo "⚠️ Algunas migraciones fallaron - continuando con precaución"
            fi
            
            echo "🚀 Ejecutando canary deployment..."
            if ./scripts/deploy/canary-traffic-split.sh; then
              echo "✅ Canary deployment completado exitosamente"
            else
              echo "❌ Canary deployment falló - iniciando rollback"
              exit 1
            fi
          else
            echo "❌ Script canary no encontrado, usando rolling update controlado"
            # Deploy idempotente: actualiza solo los servicios cambiados
            docker compose --env-file .env.deploy pull backend frontend
            docker compose --env-file .env.deploy up -d --no-deps backend frontend
          fi
          
          # Limpiar archivo .env.deploy inmediatamente después del uso
          rm -f .env.deploy
          trap - EXIT ERR INT TERM
          
          echo "✅ Deploy completado"
        EOF

    - name: Verificación Post-Deploy (Shell)
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔍 Verificación post-deploy..."
          docker compose ps
          
          # Health checks con rollback automático
          echo "🏥 Health checks:"
          BACKEND_HEALTH=false
          FRONTEND_HEALTH=false
          
          # Health check backend con validación profunda (DB, Redis, auth)
          echo "🏥 Health check backend (ready)..."
          if curl -fs --max-time 10 --retry 3 "http://localhost:3001/api/ready" | grep -q '"status":"ok"\|"status":"healthy"'; then
            echo "✅ Backend health check OK (DB, Redis, auth)"
            BACKEND_HEALTH=true
          else
            echo "❌ Backend health check FAILED (DB/Redis/auth issues)"
            BACKEND_HEALTH=false
          fi
          
          # Health check frontend con validación de estado
          echo "🏥 Health check frontend..."
          if curl -fs --max-time 10 --retry 3 "http://localhost:3000/" | grep -q "WorkPlace\|200 OK\|Nuxt" || curl -fs --max-time 10 --retry 3 "http://localhost:3000/api/ready" | grep -q '"ready":true'; then
            echo "✅ Frontend health check OK (servicio activo)"
            FRONTEND_HEALTH=true
          else
            echo "❌ Frontend health check FAILED"
            FRONTEND_HEALTH=false
          fi
          
          # Verificación final y rollback si es necesario
          if [ "$BACKEND_HEALTH" = true ] && [ "$FRONTEND_HEALTH" = true ]; then
            echo "✅ Todos los health checks pasaron - Deploy exitoso!"
            echo "🎉 Verificación de deploy completada exitosamente"
            
            # Crear backup de versión actual para futuros rollbacks
            echo "📦 Creando backup de versión actual..."
            mkdir -p /opt/workplace/versions /opt/workplace/backups/versions /opt/workplace/logs
            
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            VERSION_FILE="/opt/workplace/versions/current-${TIMESTAMP}.env"
            
            # Obtener imágenes actuales
            BACKEND_IMAGE=$(docker inspect workplace-backend-1 --format='{{.Config.Image}}' 2>/dev/null || echo "workplace-backend")
            FRONTEND_IMAGE=$(docker inspect workplace-frontend-1 --format='{{.Config.Image}}' 2>/dev/null || echo "workplace-frontend")
            CURRENT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
            
            # Crear versión de referencia
            cat > "$VERSION_FILE" << VERSIONEOF
# Versión actual backup - $TIMESTAMP
BACKEND_CURRENT_IMAGE=$BACKEND_IMAGE
FRONTEND_CURRENT_IMAGE=$FRONTEND_IMAGE
CURRENT_SHA=$CURRENT_SHA
BACKUP_TIMESTAMP=$TIMESTAMP
DEPLOY_STATUS=current
VERSIONEOF
            
            # Crear symlink y guardar historial
            ln -sf "$VERSION_FILE" /opt/workplace/versions/current.env
            echo "$TIMESTAMP:$BACKEND_IMAGE:$FRONTEND_IMAGE:$CURRENT_SHA" >> /opt/workplace/backups/versions/version_history.txt
            touch /opt/workplace/logs/rollback-history.log
            
            echo "✅ Backup de versión actual creado:"
            echo "  📁 Archivo: $VERSION_FILE"
            echo "  🔗 Symlink: /opt/workplace/versions/current.env"
            echo "  � Historial: $(wc -l < /opt/workplace/backups/versions/version_history.txt) versiones"
            
          else
            echo "�🚨 Health checks fallaron - Verificando si es primer deploy..."
            
            # Verificar si es primer deploy (no hay versión estable)
            if [ ! -f "/opt/workplace/versions/current.env" ]; then
              echo "🚀 Primer deploy detectado - Creando backup de referencia..."
              
              # Crear backup de referencia para primer deploy
              mkdir -p /opt/workplace/versions /opt/workplace/backups/versions /opt/workplace/logs
              
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              VERSION_FILE="/opt/workplace/versions/current-${TIMESTAMP}.env"
              
              # Obtener imágenes actuales (incluso si health checks fallaron)
              BACKEND_IMAGE=$(docker inspect workplace-backend-1 --format='{{.Config.Image}}' 2>/dev/null || echo "workplace-backend")
              FRONTEND_IMAGE=$(docker inspect workplace-frontend-1 --format='{{.Config.Image}}' 2>/dev/null || echo "workplace-frontend")
              CURRENT_SHA=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
              
              # Crear versión de referencia
              cat > "$VERSION_FILE" << VERSIONEOF
# Versión actual backup - $TIMESTAMP (Primer Deploy)
BACKEND_CURRENT_IMAGE=$BACKEND_IMAGE
FRONTEND_CURRENT_IMAGE=$FRONTEND_IMAGE
CURRENT_SHA=$CURRENT_SHA
BACKUP_TIMESTAMP=$TIMESTAMP
DEPLOY_STATUS=first-deploy-health-failed
VERSIONEOF
              
              # Crear symlink y guardar historial
              ln -sf "$VERSION_FILE" /opt/workplace/versions/current.env
              echo "$TIMESTAMP:$BACKEND_IMAGE:$FRONTEND_IMAGE:$CURRENT_SHA" >> /opt/workplace/backups/versions/version_history.txt
              touch /opt/workplace/logs/rollback-history.log
              
              echo "✅ Backup de primer deploy creado:"
              echo "  📁 Archivo: $VERSION_FILE"
              echo "  🔗 Symlink: /opt/workplace/versions/current.env"
              echo "  📊 Estado: Health checks fallaron pero versión guardada"
              echo "  ⚠️ Deploy requiere intervención manual para diagnóstico"
              
              # Diagnóstico del primer deploy
              echo "📊 Diagnóstico del primer deploy..."
              docker compose ps > /tmp/first-deploy-state.log
              docker logs workplace-backend-1 --tail 50 > /tmp/backend-first-deploy.log 2>/dev/null || true
              docker logs workplace-frontend-1 --tail 50 > /tmp/frontend-first-deploy.log 2>/dev/null || true
              
              echo "🔍 Logs guardados en /tmp/ para diagnóstico manual"
              echo "📧 Requiere intervención manual para verificar configuración"
              exit 1
              
            else
              echo "🔄 Deploy con versión estable detectada - Iniciando rollback enterprise..."
            
            # Diagnóstico y backup del estado fallido
            echo "📊 Diagnóstico del estado fallido..."
            docker compose ps > /tmp/failed-deploy-state.log
            docker logs workplace-backend-1 --tail 100 > /tmp/backend-failed.log 2>/dev/null || true
            docker logs workplace-frontend-1 --tail 100 > /tmp/frontend-failed.log 2>/dev/null || true
            
            # Cargar última versión estable
            echo "🔄 Cargando última versión estable..."
            if [ -f "/opt/workplace/versions/current.env" ]; then
              source /opt/workplace/versions/current.env
              echo "📦 Versión a restaurar:"
              echo "  Backend: $BACKEND_CURRENT_IMAGE"
              echo "  Frontend: $FRONTEND_CURRENT_IMAGE"
              echo "  SHA: $CURRENT_SHA"
              echo "  Timestamp: $BACKUP_TIMESTAMP"
              
              # Verificar que las imágenes existen localmente
              BACKEND_AVAILABLE=false
              FRONTEND_AVAILABLE=false
              
              if docker image inspect "$BACKEND_CURRENT_IMAGE" >/dev/null 2>&1; then
                echo "✅ Imagen backend disponible localmente"
                BACKEND_AVAILABLE=true
              elif [ -f "/opt/workplace/backups/versions/backend-${BACKUP_TIMESTAMP}.tar" ]; then
                echo "📦 Cargando backup de imagen backend..."
                if docker load -i "/opt/workplace/backups/versions/backend-${BACKUP_TIMESTAMP}.tar" >/dev/null 2>&1; then
                  echo "✅ Backup backend cargado exitosamente"
                  BACKEND_AVAILABLE=true
                else
                  echo "❌ Error cargando backup backend"
                fi
              else
                echo "🔍 Intentando descargar desde registry..."
                if docker pull "$BACKEND_CURRENT_IMAGE" >/dev/null 2>&1; then
                  echo "✅ Backend descargado del registry"
                  BACKEND_AVAILABLE=true
                else
                  echo "❌ Backend no disponible en registry"
                fi
              fi
              
              if docker image inspect "$FRONTEND_CURRENT_IMAGE" >/dev/null 2>&1; then
                echo "✅ Imagen frontend disponible localmente"
                FRONTEND_AVAILABLE=true
              elif [ -f "/opt/workplace/backups/versions/frontend-${BACKUP_TIMESTAMP}.tar" ]; then
                echo "📦 Cargando backup de imagen frontend..."
                if docker load -i "/opt/workplace/backups/versions/frontend-${BACKUP_TIMESTAMP}.tar" >/dev/null 2>&1; then
                  echo "✅ Backup frontend cargado exitosamente"
                  FRONTEND_AVAILABLE=true
                else
                  echo "❌ Error cargando backup frontend"
                fi
              else
                echo "🔍 Intentando descargar desde registry..."
                if docker pull "$FRONTEND_CURRENT_IMAGE" >/dev/null 2>&1; then
                  echo "✅ Frontend descargado del registry"
                  FRONTEND_AVAILABLE=true
                else
                  echo "❌ Frontend no disponible en registry"
                fi
              fi
              
              if [ "$BACKEND_AVAILABLE" = true ] && [ "$FRONTEND_AVAILABLE" = true ]; then
                echo "� Ejecutando rollback enterprise..."
                
                # Paso 1: Detener servicios fallidos
                echo "🛑 Deteniendo servicios fallidos..."
                docker compose stop backend frontend || true
                docker compose rm -f backend frontend || true
                
                # Paso 2: Limpiar completamente
                echo "🧹 Limpieza completa de recursos..."
                docker system prune -f --volumes || true
                
                # Paso 3: Restaurar con imágenes verificadas
                echo "🔄 Restaurando servicios con versión estable..."
                export BACKEND_IMAGE="$BACKEND_CURRENT_IMAGE"
                export FRONTEND_IMAGE="$FRONTEND_CURRENT_IMAGE"
                
                if docker compose -f docker-compose.lite.yml up -d --no-deps backend frontend; then
                  echo "✅ Servicios restaurados con versión estable"
                  
                  # Paso 4: Verificación enterprise
                  echo "🔍 Verificación enterprise post-rollback..."
                  sleep 20
                  
                  ROLLBACK_SUCCESS=false
                  
                  # Verificación completa con reintentos
                  for i in {1..6}; do
                    echo "🔄 Verificación intento $i/6..."
                    
                    # Backend health check
                    BACKEND_OK=false
                    if curl -fs --max-time 5 "http://localhost:3001/api/ready" | grep -q '"status":"ok"\|"status":"healthy"'; then
                      echo "✅ Backend restaurado y funcional"
                      BACKEND_OK=true
                    fi
                    
                    # Frontend health check  
                    FRONTEND_OK=false
                    if curl -fs --max-time 5 "http://localhost:3000/" | grep -q "WorkPlace\|200 OK\|Nuxt\|html" || \
                       curl -fs --max-time 5 "http://localhost:3000/api/ready" | grep -q '"ready":true'; then
                      echo "✅ Frontend restaurado y funcional"
                      FRONTEND_OK=true
                    fi
                    
                    # Conectividad crítica
                    CRITICAL_OK=false
                    if docker compose exec -T postgres pg_isready -U ${POSTGRES_USER:-workplace} 2>/dev/null && \
                       docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
                      echo "✅ Servicios críticos conectivos"
                      CRITICAL_OK=true
                    fi
                    
                    if [ "$BACKEND_OK" = true ] && [ "$FRONTEND_OK" = true ] && [ "$CRITICAL_OK" = true ]; then
                      echo "🎉 Rollback enterprise completado exitosamente"
                      ROLLBACK_SUCCESS=true
                      break
                    else
                      echo "⏳ Esperando siguiente intento..."
                      sleep 10
                    fi
                  done
                  
                  if [ "$ROLLBACK_SUCCESS" = true ]; then
                    # Guardar registro de rollback exitoso
                    echo "$(date '+%Y-%m-%d %H:%M:%S'): ROLLBACK_EXITOSO: $BACKUP_TIMESTAMP -> $CURRENT_SHA" >> /opt/workplace/logs/rollback-history.log
                    
                    # Notificación de éxito
                    echo "✅ Rollback enterprise completado:"
                    echo "  📦 Versión restaurada: $BACKUP_TIMESTAMP"
                    echo "  🔄 SHA: $CURRENT_SHA"
                    echo "  ⏱️  Tiempo total: $((SECONDS - START_TIME))s"
                    echo "  📊 Logs guardados en /tmp/"
                    
                  else
                    echo "❌ Rollback enterprise falló - Activando modo emergencia"
                    
                    # Modo emergencia con diagnóstico completo
                    echo "🚨 MODO EMERGENCIA ACTIVADO"
                    echo "📋 Estado actual:"
                    docker compose ps
                    echo "📋 Logs de fallo:"
                    ls -la /tmp/*failed*.log
                    
                    # Intentar recuperación mínima
                    echo "🔄 Recuperación de emergencia..."
                    docker compose restart postgres redis traefik
                    
                    if docker compose exec -T postgres pg_isready 2>/dev/null && \
                       docker compose exec -T redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
                      echo "✅ Servicios críticos recuperados"
                      echo "⚠️ Backend/Frontend requieren intervención manual"
                    else
                      echo "❌ Fallo completo del sistema"
                      echo "📧 Contactar administración inmediata"
                    fi
                    
                    exit 1
                  fi
                else
                  echo "❌ Error recreando servicios con versión estable"
                  exit 1
                fi
              else
                echo "❌ Imágenes de versión estable no disponibles"
                echo "📋 Backend disponible: $BACKEND_AVAILABLE"
                echo "📋 Frontend disponible: $FRONTEND_AVAILABLE"
                exit 1
              fi
            else
              echo "❌ No hay versión estable para rollback"
              echo "📁 Archivo /opt/workplace/versions/current.env no encontrado"
              exit 1
            fi
          fi
        EOF

  # 6. Rollback Manual (Independiente - puede ejecutarse manualmente)
  rollback:
    name: Rollback Manual
    runs-on: ubuntu-latest
    # Sin 'needs' - puede ejecutarse independientemente
    if: (failure() && github.event.inputs.force_rollback == 'true') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: Rollback Manual
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Lock de infraestructura
          exec 200>/tmp/deploy.lock
          if ! flock -n 200; then
            echo "❌ Otro deploy/rollback está en progreso. Abortando."
            exit 1
          fi
          
          echo "🔄 Ejecutando rollback manual..."
          
          # Cargar versión anterior si existe
          if [ -f ".previous_version" ]; then
            source .previous_version
            echo "📦 Versión a restaurar:"
            echo "  Backend: $BACKEND_PREVIOUS"
            echo "  Frontend: $FRONTEND_PREVIOUS"
            
            if [ "$BACKEND_PREVIOUS" != "none" ] && [ "$FRONTEND_PREVIOUS" != "none" ]; then
              docker pull $BACKEND_PREVIOUS
              docker pull $FRONTEND_PREVIOUS
              export BACKEND_IMAGE=$BACKEND_PREVIOUS
              export FRONTEND_IMAGE=$FRONTEND_PREVIOUS
              docker compose up -d --no-deps backend frontend
              echo "✅ Rollback a versión anterior completado"
              exit 0
            fi
          fi
          
          # Fallback a scripts
          if [ -f "scripts/deploy/rollback-enhanced.sh" ]; then
            chmod +x scripts/deploy/rollback-enhanced.sh
            ./scripts/deploy/rollback-enhanced.sh
          elif [ -f "scripts/deploy/rollback.sh" ]; then
            chmod +x scripts/deploy/rollback.sh
            ./scripts/deploy/rollback.sh
          else
            echo "❌ No se encontró versión anterior ni script de rollback"
            exit 1
          fi
        EOF

  # 7. Smoke Test Externo (validación desde internet)
  smoke-test:
    name: Smoke Test Externo
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    timeout-minutes: 5
    outputs:
      rollback-needed: ${{ steps.smoke-check.outputs.rollback_needed }}
    
    steps:
    - name: Configurar SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        production-host: ${{ secrets.PRODUCTION_HOST }}

    - name: Verificar desde internet
      id: smoke-check
      run: |
        echo "🌐 Smoke test externo - validando desde internet..."
        
        DOMAIN="${{ secrets.PRODUCTION_DOMAIN }}"
        MAX_RETRIES=12
        RETRY_DELAY=10
        
        for i in $(seq 1 $MAX_RETRIES); do
          echo "🔄 Intento $i/$MAX_RETRIES..."
          
          # Verificar backend API externo
          BACKEND_OK=false
          if curl -fs --max-time 15 "https://api.$DOMAIN/health?deep=true" 2>/dev/null | grep -q '"status":"healthy"'; then
            echo "✅ Backend API responde correctamente"
            BACKEND_OK=true
          else
            echo "⏳ Backend API no responde aún..."
          fi
          
          # Verificar frontend externo
          FRONTEND_OK=false
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://$DOMAIN" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Frontend responde (HTTP $HTTP_CODE)"
            FRONTEND_OK=true
          else
            echo "⏳ Frontend no responde aún (HTTP $HTTP_CODE)..."
          fi
          
          # Verificar SSL/TLS
          SSL_OK=false
          if echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | grep -q "Verify return code: 0"; then
            echo "✅ SSL/TLS válido"
            SSL_OK=true
          else
            echo "⏳ Verificando SSL/TLS..."
          fi
          
          if [ "$BACKEND_OK" = true ] && [ "$FRONTEND_OK" = true ] && [ "$SSL_OK" = true ]; then
            echo "🎉 Smoke test externo PASADO - todos los servicios accesibles desde internet"
            echo "rollback_needed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ $i -lt $MAX_RETRIES ]; then
            echo "⏳ Esperando $RETRY_DELAY segundos..."
            sleep $RETRY_DELAY
          fi
        done
        
        echo "❌ Smoke test externo FALLÓ - servicios no accesibles desde internet"
        echo "rollback_needed=true" >> $GITHUB_OUTPUT
        exit 1

    - name: Rollback Automático por Smoke Test Fallido
      if: failure() && steps.smoke-check.outputs.rollback_needed == 'true'
      run: |
        echo "🚨 Smoke test falló - Ejecutando rollback automático..."
        
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          # Lock de infraestructura
          exec 200>/tmp/deploy.lock
          if ! flock -n 200; then
            echo "❌ Otro deploy/rollback está en progreso. Abortando."
            exit 1
          fi
          
          echo "🔄 Rollback automático por fallo de smoke test..."
          
          # Cargar versión anterior si existe
          if [ -f ".previous_version" ]; then
            source .previous_version
            echo "📦 Restaurando versión anterior:"
            echo "  Backend: $BACKEND_PREVIOUS"
            echo "  Frontend: $FRONTEND_PREVIOUS"
            
            if [ "$BACKEND_PREVIOUS" != "none" ] && [ "$FRONTEND_PREVIOUS" != "none" ]; then
              docker pull $BACKEND_PREVIOUS
              docker pull $FRONTEND_PREVIOUS
              export BACKEND_IMAGE=$BACKEND_PREVIOUS
              export FRONTEND_IMAGE=$FRONTEND_PREVIOUS
              docker compose up -d --no-deps backend frontend
              echo "✅ Rollback completado - versión anterior restaurada"
            fi
          else
            echo "❌ No hay versión anterior disponible"
            exit 1
          fi
          
          # Notificar rollback
          echo "🚨 ROLLBACK EJECUTADO: Smoke test falló, producción restaurada a versión estable"
        EOF
        
        echo "✅ Rollback automático completado"

  # 8. Notificar Éxito/Fallo
  notify:
    name: Notificar Estado del Deploy
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()
    
    steps:
    - name: Estado del Deployment
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.smoke-test.result }}" == "success" ]; then
          echo "🎉 Deployment completado exitosamente!"
          echo "📊 Resumen:"
          echo "- ✅ Tests pasaron"
          echo "- ✅ Tests E2E pasaron" 
          echo "- ✅ Imágenes construidas y publicadas"
          echo "- ✅ Infraestructura deployada"
          echo "- ✅ Health checks pasaron"
          echo "- ✅ Smoke test externo pasó"
          echo "- ✅ No se necesitó rollback"
          STATUS="success"
          COLOR="65280"
        else
          echo "❌ Deployment falló!"
          echo "📊 Resumen:"
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "- ❌ Deploy falló"
          fi
          if [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "- ❌ Smoke test externo falló"
          fi
          echo "- 🔄 Rollback automático iniciado"
          echo "- 📋 Revisar logs para detalles"
          echo "- 🔧 Puede requerir intervención manual"
          
          if [ "${{ github.event.inputs.force_rollback }}" == "true" ]; then
            echo "- 🔄 Rollback manual solicitado"
          fi
          STATUS="failure"
          COLOR="16711680"
        fi
        
        # Exportar para notificación webhook
        echo "DEPLOY_STATUS=$STATUS" >> $GITHUB_ENV
        echo "DEPLOY_COLOR=$COLOR" >> $GITHUB_ENV

    - name: Notificar Discord
      if: always() && env.DISCORD_WEBHOOK != ''
      run: |
        curl -s -X POST ${{ secrets.DISCORD_WEBHOOK }} \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 Deploy ${{ env.DEPLOY_STATUS }}\",
              \"color\": ${{ env.DEPLOY_COLOR }},
              \"fields\": [
                {\"name\": \"Repositorio\", \"value\": \"${{ github.repository }}\", \"inline\": true},
                {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\", \"inline\": false},
                {\"name\": \"Actor\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                {\"name\": \"Workflow\", \"value\": \"${{ github.workflow }}\", \"inline\": true}
              ],
              \"timestamp\": \"$(date -Iseconds)\"
            }]
          }" || echo "⚠️ Falló notificación a Discord"

    - name: Notificar Slack
      if: always() && env.SLACK_WEBHOOK != ''
      run: |
        curl -s -X POST ${{ secrets.SLACK_WEBHOOK }} \
          -H 'Content-type: application/json' \
          -d "{
            \"text\": \"🚀 Deploy *${{ env.DEPLOY_STATUS }}* en ${{ github.repository }}\",
            \"blocks\": [
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Deploy ${{ env.DEPLOY_STATUS }}*\\n*Repo:* ${{ github.repository }}\\n*Branch:* ${{ github.ref_name }}\\n*Commit:* ${{ github.sha }}\\n*Actor:* ${{ github.actor }}\"
                }
              }
            ]
          }" || echo "⚠️ Falló notificación a Slack"
