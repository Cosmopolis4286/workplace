name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run tests
      run: |
        cd backend
        pnpm test
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -e
          
          # Crear directorio si no existe
          if [ ! -d "/root/apps/myapp/workplace" ]; then
            echo "📁 Creando directorio del proyecto..."
            sudo mkdir -p /root/apps/myapp/workplace
            cd /root/apps/myapp/workplace
            
            # Clonar repositorio si es la primera vez
            if [ ! -f "docker-compose.yml" ]; then
              echo "📥 Clonando repositorio..."
              git clone https://github.com/Cosmopolis4286/workplace.git .
            fi
          else
            cd /root/apps/myapp/workplace
          fi
          
          echo "💾 Backup de Postgres"
          docker exec -t workplace_postgres pg_dumpall -U $POSTGRES_USER > /root/apps/myapp/workplace/backup_$(date +%F_%H-%M-%S).sql

          echo "⬇️ Actualizando contenedores"
          docker compose pull
          docker compose build --no-cache
          docker compose up -d

          echo "✅ Deploy completado"
        EOF

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'

    steps:
    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Rollback deployment
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -e
          
          # Crear directorio si no existe
          if [ ! -d "/root/apps/myapp/workplace" ]; then
            echo "❌ Directorio del proyecto no existe"
            exit 1
          fi
          
          cd /root/apps/myapp/workplace
          echo "🔄 Rolling back to previous version..."
          docker-compose down
          
          # Get latest backup image
          BACKUP_IMAGE=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup-" | tail -1)
          
          if [ ! -z "$BACKUP_IMAGE" ]; then
            docker tag $BACKUP_IMAGE workplace-backend:latest
            docker-compose up -d
            
            echo "✅ Rollback completed"
          else
            echo "❌ No backup image found for rollback"
            exit 1
          fi
        EOF
