name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

  buildeploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.force_deploy == 'true')
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate production deployment
      run: |
        set -e
        echo "🔍 Validando entorno de producción..."
        
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "❌ Solo permitido en main"
          exit 1
        fi
        
        if [ "$GITHUB_EVENT_NAME" == "push" ]; then
          COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          if echo "$COMMIT_MESSAGE" | grep -q "Merge branch 'develop'"; then
            echo "❌ Merges desde develop bloqueados"
            exit 1
          fi
        fi
        
        echo "✅ Validación OK"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Verify built image
      run: |
        echo "🔍 Verificando que la imagen construida sea funcional..."
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace:main
        
        # Probar que la imagen tenga los archivos compilados
        docker run --rm ${{ secrets.DOCKER_USERNAME }}/workplace:main ls -la /app/backend/dist/ || {
          echo "❌ La imagen no tiene archivos compilados"
          exit 1
        }
        
        echo "✅ Imagen verificada correctamente"

  deploy:
    needs: buildeploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'

    steps:
    - uses: actions/checkout@v4

    - uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to VPS
      run: |
        # Copiar docker-compose de producción
        scp -o StrictHostKeyChecking=no docker-compose.prod.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/docker-compose.yml
        
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail

          APP_DIR="/opt/workplace"

          echo "🚀 Deploy iniciado"

          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

          sudo mkdir -p $APP_DIR
          cd $APP_DIR

          if ! docker info > /dev/null 2>&1; then
            echo "❌ Docker no disponible"
            exit 1
          fi

          echo "💾 Backup DB"
          if docker ps --format '{{.Names}}' | grep -q workplace_postgres; then
            docker exec workplace_postgres pg_dumpall -U workplace > backup.sql || true
          fi

          echo "⬇️ Pull imagen"
          docker pull ${{ secrets.DOCKER_USERNAME }}/workplace:main

          if docker image inspect workplace-backend:latest > /dev/null 2>&1; then
            docker tag workplace-backend:latest workplace-backend:backup-$(date +%s)
          fi

          docker tag ${{ secrets.DOCKER_USERNAME }}/workplace:main workplace-backend:latest

          docker compose down
          docker compose up -d

          sleep 25

          echo "🔍 Health check"
          docker compose ps
          
          # Verificación más robusta del estado
          echo "🔍 Verificando estado de contenedores..."
          
          # Contar contenedores Up
          UP_COUNT=$(docker compose ps --services | wc -l)
          HEALTHY_COUNT=$(docker compose ps | grep -c "Up" || echo "0")
          
          echo "Contenedores esperados: $UP_COUNT"
          echo "Contenedores saludables: $HEALTHY_COUNT"
          
          if [ "$HEALTHY_COUNT" -lt "$UP_COUNT" ]; then
            echo "❌ Contenedores no saludables"
            echo "📋 Logs de contenedores con problemas:"
            docker compose ps
            docker compose logs --tail=20
            exit 1
          fi
          
          # Verificación específica del backend
          if ! docker compose ps backend | grep -q "Up"; then
            echo "❌ Backend no está Up"
            docker compose logs backend --tail=30
            exit 1
          fi
          
          echo "✅ Todos los contenedores están saludables"

          docker logout
        EOF

    - name: Verify
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/workplace
          docker compose ps | grep Up
        EOF
      if: always()

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'failure'

    steps:
    - uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Rollback
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail

          APP_DIR="/opt/workplace"
          cd $APP_DIR

          BACKUP=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep backup | sort -r | head -n 1)

          if [ -z "$BACKUP" ]; then
            echo "❌ No backup"
            exit 1
          fi

          docker tag $BACKUP workplace-backend:latest
          docker compose down
          docker compose up -d

          echo "✅ Rollback OK"
        EOF