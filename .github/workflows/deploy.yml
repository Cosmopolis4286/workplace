name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/workplace

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Run unit tests
      run: |
        cd backend
        pnpm test:ci
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        NODE_ENV: test

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

  buildeploy:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event_name == 'push' || github.event.inputs.force_deploy == 'true')
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Validate production deployment
      run: |
        set -e
        echo "🔍 Validando entorno de producción..."
        
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "❌ Solo permitido en main"
          exit 1
        fi
        
        if [ "$GITHUB_EVENT_NAME" == "push" ]; then
          COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          if echo "$COMMIT_MESSAGE" | grep -q "Merge branch 'develop'"; then
            echo "❌ Merges desde develop bloqueados"
            exit 1
          fi
        fi
        
        echo "✅ Validación OK"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Set image tags
      run: |
        echo "BACKEND_IMAGE_TAG=main-${{ github.sha }}" >> $GITHUB_ENV
        echo "FRONTEND_IMAGE_TAG=main-${{ github.sha }}" >> $GITHUB_ENV
        echo "🏷️ Backend image tag: main-${{ github.sha }}"
        echo "🏷️ Frontend image tag: main-${{ github.sha }}"

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      

    - name: Build and push backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
          ${{ steps.meta-backend.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
          ${{ steps.meta-frontend.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Verify built images
      run: |
        echo "🔍 Verificando imágenes construidas..."
        
        # Probar que el backend se ejecute correctamente
        echo "🧪 Testeando backend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        docker run --rm -d --name test-backend \
          -e NODE_ENV=production \
          -e DATABASE_URL="sqlite:memory:" \
          -e REDIS_HOST="localhost" \
          -e REDIS_PORT=6379 \
          -e REDIS_PASSWORD="test" \
          -e DISABLE_DB_CONNECTION=true \
          -p 3001:3001 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-backend:main-${{ github.sha }}
        
        # Esperar hasta 60s a que el health check responda
        echo "⏳ Esperando health check del backend (hasta 60s)..."
        if timeout 60 bash -c 'until curl -f http://localhost:3001/api/health; do sleep 2; done'; then
          echo "✅ Backend health check OK"
        else
          echo "❌ Backend health check falló después de 60s"
          docker logs test-backend --tail=30
          docker stop test-backend
          exit 1
        fi
        
        # Verificaciones adicionales
        if docker exec test-backend test -d "/app/backend/dist"; then
          echo "✅ Backend dist folder exists"
        else
          echo "❌ Backend dist folder missing"
          docker stop test-backend
          exit 1
        fi
        
        if docker exec test-backend test -f "/app/backend/package.json"; then
          echo "✅ Backend package.json exists"
        else
          echo "❌ Backend package.json missing"
          docker stop test-backend
          exit 1
        fi
        
        docker stop test-backend
        echo "✅ Backend verificado correctamente"
        
        # Probar que el frontend se ejecute correctamente
        echo "🧪 Testeando frontend..."
        echo "🏷️ Usando imagen: ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}"
        
        # Pull para asegurar que tenemos la imagen
        docker pull ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        docker run --rm -d --name test-frontend \
          -e BACKEND_API_URL=http://localhost:3001/api \
          -e NITRO_HOST=0.0.0.0 \
          -e NITRO_PORT=3000 \
          -p 3000:3000 \
          ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:main-${{ github.sha }}
        
        # Esperar hasta 60s a que el health check responda
        echo "⏳ Esperando health check del frontend (hasta 60s)..."
        if timeout 60 bash -c 'until curl -f http://localhost:3000/; do sleep 2; done'; then
          echo "✅ Frontend health check OK"
        else
          echo "❌ Frontend health check falló después de 60s"
          docker logs test-frontend --tail=30
          docker stop test-frontend
          exit 1
        fi
        
        # Verificaciones adicionales
        if docker exec test-frontend test -d "/app/.output"; then
          echo "✅ Frontend .output folder exists"
        else
          echo "❌ Frontend .output folder missing"
          docker stop test-frontend
          exit 1
        fi
        
        if docker exec test-frontend test -f "/app/package.json"; then
          echo "✅ Frontend package.json exists"
        else
          echo "❌ Frontend package.json missing"
          docker stop test-frontend
          exit 1
        fi
        
        docker stop test-frontend
        echo "✅ Frontend verificado correctamente"
        
        echo "🎉 Todas las imágenes verificadas correctamente"

  deploy:
    needs: buildeploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'
    
    # Control de concurrencia - evita pipelines simultáneos
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v6

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS (Rolling Update)
      run: |
        set -euo pipefail
        
        echo "🚀 Iniciando Rolling Update..."
        
        # Crear directorios necesarios antes de copiar
        echo "📁 Creando estructura de directorios..."
        ssh -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          mkdir -p /opt/workplace/nginx/conf.d
          mkdir -p /opt/workplace/scripts
          mkdir -p /opt/workplace/fallback
        EOF
        
        # Copiar archivos de configuración (scp fuera del ssh)
        echo "📁 Copiando configuración al servidor..."
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            docker-compose.prod.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/docker-compose.yml
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            nginx/nginx.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/nginx.conf
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            nginx/conf.d/default.conf ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/nginx/conf.d/default.conf
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            scripts/setup-ssl-v2.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/setup-ssl-v2.sh
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            scripts/backup-postgres.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/backup-postgres.sh
        scp -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            scripts/production-monitor.sh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/workplace/scripts/production-monitor.sh
        
        # Ejecutar deploy rolling update (con expansión de variables y timeout global)
        timeout 600 ssh -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << EOF
          set -euo pipefail
          
          echo "� Rolling Update en producción..."
          cd /opt/workplace
          
          # Evitar deploys simultáneos
          if [ -f ".deploy.lock" ]; then
            echo "❌ Deploy en progreso, abortando..."
            exit 1
          fi
          
          # Crear lock file
          touch .deploy.lock
          trap "rm -f .deploy.lock" EXIT
          
          # Login a Docker Hub
          echo "� Login Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Pull forzado de imágenes SHA específicas
          echo "⬇️ Pull forzado de imágenes SHA específicas..."
          export BACKEND_TAG=main-${{ github.sha }}
          export FRONTEND_TAG=main-${{ github.sha }}
          export DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
          
          # Exportar imágenes completas para compose
          export BACKEND_IMAGE=${DOCKER_USER}/workplace-backend:${BACKEND_TAG}
          export FRONTEND_IMAGE=${DOCKER_USER}/workplace-frontend:${FRONTEND_TAG}
          
          echo "🏷️ Tags a usar:"
          echo "Backend: ${BACKEND_IMAGE}"
          echo "Frontend: ${FRONTEND_IMAGE}"
          
          # Pull específico de las imágenes SHA
          docker pull ${BACKEND_IMAGE}
          docker pull ${FRONTEND_IMAGE}
          
          # Deploy sin downtime real con imágenes específicas
          echo "🚀 Deploy sin downtime con imágenes específicas..."
          docker compose up -d --no-deps --force-recreate backend frontend
          
          # Usar siempre SHA tags para trazabilidad completa
          echo "📦 Usando SHA tags: main-${{ github.sha }}"
          
          # Backup de versión ANTERIOR (determinista)
          echo "💾 Backup de versión ANTERIOR (determinista)..."
          
          # Obtener imagen actual del contenedor running (más seguro)
          if docker compose ps backend | grep -q "Up"; then
            CURRENT_BACKEND=$(docker inspect $(docker compose ps -q backend) --format '{{.Image}}' 2>/dev/null || echo "")
            echo "📦 Backend actual: $CURRENT_BACKEND"
            if [ -n "$CURRENT_BACKEND" ] && [ "$CURRENT_BACKEND" != "${DOCKER_USER}/workplace-backend:${BACKEND_TAG}" ]; then
              docker tag $CURRENT_BACKEND workplace-backend:backup-$(date +%s)
              echo "✅ Backup backend creado"
            fi
          fi
          
          if docker compose ps frontend | grep -q "Up"; then
            CURRENT_FRONTEND=$(docker inspect $(docker compose ps -q frontend) --format '{{.Image}}' 2>/dev/null || echo "")
            echo "📦 Frontend actual: $CURRENT_FRONTEND"
            if [ -n "$CURRENT_FRONTEND" ] && [ "$CURRENT_FRONTEND" != "${DOCKER_USER}/workplace-frontend:${FRONTEND_TAG}" ]; then
              docker tag $CURRENT_FRONTEND workplace-frontend:backup-$(date +%s)
              echo "✅ Backup frontend creado"
            fi
          fi
          
          # Canary Deploy real (paralelo sin downtime)
          echo "🚀 Iniciando Canary Deploy real (paralelo)..."
          
          # Obtener SHA del deploy actual
          CURRENT_SHA="${{ github.sha }}"
          echo "📦 Deployando SHA: $CURRENT_SHA"
          
          # Levantar canary en paralelo (otro nombre/puerto)
          echo "🧪 Levantando canary en paralelo..."
          
          # Obtener nombre real de la red del contenedor backend actual
          NETWORK_NAME=$(docker compose ps -q backend | xargs docker inspect --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' 2>/dev/null || echo "app_network")
          echo "🌐 Usando red: $NETWORK_NAME"
          
          docker run -d \
            --name workplace_backend_canary \
            --network $NETWORK_NAME \
            --restart unless-stopped \
            --memory 512m \
            --cpus 0.5 \
            --log-driver json-file \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            --env-file /opt/workplace/.env \
            -e NODE_ENV=production \
            -e PORT=3001 \
            ${BACKEND_IMAGE}
          
          # Esperar health check del canary (usando IP real)
          echo "⏳ Esperando health check del canary..."
          CANARY_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' workplace_backend_canary)
          echo "🌐 Canary IP: $CANARY_IP"
          
          if ! timeout 60 bash -c 'until curl -f http://'$CANARY_IP':3001/api/health; do sleep 2; done'; then
            echo "❌ Canary health check falló"
            docker logs workplace_backend_canary --tail=30
            docker rm -f workplace_backend_canary
            exit 1
          fi
          
          # Verificar métricas reales por 60 segundos (endpoints multi-nivel)
          echo "📊 Verificando métricas del canary (60s)..."
          CANARY_SUCCESS=true
          ERROR_COUNT=0
          TOTAL_LATENCY=0
          ITERATIONS=0
          
          for i in {1..12}; do
            ITERATIONS=$i
            
            # Nivel 1: Health check básico (liveness)
            if ! curl -f -s http://$CANARY_IP:3001/api/health > /dev/null; then
              echo "❌ Health check falló en iteración $i"
              ERROR_COUNT=$((ERROR_COUNT + 1))
              if [ $ERROR_COUNT -gt 2 ]; then
                CANARY_SUCCESS=false
                break
              fi
            fi
            
            # Nivel 2: DB connectivity (simulado con endpoint ligero)
            if ! curl -f -s http://$CANARY_IP:3001/api/version > /dev/null 2>&1; then
              echo "⚠️ Version endpoint falló en iteración $i"
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
            
            # Nivel 3: Readiness check (endpoint que depende de todo)
            if ! curl -f -s --max-time 5 http://$CANARY_IP:3001/api/ready > /dev/null 2>&1; then
              echo "⚠️ Readiness endpoint falló en iteración $i"
              # No contar como error fatal, solo advertencia
            fi
            
            # Medir latencia del endpoint principal
            START_TIME=$(date +%s%N)
            curl -f -s http://$CANARY_IP:3001/api/health > /dev/null
            END_TIME=$(date +%s%N)
            LATENCY=$(( (END_TIME - START_TIME) / 1000000 ))  # Convertir a ms
            
            TOTAL_LATENCY=$((TOTAL_LATENCY + LATENCY))
            
            # Validar latencia (< 1000ms)
            if [ "$LATENCY" -gt 1000 ]; then
              echo "⚠️ Alta latencia detectada: ${LATENCY}ms"
              CANARY_SUCCESS=false
              break
            fi
            
            # Calcular latencia promedio
            AVG_LATENCY=$((TOTAL_LATENCY / ITERATIONS))
            echo "✅ Métrica OK ($i/12) - Latencia: ${LATENCY}ms, Promedio: ${AVG_LATENCY}ms, Errores: $ERROR_COUNT"
            sleep 5
          done
          
          # Métricas finales con cálculo correcto
          FINAL_AVG_LATENCY=$((TOTAL_LATENCY / ITERATIONS))
          ERROR_RATE=$((ERROR_COUNT * 100 / ITERATIONS))
          
          echo "📊 Métricas Finales Canary:"
          echo "   Latencia Promedio: ${FINAL_AVG_LATENCY}ms"
          echo "   Error Rate: ${ERROR_RATE}%"
          echo "   Errores Totales: $ERROR_COUNT/$ITERATIONS"
          
          # Circuit breaker: si error rate > 50% abortar inmediato
          if [ "$ERROR_RATE" -gt 50 ]; then
            echo "🚨 Circuit breaker activado - Error rate demasiado alto: ${ERROR_RATE}%"
            CANARY_SUCCESS=false
          fi
          
          # Limpiar canary
          docker rm -f workplace_backend_canary
          
          # Validación final (umbrales estrictos)
          if [ "$CANARY_SUCCESS" = "true" ] && [ "$ERROR_RATE" -lt 25 ] && [ "$FINAL_AVG_LATENCY" -lt 800 ]; then
            echo "✅ Canary exitoso - Métricas dentro de umbrales"
          else
            echo "❌ Canary falló - Métricas fuera de umbrales"
            echo "   Error Rate > 25% o Latencia > 800ms"
            
            # Restaurar backup más reciente
            LATEST_BACKUP=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup" | sort -r | head -n 1)
            if [ -n "$LATEST_BACKUP" ]; then
              docker tag $LATEST_BACKUP ${BACKEND_IMAGE}
              docker compose up -d --no-deps backend
            fi
            exit 1
          fi
          
          # Rolling Update Frontend (nginx no depende de frontend)
          echo "🔄 Actualizando Frontend..."
          
          # Escalar frontend a 2 instancias
          docker compose up -d --scale frontend=2 --no-deps frontend
          
          # Esperar a que la nueva instancia esté healthy
          echo "⏳ Esperando health check del nuevo frontend..."
          timeout 60 bash -c 'until docker compose ps frontend | grep -q "healthy"; do sleep 2; done'
          
          # Detener instancia antigua
          docker compose up -d --scale frontend=1 --no-deps frontend
          
          # Reiniciar nginx para que tome los cambios (depende solo de backend)
          echo "🔄 Reiniciando Nginx..."
          docker compose restart nginx
          
          # Configurar SSL si es necesario
          echo "🔧 Configurando SSL..."
          chmod +x /opt/workplace/scripts/setup-ssl-v2.sh
          /opt/workplace/scripts/setup-ssl-v2.sh
          
          # Verificar estado final
          echo "🔍 Verificando estado final..."
          docker compose ps
          
          # Health checks finales usando docker inspect con nombres dinámicos
          echo "🔍 Verificando estado final con docker inspect..."
          
          # Obtener IDs de contenedores dinámicamente
          POSTGRES_ID=$(docker compose ps -q postgres)
          REDIS_ID=$(docker compose ps -q redis)
          BACKEND_ID=$(docker compose ps -q backend)
          FRONTEND_ID=$(docker compose ps -q frontend)
          NGINX_ID=$(docker compose ps -q nginx)
          
          # Verificar Postgres
          if [ -n "$POSTGRES_ID" ]; then
            POSTGRES_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $POSTGRES_ID 2>/dev/null || echo "unknown")
            if [ "$POSTGRES_STATUS" != "healthy" ]; then
              echo "❌ Postgres no está healthy (status: $POSTGRES_STATUS)"
              docker compose logs postgres --tail=20
              exit 1
            fi
          fi
          
          # Verificar Redis
          if [ -n "$REDIS_ID" ]; then
            REDIS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $REDIS_ID 2>/dev/null || echo "unknown")
            if [ "$REDIS_STATUS" != "healthy" ]; then
              echo "❌ Redis no está healthy (status: $REDIS_STATUS)"
              docker compose logs redis --tail=20
              exit 1
            fi
          fi
          
          # Verificar Backend
          if [ -n "$BACKEND_ID" ]; then
            BACKEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $BACKEND_ID 2>/dev/null || echo "unknown")
            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "❌ Backend no está healthy (status: $BACKEND_STATUS)"
              docker compose logs backend --tail=20
              exit 1
            fi
          fi
          
          # Verificar Frontend
          if [ -n "$FRONTEND_ID" ]; then
            FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $FRONTEND_ID 2>/dev/null || echo "unknown")
            if [ "$FRONTEND_STATUS" != "healthy" ]; then
              echo "❌ Frontend no está healthy (status: $FRONTEND_STATUS)"
              docker compose logs frontend --tail=20
              exit 1
            fi
          fi
          
          # Verificar Nginx
          if [ -n "$NGINX_ID" ]; then
            NGINX_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $NGINX_ID 2>/dev/null || echo "unknown")
            if [ "$NGINX_STATUS" != "healthy" ]; then
              echo "❌ Nginx no está healthy (status: $NGINX_STATUS)"
              docker compose logs nginx --tail=20
              exit 1
            fi
          fi
          
          echo "✅ Todos los servicios están healthy!"
          if docker compose ps frontend | grep -q "Up" && ! docker compose ps frontend | grep -q "healthy"; then
            echo "⚠️ Frontend está Up pero no healthy (nginx puede servir fallback)"
          fi
          
          echo "✅ Rolling Update completado exitosamente!"
          
          # Cleanup seguro con prune (más robusto que xargs)
          echo "🧹 Cleanup seguro de imágenes antiguas..."
          
          # Solo hacer cleanup si el deploy fue exitoso
          if docker compose ps | grep -q "healthy"; then
            # Mantener imágenes recientes (72h) y eliminar dangling
            echo "🗑️ Limpiando imágenes antiguas (>72h) y dangling..."
            docker image prune --force --filter "until=72h" || true
            docker image prune --force --filter "dangling=true" || true
            
            # Opcional: mantener solo últimos 10 SHA tags si quieres más control
            echo "🏷️ Manteniendo últimos 10 SHA tags..."
            docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-" | grep "main-" | sort -V | tail -n +11 | xargs -r docker rmi -f || true
          else
            echo "⚠️ Omitiendo cleanup por seguridad (servicios no healthy)"
          fi
          
          docker logout
        EOF

    - name: Verify
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /opt/workplace
          docker compose ps | grep Up
        EOF
      if: always()

  rollback:
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && needs.deploy.result == 'failure'

    steps:
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Setup SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Complete Rollback
      run: |
        set -euo pipefail
        
        echo "🔄 Iniciando Rollback Completo..."
        
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          set -euo pipefail
          
          cd /opt/workplace
          
          echo "🔍 Buscando backup más reciente..."
          
          # Encontrar backup más reciente
          BACKUP_BACKEND=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-backend:backup" | sort -r | head -n 1)
          BACKUP_FRONTEND=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "workplace-frontend:backup" | sort -r | head -n 1)
          
          if [ -z "$BACKUP_BACKEND" ] || [ -z "$BACKUP_FRONTEND" ]; then
            echo "❌ No se encontraron backups para rollback"
            echo "Backups disponibles:"
            docker images --format "{{.Repository}}:{{.Tag}}" | grep backup || echo "No hay backups"
            exit 1
          fi
          
          echo "📦 Usando backups:"
          echo "Backend: $BACKUP_BACKEND"
          echo "Frontend: $BACKUP_FRONTEND"
          
          # Detener servicios actuales
          echo "🔄 Deteniendo servicios actuales..."
          docker compose down
          
          # Hacer rollback de imágenes (sin reutilizar SHA)
          echo "🔄 Haciendo rollback de imágenes..."
          docker tag $BACKUP_BACKEND ${{ secrets.DOCKER_USERNAME }}/workplace-backend:rollback-$(date +%s)
          docker tag $BACKUP_FRONTEND ${{ secrets.DOCKER_USERNAME }}/workplace-frontend:rollback-$(date +%s)
          
          # Iniciar servicios con versiones anteriores
          echo "🚀 Iniciando servicios con rollback..."
          docker compose up -d
          
          # Esperar a que los servicios inicien
          echo "⏳ Esperando que los servicios inicien..."
          sleep 30
          
          # Verificar health checks post-rollback (nginx solo depende de backend)
          if ! docker compose ps postgres | grep -q "healthy"; then
            echo "❌ Postgres no está healthy después de rollback"
            docker compose logs postgres --tail=20
            exit 1
          fi
          
          if ! docker compose ps redis | grep -q "healthy"; then
            echo "❌ Redis no está healthy después de rollback"
            docker compose logs redis --tail=20
            exit 1
          fi
          
          if ! docker compose ps backend | grep -q "healthy"; then
            echo "❌ Backend no está healthy después de rollback"
            docker compose logs backend --tail=20
            exit 1
          fi
          
          # Nginx debe estar Up (depende solo de backend)
          if ! docker compose ps nginx | grep -q "Up"; then
            echo "❌ Nginx no está Up después de rollback"
            docker compose logs nginx --tail=20
            exit 1
          fi
          
          # Frontend es opcional
          if docker compose ps frontend | grep -q "Up" && ! docker compose ps frontend | grep -q "healthy"; then
            echo "⚠️ Frontend Up pero no healthy después de rollback (nginx puede servir fallback)"
          fi
          
          echo "✅ Rollback completado exitosamente!"
          echo "🎉 Servicios restaurados a versión anterior"
          
          # Limpiar imágenes fallidas
          echo "🧹 Limpiando imágenes fallidas..."
          docker image prune -f
        EOF