name: PR Validation

# Corre en el runner self-hosted (no consume minutos de GitHub Actions). La
# etiqueta sale de CI_RUNNER_LABELS o, si no existe, de DEPLOY_RUNNER_LABELS
# (JSON; por defecto ["self-hosted"]). El repo es privado: no habilitar este
# trigger con un runner propio si el repo pasa a ser público (forks).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_approval:
        description: 'Continuar aunque fallen algunos checks'
        required: false
        default: false
        type: boolean

# Un solo runner: un push nuevo al PR cancela la validación anterior.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read        # upload-sarif lee el workflow run
  pull-requests: write # comentario con el resumen en el PR

jobs:
  # ─── Validación de código ──────────────────────────────────────────────────
  validate:
    name: Validar Código
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 20
    env:
      # prisma validate/generate solo leen el schema, pero exigen que la
      # variable exista. No se conecta a ninguna base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Validar schema Prisma
      run: cd backend && pnpm prisma validate && pnpm prisma generate

    - name: Type checking
      run: cd backend && pnpm type-check

    - name: Lint
      run: cd backend && pnpm lint:ci

    - name: Validar límites de dominio
      run: cd backend && pnpm deps:check

    # Dinero nuevo en Decimal, no Float — ver scripts/check-float-fields.js
    - name: Sin campos Float nuevos
      run: cd backend && pnpm schema:float-check

    - name: Format check
      run: cd backend && pnpm format:check

    # Bloquea vulnerabilidades críticas (hoy 0). Queda una alta sin parche en
    # la cadena de build del frontend (node-forge); subir a --audit-level high
    # cuando se resuelva.
    - name: Audit de dependencias
      run: cd backend && pnpm audit --audit-level critical
      timeout-minutes: 5
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Tests unitarios
      run: cd backend && pnpm test:ci
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Build
      run: cd backend && pnpm build

    - name: Verificar tamaño del bundle
      run: |
        DIST_SIZE=$(du -sm backend/dist | cut -f1)
        echo "Bundle size: ${DIST_SIZE}MB"
        if [ "$DIST_SIZE" -gt 50 ]; then
          echo "Bundle demasiado grande: ${DIST_SIZE}MB (limite: 50MB)"
          exit 1
        fi

    - name: Subir coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./backend/coverage/lcov.info
        flags: pr
        fail_ci_if_error: false

  # ─── Validación de frontend ────────────────────────────────────────────────
  # ─── Migraciones sobre una base vacía ──────────────────────────────────────
  # Aplica TODA la cadena de migraciones como lo hace init-backend-prod.sh en
  # un entorno nuevo (E2E, servidor nuevo, restore desde cero) y exige que el
  # resultado coincida con schema.prisma. Atrapa migraciones generadas contra
  # una base de desarrollo con drift (ver 20260831004151_add_supplier).
  validate-migrations:
    name: Validar Migraciones
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        # Puerto del host libre, elegido por Docker: con varios runners en la
        # misma máquina (o un Postgres local en 5432) un puerto fijo choca.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    env:
      # prisma generate (en setup-node-pnpm) exige que exista; no conecta.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Aplicar migraciones desde cero
      env:
        DATABASE_URL: postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
      run: cd backend && pnpm prisma migrate deploy

    - name: El resultado coincide con schema.prisma
      env:
        DATABASE_URL: postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
      run: |
        cd backend
        pnpm prisma migrate diff \
          --from-url "$DATABASE_URL" \
          --to-schema-datamodel prisma/schema.prisma \
          --exit-code

  validate-frontend:
    name: Validar Frontend
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    # Trinquete: todavía quedan errores preexistentes (ver
    # frontend/typecheck-baseline.json), así que en vez de exigir 0 se exige
    # que ningún archivo tenga MÁS errores que su línea base. Bloqueante.
    # Al corregir errores: node scripts/typecheck-ratchet.mjs --update
    - name: Type checking (trinquete)
      run: cd frontend && pnpm type-check:ratchet

    - name: Tests del frontend
      run: cd frontend && pnpm exec vitest run --passWithNoTests

  # ─── Build de verificación Docker ─────────────────────────────────────────
  docker-build-check:
    name: Verificar Build Docker
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    # El primer build en un runner sin caché tarda más de 15 min.
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    # Runner propio: driver "docker" = el daemon local y su caché de capas,
    # que persiste entre ejecuciones. En runners de GitHub, caché en GitHub
    # (el driver docker no admite exportar caché, por eso va condicionada).
    - uses: docker/setup-buildx-action@v4
      with:
        driver: ${{ runner.environment == 'github-hosted' && 'docker-container' || 'docker' }}

    - name: Build backend (sin push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: false
        cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=pr-backend' || '' }}
        cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max,scope=pr-backend' || '' }}

    - name: Build frontend (sin push)
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: false
        cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=pr-frontend' || '' }}
        cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max,scope=pr-frontend' || '' }}

  # ─── Escaneo de seguridad ──────────────────────────────────────────────────
  security-scan:
    name: Escaneo de Seguridad
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    # La primera descarga de la base de Trivy en un runner propio es lenta;
    # después queda en ~/.cache/trivy.
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Caché local de Trivy (runner propio)
      if: ${{ runner.environment != 'github-hosted' }}
      run: echo "TRIVY_CACHE_DIR=$HOME/.cache/trivy" >> "$GITHUB_ENV"

    # Tabla en el log: visible siempre, también en repos privados sin
    # GitHub Code Security (donde no se puede subir el SARIF).
    - name: Trivy — escaneo de vulnerabilidades
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: table
        cache: ${{ runner.environment == 'github-hosted' }}

    - name: Trivy — reporte SARIF
      if: ${{ !github.event.repository.private }}
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif

    # Code scanning en un repo privado exige GitHub Code Security (de pago).
    - name: Subir resultados a GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ always() && !github.event.repository.private }}
      with:
        sarif_file: trivy-results.sarif
      env:
        GITHUB_TOKEN: ${{ secrets.WORKPLACE_PAT || github.token }}

  # ─── Revisión de dependencias (solo PRs) ──────────────────────────────────
  # En repos privados exige GitHub Advanced Security (de pago): se salta, y
  # las vulnerabilidades de dependencias las cubre `pnpm audit` en validate.
  dependency-review:
    name: Revisión de Dependencias
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate

  # ─── Comentario de estado en el PR ────────────────────────────────────────
  notify:
    name: Comentar Estado en PR
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || vars.DEPLOY_RUNNER_LABELS || '["self-hosted"]') }}
    needs: [validate, validate-migrations, validate-frontend, docker-build-check, security-scan, dependency-review]
    # Sin comentario si el run se canceló (p.ej. lo reemplazó un push nuevo).
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
    - name: Comentar resultado en PR
      uses: actions/github-script@v9
      with:
        script: |
          const results = {
            validate:          '${{ needs.validate.result }}',
            validateMigrations: '${{ needs.validate-migrations.result }}',
            validateFrontend:  '${{ needs.validate-frontend.result }}',
            dockerBuildCheck:  '${{ needs.docker-build-check.result }}',
            securityScan:      '${{ needs.security-scan.result }}',
            dependencyReview:  '${{ needs.dependency-review.result }}',
          };

          const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
          const allOk = ['validate', 'validateMigrations', 'validateFrontend', 'dockerBuildCheck', 'securityScan', 'dependencyReview']
            .every((k) => results[k] === 'success' || results[k] === 'skipped');

          const body = [
            '## Resultado de Validación del PR',
            '',
            `| Check | Estado |`,
            `|-------|--------|`,
            `| Código backend (lint, types, tests, build) | ${icon(results.validate)} ${results.validate} |`,
            `| Migraciones (base vacía) | ${icon(results.validateMigrations)} ${results.validateMigrations} |`,
            `| Types frontend (trinquete) | ${icon(results.validateFrontend)} ${results.validateFrontend} |`,
            `| Build Docker | ${icon(results.dockerBuildCheck)} ${results.dockerBuildCheck} |`,
            `| Seguridad (Trivy) | ${icon(results.securityScan)} ${results.securityScan} |`,
            `| Dependencias | ${icon(results.dependencyReview)} ${results.dependencyReview} |`,
            '',
            allOk
              ? '**Listo para review.** Todos los checks pasaron.'
              : '**Hay checks fallidos.** Revisa los detalles antes de hacer merge.',
          ].join('\n');

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
