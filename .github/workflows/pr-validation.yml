name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Install dependencies
      run: |
        cd backend
        pnpm install --frozen-lockfile

    - name: Type checking
      run: |
        cd backend
        pnpm type-check

    - name: Linting
      run: |
        cd backend
        pnpm lint:ci

    - name: Format check
      run: |
        cd backend
        pnpm format:check

    - name: Security audit
      run: |
        cd backend
        pnpm audit --audit-level moderate

    - name: Database schema validation
      run: |
        cd backend
        pnpm prisma validate
        pnpm prisma generate

    - name: Check for migration conflicts
      run: |
        cd backend
        # Check if there are migration files that haven't been applied
        if [ -n "$(git diff --name-only origin/main..HEAD | grep 'prisma/migrations')" ]; then
          echo "🔍 New migrations detected"
          
          # Validate migration format
          for migration in prisma/migrations/*/migration.sql; do
            if [ -f "$migration" ]; then
              echo "✅ Validating $(basename $(dirname $migration))"
              
              # Check migration SQL syntax
              if ! pnpm prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /dev/null 2>&1; then
                echo "❌ Migration validation failed"
                exit 1
              fi
            fi
          done
          
          echo "✅ All migrations validated"
        fi

    - name: Build test
      run: |
        cd backend
        pnpm build

    - name: Unit tests
      run: |
        cd backend
        pnpm test --ci

    - name: Check bundle size
      run: |
        cd backend
        pnpm build
        
        # Check if dist folder size is reasonable (< 50MB)
        DIST_SIZE=$(du -sm dist | cut -f1)
        if [ "$DIST_SIZE" -gt 50 ]; then
          echo "❌ Bundle size too large: ${DIST_SIZE}MB (limit: 50MB)"
          exit 1
        fi
        
        echo "✅ Bundle size OK: ${DIST_SIZE}MB"

    - name: Docker build test
      run: |
        docker build -f backend/Dockerfile --target production .
        echo "✅ Docker build successful"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate

  notify:
    needs: [validate, security-scan, dependency-review]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Notify PR status
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.issue.number;
          
          const status = ${{ needs.validate.result }} === 'success' && 
                        ${{ needs.security-scan.result }} !== 'failure' && 
                        ${{ needs.dependency-review.result }} !== 'failure' 
                        ? '✅ All checks passed' 
                        : '❌ Some checks failed';
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: pr_number,
            body: `## PR Validation Status\n\n${status}\n\n**Checks:**\n- ✅ Code validation\n- ✅ Security scan\n- ✅ Dependency review\n\n${status.includes('✅') ? 'Ready for review! 🎉' : 'Please fix the issues before merging.'}`
          });
