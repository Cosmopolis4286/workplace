name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      force_approval:
        description: 'Continuar aunque fallen algunos checks'
        required: false
        default: false
        type: boolean

jobs:
  # ─── Validación de código ──────────────────────────────────────────────────
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Validar schema Prisma
      run: cd backend && pnpm prisma validate && pnpm prisma generate

    - name: Type checking
      run: cd backend && pnpm type-check

    - name: Lint
      run: cd backend && pnpm lint:ci

    - name: Format check
      run: cd backend && pnpm format:check

    - name: Audit de dependencias
      run: cd backend && pnpm audit --audit-level moderate
      timeout-minutes: 5
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Verificar migraciones nuevas
      run: |
        cd backend
        BASE=${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        if git diff --name-only "$BASE"..HEAD | grep -q 'prisma/migrations'; then
          echo "Nuevas migraciones detectadas — validando..."
          pnpm prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /dev/null
          echo "Migraciones OK"
        else
          echo "Sin migraciones nuevas"
        fi

    - name: Tests unitarios
      run: cd backend && pnpm test:ci
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Build
      run: cd backend && pnpm build

    - name: Verificar tamaño del bundle
      run: |
        DIST_SIZE=$(du -sm backend/dist | cut -f1)
        echo "Bundle size: ${DIST_SIZE}MB"
        if [ "$DIST_SIZE" -gt 50 ]; then
          echo "Bundle demasiado grande: ${DIST_SIZE}MB (limite: 50MB)"
          exit 1
        fi

    - name: Subir coverage
      uses: codecov/codecov-action@v5
      with:
        files: ./backend/coverage/lcov.info
        flags: pr
        fail_ci_if_error: false

  # ─── Build de verificación Docker ─────────────────────────────────────────
  docker-build-check:
    name: Verificar Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v4

    - name: Build backend (sin push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: false
        cache-from: type=gha,scope=pr-backend
        cache-to: type=gha,mode=max,scope=pr-backend

    - name: Build frontend (sin push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: false
        cache-from: type=gha,scope=pr-frontend
        cache-to: type=gha,mode=max,scope=pr-frontend

  # ─── Escaneo de seguridad ──────────────────────────────────────────────────
  security-scan:
    name: Escaneo de Seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Trivy — escaneo de vulnerabilidades
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif

    - name: Subir resultados a GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  # ─── Revisión de dependencias (solo PRs) ──────────────────────────────────
  dependency-review:
    name: Revisión de Dependencias
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate

  # ─── Comentario de estado en el PR ────────────────────────────────────────
  notify:
    name: Comentar Estado en PR
    runs-on: ubuntu-latest
    needs: [validate, docker-build-check, security-scan, dependency-review]
    if: always() && github.event_name == 'pull_request'
    steps:
    - name: Comentar resultado en PR
      uses: actions/github-script@v7
      with:
        script: |
          const results = {
            validate:          '${{ needs.validate.result }}',
            dockerBuildCheck:  '${{ needs.docker-build-check.result }}',
            securityScan:      '${{ needs.security-scan.result }}',
            dependencyReview:  '${{ needs.dependency-review.result }}',
          };

          const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
          const allOk = Object.values(results).every(r => r === 'success' || r === 'skipped');

          const body = [
            '## Resultado de Validación del PR',
            '',
            `| Check | Estado |`,
            `|-------|--------|`,
            `| Código (lint, types, tests, build) | ${icon(results.validate)} ${results.validate} |`,
            `| Build Docker | ${icon(results.dockerBuildCheck)} ${results.dockerBuildCheck} |`,
            `| Seguridad (Trivy) | ${icon(results.securityScan)} ${results.securityScan} |`,
            `| Dependencias | ${icon(results.dependencyReview)} ${results.dependencyReview} |`,
            '',
            allOk
              ? '**Listo para review.** Todos los checks pasaron.'
              : '**Hay checks fallidos.** Revisa los detalles antes de hacer merge.',
          ].join('\n');

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
