name: PR Validation

on:
  # CircleCI handles automatic PR validation while GitHub Actions quota is exhausted.
  # Keep manual dispatch available for explicitly requested diagnostics.
  workflow_dispatch:
    inputs:
      force_approval:
        description: 'Continuar aunque fallen algunos checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read        # upload-sarif lee el workflow run
  pull-requests: write # comentario con el resumen en el PR

jobs:
  # ─── Validación de código ──────────────────────────────────────────────────
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma validate/generate solo leen el schema, pero exigen que la
      # variable exista. No se conecta a ninguna base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Validar schema Prisma
      run: cd backend && pnpm prisma validate && pnpm prisma generate

    - name: Type checking
      run: cd backend && pnpm type-check

    - name: Lint
      run: cd backend && pnpm lint:ci

    - name: Validar límites de dominio
      run: cd backend && pnpm deps:check

    # Dinero nuevo en Decimal, no Float — ver scripts/check-float-fields.js
    - name: Sin campos Float nuevos
      run: cd backend && pnpm schema:float-check

    - name: Format check
      run: cd backend && pnpm format:check

    # Bloquea vulnerabilidades críticas (hoy 0). Quedan altas/moderadas que
    # exigen saltos mayores (NestJS 10 -> 11, nodemailer 8 -> 10) o no tienen
    # parche (braces, node-forge); bajar a --audit-level high al resolverlas.
    - name: Audit de dependencias
      run: cd backend && pnpm audit --audit-level critical
      timeout-minutes: 5
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Tests unitarios
      run: cd backend && pnpm test:ci
      timeout-minutes: 10
      continue-on-error: ${{ github.event.inputs.force_approval == 'true' }}

    - name: Build
      run: cd backend && pnpm build

    - name: Verificar tamaño del bundle
      run: |
        DIST_SIZE=$(du -sm backend/dist | cut -f1)
        echo "Bundle size: ${DIST_SIZE}MB"
        if [ "$DIST_SIZE" -gt 50 ]; then
          echo "Bundle demasiado grande: ${DIST_SIZE}MB (limite: 50MB)"
          exit 1
        fi

    - name: Subir coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./backend/coverage/lcov.info
        flags: pr
        fail_ci_if_error: false

  # ─── Validación de frontend ────────────────────────────────────────────────
  # ─── Migraciones sobre una base vacía ──────────────────────────────────────
  # Aplica TODA la cadena de migraciones como lo hace init-backend-prod.sh en
  # un entorno nuevo (E2E, servidor nuevo, restore desde cero) y exige que el
  # resultado coincida con schema.prisma. Atrapa migraciones generadas contra
  # una base de desarrollo con drift (ver 20260831004151_add_supplier).
  validate-migrations:
    name: Validar Migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    - name: Aplicar migraciones desde cero
      run: cd backend && pnpm prisma migrate deploy

    - name: El resultado coincide con schema.prisma
      run: |
        cd backend
        pnpm prisma migrate diff \
          --from-url "$DATABASE_URL" \
          --to-schema-datamodel prisma/schema.prisma \
          --exit-code

  validate-frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: '22'

    # Trinquete: todavía quedan errores preexistentes (ver
    # frontend/typecheck-baseline.json), así que en vez de exigir 0 se exige
    # que ningún archivo tenga MÁS errores que su línea base. Bloqueante.
    # Al corregir errores: node scripts/typecheck-ratchet.mjs --update
    - name: Type checking (trinquete)
      run: cd frontend && pnpm type-check:ratchet

  # ─── Build de verificación Docker ─────────────────────────────────────────
  docker-build-check:
    name: Verificar Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v4

    - name: Build backend (sin push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: false
        cache-from: type=gha,scope=pr-backend
        cache-to: type=gha,mode=max,scope=pr-backend

    - name: Build frontend (sin push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: false
        cache-from: type=gha,scope=pr-frontend
        cache-to: type=gha,mode=max,scope=pr-frontend

  # ─── Escaneo de seguridad ──────────────────────────────────────────────────
  security-scan:
    name: Escaneo de Seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    # Tabla en el log: visible siempre, también en repos privados sin
    # GitHub Code Security (donde no se puede subir el SARIF).
    - name: Trivy — escaneo de vulnerabilidades
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: table

    - name: Trivy — reporte SARIF
      if: ${{ !github.event.repository.private }}
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif

    # Code scanning en un repo privado exige GitHub Code Security (de pago).
    - name: Subir resultados a GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      if: ${{ always() && !github.event.repository.private }}
      with:
        sarif_file: trivy-results.sarif
      env:
        GITHUB_TOKEN: ${{ secrets.WORKPLACE_PAT || github.token }}

  # ─── Revisión de dependencias (solo PRs) ──────────────────────────────────
  # En repos privados exige GitHub Advanced Security (de pago): se salta, y
  # las vulnerabilidades de dependencias las cubre `pnpm audit` en validate.
  dependency-review:
    name: Revisión de Dependencias
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate

  # ─── Comentario de estado en el PR ────────────────────────────────────────
  notify:
    name: Comentar Estado en PR
    runs-on: ubuntu-latest
    needs: [validate, validate-migrations, validate-frontend, docker-build-check, security-scan, dependency-review]
    if: always() && github.event_name == 'pull_request'
    steps:
    - name: Comentar resultado en PR
      uses: actions/github-script@v9
      with:
        script: |
          const results = {
            validate:          '${{ needs.validate.result }}',
            validateMigrations: '${{ needs.validate-migrations.result }}',
            validateFrontend:  '${{ needs.validate-frontend.result }}',
            dockerBuildCheck:  '${{ needs.docker-build-check.result }}',
            securityScan:      '${{ needs.security-scan.result }}',
            dependencyReview:  '${{ needs.dependency-review.result }}',
          };

          const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
          const allOk = ['validate', 'validateMigrations', 'validateFrontend', 'dockerBuildCheck', 'securityScan', 'dependencyReview']
            .every((k) => results[k] === 'success' || results[k] === 'skipped');

          const body = [
            '## Resultado de Validación del PR',
            '',
            `| Check | Estado |`,
            `|-------|--------|`,
            `| Código backend (lint, types, tests, build) | ${icon(results.validate)} ${results.validate} |`,
            `| Migraciones (base vacía) | ${icon(results.validateMigrations)} ${results.validateMigrations} |`,
            `| Types frontend (trinquete) | ${icon(results.validateFrontend)} ${results.validateFrontend} |`,
            `| Build Docker | ${icon(results.dockerBuildCheck)} ${results.dockerBuildCheck} |`,
            `| Seguridad (Trivy) | ${icon(results.securityScan)} ${results.securityScan} |`,
            `| Dependencias | ${icon(results.dependencyReview)} ${results.dependencyReview} |`,
            '',
            allOk
              ? '**Listo para review.** Todos los checks pasaron.'
              : '**Hay checks fallidos.** Revisa los detalles antes de hacer merge.',
          ].join('\n');

          github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
