name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      production-user:
        description: 'Production server user'
        required: true
      production-host:
        description: 'Production server host'
        required: true
      backend-image:
        description: 'Backend Docker image'
        required: true
      frontend-image:
        description: 'Frontend Docker image'
        required: true
      domain-name:
        description: 'Domain name for SSL'
        required: false
        default: 'localhost'
      force-deploy:
        description: 'Force deploy even if checks fail'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH known hosts
      run: |
        ssh-keyscan -H ${{ inputs.production-host }} >> ~/.ssh/known_hosts

    - name: Setup Production Environment
      run: |
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} << 'EOF'
          set -euo pipefail
          
          if [ ! -d "/opt/workplace" ]; then
            echo "📁 Creando estructura /opt/workplace..."
            mkdir -p /opt/workplace/{logs/{deploy,sla},metrics,backups,scripts/{deploy,deployment},nginx/conf.d}
            echo "✅ Entorno de producción creado"
          else
            echo "✅ Directorio /opt/workplace ya existe"
          fi
        EOF

    - name: Copy Configuration Files
      run: |
        # Copiar docker-compose desde GitHub Actions al servidor
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          docker-compose.prod.yml ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/
        
        # Subir solo configuración base nginx (sin secrets)
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          nginx/nginx.conf ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/nginx/
        
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          nginx/conf.d/common.conf ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/nginx/conf.d/
        
        # Subir script de configuración nginx
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          scripts/deployment/setup-nginx-prod.sh ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/scripts/deployment/
        
        # Ejecutar configuración nginx en servidor
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} "cd /opt/workplace && chmod +x scripts/deployment/setup-nginx-prod.sh && DOMAIN_NAME='${{ inputs.domain-name }}' ./scripts/deployment/setup-nginx-prod.sh"
        
        echo "✅ Configuración nginx base copiada y específica creada"

    - name: Copy deploy scripts
      run: |
        # Crear directorio de scripts en servidor
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} "mkdir -p /opt/workplace/scripts/deploy"
        
        # Copiar scripts desde GitHub Actions al servidor
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          -r scripts/deploy/* ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/scripts/deploy/
        
        # Copiar scripts de deployment
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} "mkdir -p /opt/workplace/scripts/deployment"
        scp -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          scripts/deployment/init-backend-prod.sh ${{ inputs.production-user }}@${{ inputs.production-host }}:/opt/workplace/scripts/deployment/
        
        echo "✅ Scripts copiados"

    - name: Pre-Deploy Canary Check
      run: |
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔍 Pre-deploy canary check..."
          
          # Verificar estado actual del sistema
          if docker compose ps | grep -q "Up"; then
            echo "✅ Sistema corriendo, procediendo con canary"
          else
            echo "⚠️ Sistema no corriendo, iniciando base services"
            docker compose up -d postgres redis nginx
            sleep 10
          fi
          
          echo "✅ Pre-deploy check completado"
        EOF

    - name: Canary Traffic Split Deployment
      run: |
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🚀 Iniciando Canary Deployment (10% traffic)..."
          
          # Exportar variables de imágenes
          export BACKEND_IMAGE="${{ inputs.backend-image }}"
          export FRONTEND_IMAGE="${{ inputs.frontend-image }}"
          
          # Ejecutar canary deployment
          if [ -f "scripts/deploy/canary-traffic-split.sh" ]; then
            chmod +x scripts/deploy/canary-traffic-split.sh
            ./scripts/deploy/canary-traffic-split.sh
          else
            echo "❌ Script canary-traffic-split.sh no encontrado"
            exit 1
          fi
        EOF
      continue-on-error: ${{ inputs.force-deploy == 'true' }}

    - name: Verify Load Balancing
      run: |
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔍 Verificando load balancing..."
          
          if [ -f "scripts/deploy/verify_load_balancing.sh" ]; then
            chmod +x scripts/deploy/verify_load_balancing.sh
            ./scripts/deploy/verify_load_balancing.sh
          else
            echo "⚠️ Script verify_load_balancing.sh no encontrado, continuando"
          fi
        EOF
      continue-on-error: ${{ inputs.force-deploy == 'true' }}

    - name: Final Verification
      run: |
        ssh -o StrictHostKeyChecking=no ${{ inputs.production-user }}@${{ inputs.production-host }} << 'EOF'
          set -euo pipefail
          cd /opt/workplace
          
          echo "🔍 Verificación final del deployment..."
          
          # Verificar que todos los servicios estén corriendo
          docker compose ps
          
          # Verificar health checks
          echo "🏥 Health checks:"
          docker compose exec --no-TTY backend curl -f http://localhost:3001/api/health || echo "⚠️ Backend health check failed"
          docker compose exec --no-TTY frontend curl -f http://localhost:3000 || echo "⚠️ Frontend health check failed"
          
          echo "✅ Deployment completado exitosamente"
        EOF
