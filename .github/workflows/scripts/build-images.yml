name: Build Docker Images

on:
  workflow_call:
    inputs:
      docker-username:
        description: 'Docker Hub username'
        required: true
      docker-password:
        description: 'Docker Hub password'
        required: true
      image-tag:
        description: 'Image tag'
        required: false
        default: 'main-${{ github.sha }}'

env:
  REGISTRY: docker.io

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
        echo "name=${{ inputs.docker-username }}/workplace-backend" >> $GITHUB_OUTPUT
        echo "🏷️ Backend image tag: ${{ inputs.image-tag }}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.docker-username }}/workplace-backend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push backend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ inputs.docker-username }}/workplace-backend:${{ inputs.image-tag }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: ${{ steps.meta.outputs.labels }}

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
      image-name: ${{ steps.set-tag.outputs.name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Set image tag
      id: set-tag
      run: |
        echo "tag=${{ inputs.image-tag }}" >> $GITHUB_OUTPUT
        echo "name=${{ inputs.docker-username }}/workplace-frontend" >> $GITHUB_OUTPUT
        echo "🏷️ Frontend image tag: ${{ inputs.image-tag }}"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.docker-username }}/workplace-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss'}}
      
    - name: Build and push frontend
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./frontend/Dockerfile.prod
        target: production
        push: true
        pull: true
        tags: |
          ${{ inputs.docker-username }}/workplace-frontend:${{ inputs.image-tag }}
          ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: ${{ steps.meta.outputs.labels }}
