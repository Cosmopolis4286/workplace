name: Formatear archivos de PR
# Ejecutar Prettier al sincronizar la PR

on:
  push:
    branches: [feat/verificacion-telefonica-messangi]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Aplicar Prettier
        run: cd backend && pnpm exec prettier --config .prettierrc --write "src/domains/identity-access/auth/auth.controller.ts" "src/domains/identity-access/auth/phone-verification.service.ts" "src/test/unit/phone-verification.service.test.ts"
      - name: Guardar formato corregido
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "backend/src/domains/identity-access/auth/auth.controller.ts" "backend/src/domains/identity-access/auth/phone-verification.service.ts" "backend/src/test/unit/phone-verification.service.test.ts"
          git commit -m "style: aplicar formato Prettier"
          git push
