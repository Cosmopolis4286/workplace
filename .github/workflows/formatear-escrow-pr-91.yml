name: Formatear escrow PR 91

on:
  push:
    branches:
      - fix/escrow-transition-serialization
    paths:
      - "backend/src/domains/money/escrow/escrow.service.ts"
      - "backend/src/test/unit/escrow.service.test.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/escrow-transition-serialization
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - name: Formatear y validar archivos de escrow
        run: |
          cd backend
          pnpm exec prettier --config .prettierrc --write src/domains/money/escrow/escrow.service.ts src/test/unit/escrow.service.test.ts
          pnpm exec prettier --config .prettierrc --check src/domains/money/escrow/escrow.service.ts src/test/unit/escrow.service.test.ts
          pnpm exec jest --runInBand src/test/unit/escrow.service.test.ts
      - name: Guardar corrección en la rama de la PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/domains/money/escrow/escrow.service.ts backend/src/test/unit/escrow.service.test.ts
          if git diff --cached --quiet; then
            echo "Los archivos ya estaban formateados."
          else
            git commit -m "fix(escrow): corregir formato y validar pruebas"
            git push origin HEAD:fix/escrow-transition-serialization
          fi
