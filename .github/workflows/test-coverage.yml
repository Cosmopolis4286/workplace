name: Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workplace_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: |
        cd backend && pnpm install
        cd ../frontend && pnpm install

    - name: Run Backend Tests with Coverage
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workplace_test
        REDIS_URL: redis://localhost:6379

    - name: Run Frontend Tests with Coverage
      run: |
        cd frontend
        pnpm test:coverage

    - name: Check Coverage Threshold
      run: |
        echo "🔍 Checking coverage thresholds..."
        
        # Backend coverage
        BACKEND_COVERAGE=$(cd backend && pnpm run coverage:percentage || echo "0")
        echo "Backend coverage: ${BACKEND_COVERAGE}%"
        
        # Frontend coverage  
        FRONTEND_COVERAGE=$(cd frontend && pnpm run coverage:percentage || echo "0")
        echo "Frontend coverage: ${FRONTEND_COVERAGE}%"
        
        # Check thresholds
        THRESHOLD=80
        
        if (( $(echo "$BACKEND_COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Backend coverage ${BACKEND_COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
        
        if (( $(echo "$FRONTEND_COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Frontend coverage ${FRONTEND_COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi
        
        echo "✅ All coverage requirements met!"

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
