name: 'GitHub Deployment API'
description: 'Crea y actualiza deployments en la API de GitHub'

inputs:
  github-token:
    description: 'GitHub token'
    required: true
  environment:
    description: 'Environment name'
    required: true
  sha:
    description: 'Commit SHA'
    required: true
  backend-image:
    description: 'Backend Docker image'
    required: false
    default: ''
  frontend-image:
    description: 'Frontend Docker image'
    required: false
    default: ''
  domain:
    description: 'Deployment domain URL'
    required: false
    default: ''
  description:
    description: 'Deployment description'
    required: false
    default: ''
  action:
    description: 'Action: create, update, or both'
    required: false
    default: 'create'
  status:
    description: 'Status for update: success, failure, error'
    required: false
    default: 'success'
  deployment-id:
    description: 'Deployment ID for update'
    required: false
    default: ''

outputs:
  deployment-id:
    description: 'Created deployment ID'
    value: ${{ steps.create-deployment.outputs.id }}

runs:
  using: composite
  steps:
    - name: Create Deployment
      if: inputs.action == 'create' || inputs.action == 'both'
      id: create-deployment
      uses: actions/github-script@v6
      with:
        script: |
          const description = '${{ inputs.description }}' || `Deploy to ${{ inputs.environment }} - SHA: ${'${{ inputs.sha }}'.substring(0, 7)}`;
          
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: '${{ inputs.sha }}',
            task: 'deploy',
            auto_merge: false,
            required_contexts: [],
            environment: '${{ inputs.environment }}',
            description: description,
            payload: {
              backend_image: '${{ inputs.backend-image }}',
              frontend_image: '${{ inputs.frontend-image }}',
              sha: '${{ inputs.sha }}'
            }
          });
          
          console.log('Deployment created:', deployment.data.id);
          core.setOutput('id', deployment.data.id);
          return deployment.data.id;

    - name: Update Deployment Status
      if: (inputs.action == 'update' || inputs.action == 'both') && (steps.create-deployment.outputs.id || inputs.deployment-id)
      uses: actions/github-script@v6
      with:
        script: |
          const deploymentId = '${{ steps.create-deployment.outputs.id }}' || '${{ inputs.deployment-id }}';
          if (!deploymentId) {
            console.log('No deployment ID available for update');
            return;
          }
          
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: parseInt(deploymentId),
            state: '${{ inputs.status }}',
            environment_url: '${{ inputs.domain }}' ? 'https://${{ inputs.domain }}' : undefined,
            log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });
          
          console.log(`Deployment status updated to: ${{ inputs.status }}`);
