name: Run Tests with Coverage

on:
  workflow_call:
    inputs:
      force-deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean
      coverage-threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '80'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js and pnpm
      uses: ./.github/workflows/scripts/setup-node-pnpm.yml

    - name: Run Backend Tests with Coverage
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

    - name: Run Frontend Tests with Coverage
      run: |
        cd frontend
        pnpm test:coverage

    - name: Check Coverage Threshold
      run: |
        echo "🔍 Checking coverage thresholds..."
        
        # Backend coverage
        BACKEND_COVERAGE=$(cd backend && pnpm run coverage:percentage || echo "0")
        echo "Backend coverage: ${BACKEND_COVERAGE}%"
        
        # Frontend coverage  
        FRONTEND_COVERAGE=$(cd frontend && pnpm run coverage:percentage || echo "0")
        echo "Frontend coverage: ${FRONTEND_COVERAGE}%"
        
        # Check thresholds
        THRESHOLD=${{ inputs.coverage-threshold }}
        
        if (( $(echo "$BACKEND_COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Backend coverage ${BACKEND_COVERAGE}% is below threshold ${THRESHOLD}%"
          if [ "${{ inputs.force-deploy }}" != "true" ]; then
            exit 1
          fi
          echo "⚠️ Force deploy enabled - proceeding despite low coverage"
        fi
        
        if (( $(echo "$FRONTEND_COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Frontend coverage ${FRONTEND_COVERAGE}% is below threshold ${THRESHOLD}%"
          if [ "${{ inputs.force-deploy }}" != "true" ]; then
            exit 1
          fi
          echo "⚠️ Force deploy enabled - proceeding despite low coverage"
        fi
        
        echo "✅ All coverage requirements met!"

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run linting
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ inputs.force-deploy == 'true' }}

    outputs:
      backend-coverage: ${{ steps.backend-coverage.outputs.percentage }}
      frontend-coverage: ${{ steps.frontend-coverage.outputs.percentage }}
