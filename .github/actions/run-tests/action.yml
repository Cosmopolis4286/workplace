name: Run Tests with Coverage
description: Run unit tests with coverage threshold validation
author: 'WorkPlace Team'

inputs:
  force-deploy:
    description: 'Force deploy even if tests fail'
    required: false
    default: false
    type: boolean
  coverage-threshold:
    description: 'Coverage threshold percentage'
    required: false
    default: '60'

runs:
  using: 'composite'
  steps:
    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          backend/node_modules
          frontend/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8
    
    - name: Install dependencies
      shell: bash
      run: |
        cd backend && pnpm install --frozen-lockfile
        cd ../frontend && pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      shell: bash
      run: |
        cd backend
        pnpm prisma generate

    - name: Run Backend Tests with Coverage
      shell: bash
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

    - name: Run Frontend Tests with Coverage
      shell: bash
      run: |
        cd frontend
        pnpm test:coverage

    - name: Check Coverage Threshold
      shell: bash
      run: |
        echo "🔍 Checking coverage thresholds..."
        
        # Backend coverage
        BACKEND_COVERAGE=$(cd backend && pnpm run coverage:percentage || echo "0")
        echo "Backend coverage: ${BACKEND_COVERAGE}%"
        
        # Frontend coverage  
        FRONTEND_COVERAGE=$(cd frontend && pnpm run coverage:percentage || echo "0")
        echo "Frontend coverage: ${FRONTEND_COVERAGE}%"
        
        # Check thresholds
        BACKEND_THRESHOLD=${{ inputs.coverage-threshold }}
        FRONTEND_THRESHOLD=0  # Frontend only tests utilities, expect 0% coverage
        
        if (( $(echo "$BACKEND_COVERAGE < $BACKEND_THRESHOLD" | bc -l 2>/dev/null || echo "0") )); then
          echo "❌ Backend coverage ${BACKEND_COVERAGE}% is below threshold ${BACKEND_THRESHOLD}%"
          if [ "${{ inputs.force-deploy }}" != "true" ]; then
            exit 1
          fi
          echo "⚠️ Force deploy enabled - proceeding despite low coverage"
        fi
        
        if (( $(echo "$FRONTEND_COVERAGE < $FRONTEND_THRESHOLD" | bc -l 2>/dev/null || echo "0") )); then
          echo "❌ Frontend coverage ${FRONTEND_COVERAGE}% is below threshold ${FRONTEND_THRESHOLD}%"
          if [ "${{ inputs.force-deploy }}" != "true" ]; then
            exit 1
          fi
          echo "⚠️ Force deploy enabled - proceeding despite low coverage"
        fi
        
        echo "✅ All coverage requirements met!"

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v5
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run linting
      shell: bash
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ inputs.force-deploy == 'true' }}
