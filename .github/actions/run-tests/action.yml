name: Run Tests with Coverage
description: Run unit tests with coverage threshold validation
author: 'WorkPlace Team'

inputs:
  force-deploy:
    description: 'Force deploy even if tests fail'
    required: false
    default: false
    type: boolean
  coverage-threshold:
    description: 'Coverage threshold percentage'
    required: false
    default: '60'

runs:
  using: 'composite'
  steps:
    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          backend/node_modules
          frontend/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      shell: bash
      run: |
        cd backend
        pnpm prisma generate

    - name: Run Backend Tests with Coverage
      shell: bash
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

    - name: Run Frontend Tests with Coverage
      shell: bash
      run: |
        cd frontend
        pnpm test:coverage

    - name: Report Coverage
      shell: bash
      run: |
        # Jest ya aplica coverageThreshold en jest.config.js y falla el step anterior si no se cumple.
        # Este step solo reporta el valor para visibilidad en el log.
        SUMMARY="backend/coverage/coverage-summary.json"
        if [[ -f "$SUMMARY" ]]; then
          LINES=$(node -e "const s=require('./$SUMMARY'); console.log(s.total?.lines?.pct ?? 'n/a')" 2>/dev/null || echo "n/a")
          STMTS=$(node -e "const s=require('./$SUMMARY'); console.log(s.total?.statements?.pct ?? 'n/a')" 2>/dev/null || echo "n/a")
          echo "📊 Backend coverage — lines: ${LINES}%, statements: ${STMTS}% (umbral: ${{ inputs.coverage-threshold }}%)"
        else
          echo "📊 Coverage summary no disponible"
        fi

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run linting
      shell: bash
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ inputs.force-deploy == 'true' }}
