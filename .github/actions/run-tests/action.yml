name: Run Tests with Coverage
description: Run unit tests with coverage threshold validation
author: 'WorkPlace Team'

inputs:
  force-deploy:
    description: 'Force deploy even if tests fail'
    required: false
    default: false
    type: boolean
  coverage-threshold:
    description: 'Coverage threshold percentage'
    required: false
    default: '60'

runs:
  using: 'composite'
  steps:
    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          backend/node_modules
          frontend/node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      shell: bash
      run: |
        cd backend
        pnpm prisma generate

    - name: Run Backend Tests with Coverage
      shell: bash
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379

    - name: Run Frontend Tests with Coverage
      shell: bash
      run: |
        cd frontend
        pnpm test:coverage

    - name: Check Coverage Threshold
      shell: bash
      run: |
        echo "🔍 Verificando coverage thresholds..."
        THRESHOLD=${{ inputs.coverage-threshold }}

        # Leer el summary JSON generado por jest --coverage (no re-ejecuta tests)
        SUMMARY="backend/coverage/coverage-summary.json"
        if [[ -f "$SUMMARY" ]]; then
          BACKEND_COVERAGE=$(node -e "
            const s = require('./${SUMMARY}');
            const pct = s.total?.lines?.pct ?? 0;
            console.log(pct);
          " 2>/dev/null || echo "0")
        else
          BACKEND_COVERAGE="0"
        fi

        echo "Backend coverage: ${BACKEND_COVERAGE}% (umbral: ${THRESHOLD}%)"

        # Comparación con awk (sin bc)
        BELOW=$(awk "BEGIN { print (${BACKEND_COVERAGE} < ${THRESHOLD}) ? 1 : 0 }")
        if [[ "$BELOW" == "1" ]]; then
          echo "❌ Backend coverage ${BACKEND_COVERAGE}% está por debajo del umbral ${THRESHOLD}%"
          if [[ "${{ inputs.force-deploy }}" != "true" ]]; then
            exit 1
          fi
          echo "⚠️ Force deploy activo - continuando pese a cobertura baja"
        else
          echo "✅ Coverage OK"
        fi

    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Run linting
      shell: bash
      run: |
        cd backend
        pnpm lint:ci
      continue-on-error: ${{ inputs.force-deploy == 'true' }}
