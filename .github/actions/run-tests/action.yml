name: Run Tests with Coverage
description: Ejecuta tests unitarios y de frontend con reporte de cobertura
author: 'WorkPlace Team'

inputs:
  force-deploy:
    description: 'Continuar aunque los tests fallen (no recomendado en prod)'
    required: false
    default: 'false'
  coverage-threshold:
    description: 'Umbral mínimo de cobertura % (referencial — jest.config.js es la fuente de verdad)'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Tests backend con cobertura
      shell: bash
      run: |
        cd backend
        pnpm test:coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
      continue-on-error: ${{ inputs.force-deploy == 'true' }}

    - name: Tests frontend con cobertura
      shell: bash
      run: |
        cd frontend
        pnpm test:coverage
      continue-on-error: ${{ inputs.force-deploy == 'true' }}

    - name: Reporte de cobertura
      shell: bash
      run: |
        SUMMARY="backend/coverage/coverage-summary.json"
        if [[ -f "$SUMMARY" ]]; then
          LINES=$(node -e "const s=require('./$SUMMARY'); console.log(s.total?.lines?.pct ?? 'n/a')" 2>/dev/null || echo "n/a")
          STMTS=$(node -e "const s=require('./$SUMMARY'); console.log(s.total?.statements?.pct ?? 'n/a')" 2>/dev/null || echo "n/a")
          FUNCS=$(node -e "const s=require('./$SUMMARY'); console.log(s.total?.functions?.pct ?? 'n/a')" 2>/dev/null || echo "n/a")
          echo "📊 Coverage — lines: ${LINES}%, statements: ${STMTS}%, functions: ${FUNCS}%"
        else
          echo "📊 coverage-summary.json no disponible"
        fi

    - name: Subir cobertura a Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info,./frontend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Lint backend
      shell: bash
      run: cd backend && pnpm lint:ci
      continue-on-error: ${{ inputs.force-deploy == 'true' }}
