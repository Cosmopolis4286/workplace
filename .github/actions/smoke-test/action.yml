name: 'Smoke Test Environment'
description: 'Ejecuta smoke tests en un entorno desplegado (staging o producción)'

inputs:
  environment:
    description: 'Environment name (staging/production)'
    required: true
  domain:
    description: 'Domain to test'
    required: true
  ssh-private-key:
    description: 'SSH private key for server access'
    required: true
  ssh-host:
    description: 'SSH host'
    required: true
  ssh-user:
    description: 'SSH user'
    required: false
    default: ''
  ssl-retries:
    description: 'Number of SSL verification retries'
    required: false
    default: '5'
  backend-retries:
    description: 'Number of backend health check retries'
    required: false
    default: '12'
  frontend-retries:
    description: 'Number of frontend health check retries'
    required: false
    default: '8'
  check-db:
    description: 'Check database connection endpoint'
    required: false
    default: 'false'
  check-redis:
    description: 'Check redis connection endpoint'
    required: false
    default: 'false'
  fail-on-warnings:
    description: 'Fail if warnings are present'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Test status (success/failure)'
    value: ${{ steps.smoke-test.outputs.status }}
  url:
    description: 'Tested URL'
    value: ${{ steps.smoke-test.outputs.url }}

runs:
  using: composite
  steps:
    - name: Setup SSH
      uses: ./.github/actions/setup-ssh
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}
        production-host: ${{ inputs.ssh-host }}

    - name: SSH Hardening
      shell: bash
      run: |
        ssh-keyscan -H ${{ inputs.ssh-host }} >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Smoke Test
      id: smoke-test
      shell: bash
      run: |
        DOMAIN="${{ inputs.domain }}"
        if [ -z "$DOMAIN" ]; then
          echo "❌ Domain no configurado - omitiendo smoke test"
          echo "status=skipped" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "🔍 Iniciando smoke test para ${{ inputs.environment }} en $DOMAIN..."
        
        # Verificar SSL
        echo "🔒 Verificando SSL..."
        for i in $(seq 1 ${{ inputs.ssl-retries }}); do
          if echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -dates >/dev/null 2>&1; then
            echo "✅ Certificado SSL válido"
            break
          else
            echo "⏳ Verificando SSL... intento $i/${{ inputs.ssl-retries }}"
            [ $i -lt ${{ inputs.ssl-retries }} ] && sleep 5
          fi
        done
        
        # Verificar backend con reintentos
        echo "🔍 Verificando backend..."
        backend_ok=false
        for i in $(seq 1 ${{ inputs.backend-retries }}); do
          if curl -f -s --max-time 10 "https://$DOMAIN/api/health" >/dev/null; then
            echo "✅ Backend saludable en intento $i"
            backend_ok=true
            break
          else
            echo "⏳ Verificando backend... intento $i/${{ inputs.backend-retries }}"
            [ $i -lt ${{ inputs.backend-retries }} ] && sleep 10
          fi
        done
        
        # Verificar frontend con reintentos
        echo "🎨 Verificando frontend..."
        frontend_ok=false
        for i in $(seq 1 ${{ inputs.frontend-retries }}); do
          if curl -f -s --max-time 10 "https://$DOMAIN/" >/dev/null; then
            echo "✅ Frontend saludable en intento $i"
            frontend_ok=true
            break
          else
            echo "⏳ Verificando frontend... intento $i/${{ inputs.frontend-retries }}"
            [ $i -lt ${{ inputs.frontend-retries }} ] && sleep 10
          fi
        done
        
        # Validación interna servicios críticos (opcional)
        if [[ "${{ inputs.check-db }}" == "true" ]]; then
          if curl -f -s --max-time 5 "https://$DOMAIN/api/health/db" >/dev/null 2>&1; then
            echo "✅ DB connection OK"
          else
            echo "⚠️ WARNING: No se puede validar DB connection"
          fi
        fi
        
        if [[ "${{ inputs.check-redis }}" == "true" ]]; then
          if curl -f -s --max-time 5 "https://$DOMAIN/api/health/redis" >/dev/null 2>&1; then
            echo "✅ Redis connection OK"
          else
            echo "⚠️ WARNING: No se puede validar Redis connection"
          fi
        fi
        
        # Verificar readiness state
        if curl -f -s --max-time 5 "https://$DOMAIN/api/ready" >/dev/null; then
          echo "✅ Application ready state OK"
        else
          echo "⚠️ WARNING: Application no está en ready state"
        fi
        
        # Evaluación final
        if [[ "$backend_ok" == "true" && "$frontend_ok" == "true" ]]; then
          echo "🎉 Smoke test ${{ inputs.environment }} exitoso"
          echo "status=success" >> $GITHUB_OUTPUT
          echo "url=https://$DOMAIN" >> $GITHUB_OUTPUT
        else
          echo "❌ Smoke test ${{ inputs.environment }} falló"
          [[ "$backend_ok" != "true" ]] && echo "   - Backend no responde"
          [[ "$frontend_ok" != "true" ]] && echo "   - Frontend no responde"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi
