name: 'Rollback Production'
description: 'Restaura la ultima version estable en el servidor de produccion'

inputs:
  ssh-user:
    description: 'Usuario SSH del servidor'
    required: true
  ssh-host:
    description: 'Host del servidor de produccion'
    required: true

runs:
  using: composite
  steps:
    - name: Ejecutar rollback
      shell: bash
      run: |
        ssh ${{ inputs.ssh-user }}@${{ inputs.ssh-host }} << 'EOF'
          set -eo pipefail
          cd /opt/workplace
          COMPOSE="docker compose -f docker-compose.lite.yml"

          exec 200>/tmp/deploy.lock
          flock -n 200 || { echo "Deploy en progreso. Abortando rollback."; exit 1; }

          if [ ! -f versions/current.env ]; then
            echo "No hay version estable disponible para rollback (primer deploy)."
            echo "Intervencion manual requerida."
            $COMPOSE logs --tail 30 backend frontend 2>/dev/null || true
            exit 0
          fi

          # Source sin -u para evitar fallo en variables vacias del archivo
          set -a; source versions/current.env; set +a

          BACKEND_CURRENT_IMAGE="${BACKEND_CURRENT_IMAGE:-}"
          FRONTEND_CURRENT_IMAGE="${FRONTEND_CURRENT_IMAGE:-}"

          if [ -z "$BACKEND_CURRENT_IMAGE" ] || [ -z "$FRONTEND_CURRENT_IMAGE" ]; then
            echo "versions/current.env no contiene imagenes validas."
            exit 1
          fi

          echo "Rollback a:"
          echo "  Backend:  $BACKEND_CURRENT_IMAGE"
          echo "  Frontend: $FRONTEND_CURRENT_IMAGE"

          for IMG in "$BACKEND_CURRENT_IMAGE" "$FRONTEND_CURRENT_IMAGE"; do
            docker image inspect "$IMG" >/dev/null 2>&1 \
              || docker pull "$IMG" \
              || { echo "No se pudo obtener imagen: $IMG"; exit 1; }
          done

          export BACKEND_IMAGE="$BACKEND_CURRENT_IMAGE"
          export FRONTEND_IMAGE="$FRONTEND_CURRENT_IMAGE"
          $COMPOSE up -d --no-deps --force-recreate backend frontend

          echo "Rollback completado."
          BACKUP_TIMESTAMP="${BACKUP_TIMESTAMP:-desconocido}"
          echo "$(date '+%Y-%m-%d %H:%M:%S'): ROLLBACK OK $BACKUP_TIMESTAMP" >> logs/rollback-history.log
        EOF
