name: Run E2E Tests

on:
  workflow_call:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js and pnpm
      uses: ./.github/workflows/scripts/setup-node-pnpm.yml

    - name: Build Docker images
      run: |
        docker build -t workplace-backend:test -f backend/Dockerfile.prod .
        docker build -t workplace-frontend:test -f frontend/Dockerfile.prod .

    - name: Run E2E Tests
      run: |
        echo "🧪 Running E2E tests with ultra-optimized environment..."
        
        # Usar script optimizado para E2E
        chmod +x scripts/ci/run-e2e-optimized.sh
        ./scripts/ci/run-e2e-optimized.sh
      env:
        BASE_URL: http://localhost:3000
        API_URL: http://localhost:3001

    - name: Upload E2E Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30

    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up optimized test environment..."
        
        # El script optimizado ya incluye cleanup
        echo "✅ Cleanup handled by optimized script"
