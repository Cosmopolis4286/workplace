name: Setup Node.js and pnpm
description: Setup Node.js, pnpm, cache de dependencias y genera Prisma Client

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  pnpm-version:
    description: 'pnpm version (vacío = la de "packageManager" en package.json)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Node primero: el instalador de pnpm ejecuta `npm` del PATH. En un runner
    # self-hosted sobre WSL, sin esto encuentra el npm de Windows (/mnt/c/...)
    # y falla con rutas UNC. La caché de pnpm se configura más abajo, cuando
    # pnpm ya existe.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        # Carpeta propia de cada runner: con varios runners en la misma
        # máquina, el ~/setup-pnpm por defecto es compartido y se pisan.
        dest: ${{ runner.temp }}/setup-pnpm

    # En runners de GitHub la caché del store de pnpm se guarda en GitHub. En
    # un runner propio el store ya persiste en disco y subirlo (~1 GB) desde
    # una conexión doméstica tarda más que reinstalar.
    - name: Setup Node.js con cache pnpm
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}

    - name: Instalar dependencias
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        echo "✅ Dependencias instaladas"

    - name: Generar Prisma Client
      shell: bash
      run: |
        cd backend
        pnpm prisma generate
        echo "✅ Prisma Client generado"
