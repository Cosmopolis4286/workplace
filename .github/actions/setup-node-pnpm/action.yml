name: Setup Node.js and pnpm
description: Setup Node.js, pnpm, cache de dependencias y genera Prisma Client

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  pnpm-version:
    description: 'pnpm version (vacío = la de "packageManager" en package.json)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js con cache pnpm
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        echo "✅ Dependencias instaladas"

    - name: Generar Prisma Client
      shell: bash
      run: |
        cd backend
        pnpm prisma generate
        echo "✅ Prisma Client generado"
