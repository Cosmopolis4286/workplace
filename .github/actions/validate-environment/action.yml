name: 'Validate Environment Secrets'
description: 'Valida que todos los secrets y variables necesarios estén configurados'

inputs:
  docker-username:
    description: 'Docker username secret'
    required: true
  docker-password:
    description: 'Docker password secret'
    required: true
  ssh-private-key:
    description: 'SSH private key'
    required: true
  staging-host:
    description: 'Staging host (optional)'
    required: false
    default: ''
  staging-user:
    description: 'Staging user (optional)'
    required: false
    default: ''
  production-host:
    description: 'Production host (optional)'
    required: false
    default: ''
  production-user:
    description: 'Production user (optional)'
    required: false
    default: ''
  production-domain:
    description: 'Production domain'
    required: false
    default: ''

outputs:
  staging-ready:
    description: 'Si staging está completamente configurado'
    value: ${{ steps.check-staging.outputs.ready }}
  production-ready:
    description: 'Si producción está completamente configurada'
    value: ${{ steps.check-production.outputs.ready }}
  base-secrets-valid:
    description: 'Si los secrets base (docker, ssh) son válidos'
    value: ${{ steps.validate-base.outputs.valid }}

runs:
  using: composite
  steps:
    - name: Validar secrets base
      id: validate-base
      shell: bash
      run: |
        errors=0

        [[ -z "${{ inputs.docker-username }}" ]] && { echo "❌ DOCKER_USERNAME no configurado";  errors=$((errors+1)); }
        [[ -z "${{ inputs.docker-password }}" ]] && { echo "❌ DOCKER_PASSWORD no configurado";  errors=$((errors+1)); }
        [[ -z "${{ inputs.ssh-private-key }}" ]] && { echo "❌ SSH_PRIVATE_KEY no configurado"; errors=$((errors+1)); }

        # Validar formato mínimo de la clave SSH (debe contener BEGIN)
        if [[ -n "${{ inputs.ssh-private-key }}" ]] && \
           ! echo "${{ inputs.ssh-private-key }}" | grep -q "BEGIN"; then
          echo "❌ SSH_PRIVATE_KEY no parece una clave PEM válida"
          errors=$((errors+1))
        fi

        if [[ $errors -gt 0 ]]; then
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "❌ $errors secret(s) base inválido(s)"
          exit 1
        fi

        echo "valid=true" >> $GITHUB_OUTPUT
        echo "✅ Secrets base válidos (docker: ${{ inputs.docker-username }})"

    - name: Verificar staging
      id: check-staging
      shell: bash
      run: |
        if [[ -n "${{ inputs.staging-host }}" && -n "${{ inputs.staging-user }}" ]]; then
          echo "ready=true" >> $GITHUB_OUTPUT
          echo "✅ Staging configurado (${{ inputs.staging-user }}@${{ inputs.staging-host }})"
        else
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "⚠️  Staging no configurado — deploy a staging se omitirá"
        fi

    - name: Verificar producción
      id: check-production
      shell: bash
      run: |
        missing=()
        [[ -z "${{ inputs.production-host }}"   ]] && missing+=("PRODUCTION_HOST")
        [[ -z "${{ inputs.production-user }}"   ]] && missing+=("PRODUCTION_USER")
        [[ -z "${{ inputs.production-domain }}" ]] && missing+=("PRODUCTION_DOMAIN")

        if [[ ${#missing[@]} -eq 0 ]]; then
          echo "ready=true" >> $GITHUB_OUTPUT
          echo "✅ Producción configurada (${{ inputs.production-user }}@${{ inputs.production-host }}, dominio: ${{ inputs.production-domain }})"
        else
          echo "ready=false" >> $GITHUB_OUTPUT
          echo "⚠️  Producción incompleta — faltan: ${missing[*]}"
          echo "    Deploy a producción se omitirá"
        fi
