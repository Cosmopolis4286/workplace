name: 'Setup SSH for Production'
description: 'Configura SSH key y known hosts para conexión a producción'

inputs:
  ssh-private-key:
    description: 'SSH private key para conexión al servidor'
    required: true
  production-host:
    description: 'Hostname del servidor de producción'
    required: true

runs:
  using: composite
  steps:
    - name: Validar inputs
      shell: bash
      run: |
        if [[ -z "${{ inputs.ssh-private-key }}" ]]; then
          echo "❌ ERROR: ssh-private-key no puede estar vacío"
          exit 1
        fi
        if [[ -z "${{ inputs.production-host }}" ]]; then
          echo "❌ ERROR: production-host no puede estar vacío"
          exit 1
        fi
        echo "✅ Inputs de SSH validados"

    - name: Configurar SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Configurar SSH para usar esta clave
        echo "Host *" > ~/.ssh/config
        echo "  IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Configurar SSH known hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 600 ~/.ssh/known_hosts 2>/dev/null || true
        
        # Keyscan con timeout y retry (consistente con deploy-server)
        for i in 1 2 3; do
          if timeout 30 ssh-keyscan -H ${{ inputs.production-host }} >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "✅ SSH keyscan exitoso (intento $i)"
            break
          fi
          echo "⚠️  ssh-keyscan reintentando..."
          sleep 5
        done
        
        chmod 600 ~/.ssh/known_hosts
