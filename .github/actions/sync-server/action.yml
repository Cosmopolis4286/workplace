name: 'Sync to Server'
description: 'Sincroniza archivos de configuración al servidor via SCP'

inputs:
  ssh-user:
    description: 'Usuario SSH'
    required: true
  ssh-host:
    description: 'Host del servidor'
    required: true
  deploy-path:
    description: 'Ruta destino en servidor'
    required: false
    default: '/opt/workplace'

runs:
  using: composite
  steps:
    - name: Instalar dependencias
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq openssh-client
        echo "✅ OpenSSH client instalado"

    - name: Validar inputs
      shell: bash
      run: |
        if [[ -z "${{ inputs.ssh-user }}" || -z "${{ inputs.ssh-host }}" ]]; then
          echo "❌ ERROR: ssh-user y ssh-host requeridos"
          exit 1
        fi
        echo "✅ Sync: ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:${{ inputs.deploy-path }}"

    - name: Crear directorios
      shell: bash
      run: |
        ssh "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
          "mkdir -p ${{ inputs.deploy-path }}/{traefik/dynamic,scripts/deploy,logs,versions}"

    - name: Sincronizar archivos
      shell: bash
      run: |
        REMOTE="${{ inputs.ssh-user }}@${{ inputs.ssh-host }}"
        DEPLOY_PATH="${{ inputs.deploy-path }}"
        
        # Función para copiar archivos via SSH
        copy_file() {
          local src="$1"
          local dst="$2"
          ssh "$REMOTE" "mkdir -p $(dirname "$dst") && cat > $dst" < "$src"
        }
        
        # Función para copiar directorios
        copy_dir() {
          local src_dir="$1"
          local dst_dir="$2"
          ssh "$REMOTE" "mkdir -p $dst_dir"
          for f in "$src_dir"/*; do
            [[ -f "$f" ]] && copy_file "$f" "$dst_dir/$(basename "$f")"
          done
        }
        
        # Docker compose
        if [[ -f docker-compose.lite.yml ]]; then
          copy_file "docker-compose.lite.yml" "$DEPLOY_PATH/docker-compose.lite.yml"
          echo "✅ docker-compose.lite.yml copiado"
        fi
        
        # Traefik configs
        if [[ -d traefik ]]; then
          copy_dir "traefik" "$DEPLOY_PATH/traefik"
          echo "✅ Traefik configs copiados"
        fi
        
        # Scripts
        if [[ -d scripts/deploy ]]; then
          copy_dir "scripts/deploy" "$DEPLOY_PATH/scripts/deploy"
          ssh "$REMOTE" "chmod +x $DEPLOY_PATH/scripts/deploy/*.sh"
          echo "✅ Scripts copiados"
        fi
        
        echo "✅ Sincronización completada"
