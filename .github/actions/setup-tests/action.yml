name: Setup Tests Environment
description: Prepara el entorno de tests (Node, pnpm, Prisma). PostgreSQL y Redis se inyectan como services en el workflow.
author: 'WorkPlace Team'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup Node.js y dependencias
      uses: ./.github/actions/setup-node-pnpm
      with:
        node-version: ${{ inputs.node-version }}
