# =========================
# Production SSL Override
# =========================
# Uso: docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d

services:
  nginx:
    volumes:
      - ./nginx/conf.d/prod.conf.template:/etc/nginx/conf.d/prod.conf.template:ro
      - ./nginx/conf.d/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
      - ./nginx/conf.d/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
      - ./nginx/conf.d/frontend-location.conf:/etc/nginx/conf.d/frontend-location.conf:ro
      - ./nginx/conf.d/api-location.conf:/etc/nginx/conf.d/api-location.conf:ro
      - ./nginx/conf.d/static-location.conf:/etc/nginx/conf.d/static-location.conf:ro
      - ./nginx/conf.d/cloudflare-ips.conf:/etc/nginx/conf.d/cloudflare-ips.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fallback:/var/www/fallback:ro
      - uploads_data:/var/www/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:rw
      - ./scripts/nginx/nginx-reload.sh:/usr/local/bin/nginx-reload:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DOMAIN=${DOMAIN:-playrke.com}
      - SSL_ENABLED=${SSL_ENABLED:-true}
    command: >
      sh -c "
        echo '🔧 Processing production configuration...' &&
        export DOMAIN='${DOMAIN:-playrke.com}' &&
        envsubst '\$DOMAIN' < /etc/nginx/conf.d/prod.conf.template > /etc/nginx/conf.d/default.conf &&
        echo '✅ Configuration generated for DOMAIN: ${DOMAIN:-playrke.com}' &&
        nginx -g 'daemon off;'
      "
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      certbot:
        condition: service_healthy

  certbot:
    profiles: []  # Override para habilitar en producción con SSL
