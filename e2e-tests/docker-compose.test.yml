# Docker Compose específico para E2E Tests - Ultra optimizado

services:
  # Backend para tests - versión ultra ligera
  test-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production  # Solo runtime, sin build tools
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://test:test@postgres:5432/test_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - workplace-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend para tests - solo runtime
  test-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      target: production  # Solo runtime, sin build tools
    environment:
      APP_ENV: test
      PORT: 3000
      NUXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      test-backend:
        condition: service_healthy
    networks:
      - workplace-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # PostgreSQL para tests - configuración minimalista
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - workplace-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

  # Redis para tests - lightweight
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - workplace-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 3

  # Test Runner con Playwright - ultra ligero
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      BASE_URL: http://test-frontend:3000
      API_URL: http://test-backend:3001
      CI: true
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      test-backend:
        condition: service_healthy
      test-frontend:
        condition: service_healthy
    networks:
      - workplace-test-network
    volumes:
      - ./playwright-report:/app/playwright-report
    command: ["sh", "-c", "npx playwright test --reporter=html"]
    restart: "no"

# Volúmenes para persistencia de tests
volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local

# Red aislada para tests
networks:
  workplace-test-network:
    driver: bridge
