# Alertmanager Configuration - Production Ready

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@playrke.com'
  smtp_auth_username: 'alerts@playrke.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
  - match:
      severity: warning
    receiver: 'warning-alerts'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://grafana:3000/api/alerts'
    send_resolved: true

- name: 'critical-alerts'
  email_configs:
  - to: 'admin@playrke.com'
    subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .Status }}'
    body: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
      {{ end }}
    html: |
      <h2>🚨 CRITICAL ALERT</h2>
      <p><strong>{{ .Annotations.summary }}</strong></p>
      <p>{{ .Annotations.description }}</p>
      <table>
        <tr><th>Service</th><th>Status</th><th>Time</th></tr>
        {{ range .Alerts }}
        <tr>
          <td>{{ .Labels.service }}</td>
          <td>{{ .Status }}</td>
          <td>{{ .StartsAt }}</td>
        </tr>
        {{ end }}
      </table>

- name: 'warning-alerts'
  email_configs:
  - to: 'admin@playrke.com'
    subject: '[WARNING] {{ .GroupLabels.alertname }} - {{ .Status }}'
    body: |
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Description: {{ .Annotations.description }}
      Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
      {{ end }}

inhibit_rules:
- source_match:
    alertname: 'ContainerDown'
  target_match:
    alertname: 'NodeDown'
  equal: ['instance', 'job']
