# =========================
# Nginx Security Configuration
# =========================

# Rate limiting for HTTP requests
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=${RATE_LIMIT_REQUESTS}r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=acme_limit:10m rate=10r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    # Apply rate limiting globally
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit_per_ip 10;

    # Enhanced security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Rate-Limit-Limit "${RATE_LIMIT_REQUESTS}" always;
    add_header X-Rate-Limit-Remaining "$limit_req_remaining" always;
    add_header X-Rate-Limit-Reset "$limit_req_reset" always;

    # Hide nginx version
    server_tokens off;

    # Protect against large requests
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Protect against slow attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s 5s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Logging for security monitoring
    access_log /var/log/nginx/security_access.log json_combined;
    error_log /var/log/nginx/security_error.log warn;

    # ACME Challenge - special rate limiting
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        
        # Stricter rate limiting for ACME challenges
        limit_req zone=acme_limit burst=5 nodelay;
        
        # Log all ACME attempts
        access_log /var/log/nginx/acme_access.log;
        
        # Additional security
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    # API endpoints - stricter rate limiting
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        
        # Log API access separately
        access_log /var/log/nginx/api_access.log;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Protect against large API responses
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
    }

    # Login endpoints - very strict rate limiting
    location ~ ^/api/(auth|login|register) {
        limit_req zone=login_limit burst=3 nodelay;
        
        # Log authentication attempts
        access_log /var/log/nginx/auth_access.log;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files - caching and security
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        
        # Protect against execution of uploaded files
        location ~* \.(php|jsp|asp|sh|py)$ {
            deny all;
        }
    }

    # Block common attack patterns
    location ~* \.(aspx|php|jsp|cgi)$ {
        deny all;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~* ~$ {
        deny all;
    }

    # Block access to configuration files
    location ~* \.(conf|config|ini|log|bak|backup|old)$ {
        deny all;
    }
}
