services:
  postgres:
    image: postgres:16-alpine
    container_name: workplace_postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    shm_size: 256mb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: workplace_redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    networks:
      - app_network

  migrate:
    image: ${DOCKER_IMAGE_BACKEND}
    container_name: workplace_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      sh -c "
        echo '⏳ Waiting DB...' &&
        sleep 5 &&
        pnpm prisma migrate deploy &&
        echo '✅ Migrations done'
      "

    restart: "no"
    networks:
      - app_network

  backend:
    image: ${DOCKER_IMAGE_BACKEND}
    container_name: workplace_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    env_file:
      - .env

    ports:
      - "127.0.0.1:${NODE_PORT}:${NODE_PORT}"

    environment:
      NODE_ENV: production
      PORT: ${NODE_PORT}
      NODE_OPTIONS: --max-old-space-size=${BACKEND_MEM:-512}
      CI: true

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB}

      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${NODE_PORT}/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

    mem_limit: ${BACKEND_MEM:-512m}
    cpus: ${BACKEND_CPUS:-0.5}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    networks:
      - app_network

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND}
    container_name: workplace_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    ports:
      - "127.0.0.1:${FRONTEND_PORT}:${FRONTEND_PORT}"

    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
      CI: true

    depends_on:
      backend:
        condition: service_healthy

    mem_limit: ${FRONTEND_MEM:-512m}
    cpus: ${FRONTEND_CPUS:-0.5}

    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge