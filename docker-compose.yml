services:
  postgres:
    image: postgres:16-alpine
    container_name: workplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=80
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=2MB
      -c maintenance_work_mem=64MB
      -c wal_level=replica
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 512mb
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: workplace_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --protected-mode yes
      --tcp-keepalive 300
      --timeout 0
      --save 60 1000
      --save 300 10
      --save 900 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    logging:
      driver: json-file
      options:
        labels: "redis"
        env: "os,customer"
        compress: "true"
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
    container_name: workplace_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo ' Running migrations...' &&
        npx prisma migrate deploy &&
        echo ' Done'
      "
    restart: "no"
    init: true
    networks:
      - app_network
    tmpfs:
      - /tmp

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: workplace_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: ${NODE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Production logging levels
      LOG_LEVEL: info
      DEBUG: false
      VERBOSE: false
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${NODE_PORT}/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: workplace_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: false
    cpus: "0.75"
    mem_limit: 384m
    mem_reservation: 192m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: /api
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
      # Production logging levels
      LOG_LEVEL: warn
      ENVIRONMENT: production
      NUXT_DEBUG: false
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${FRONTEND_PORT}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp
      - /app/frontend/.nuxt:rw,size=100m,mode=1777

  nginx:
    image: nginx:alpine
    container_name: workplace_nginx
    restart: unless-stopped
    init: true
    user: "101:101"
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./nginx/ssl-monitor.sh:/ssl-monitor.sh:ro
      - ./nginx/conf.d/nginx-ssl.conf.template:/nginx-ssl.conf.template:ro
      - ./nginx/conf.d/nginx-http.conf.template:/nginx-http.conf.template:ro
      - ./nginx/conf.d/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
      - nginx_tmp:/tmp
      - nginx_run:/var/run
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DOMAIN=${DOMAIN:-localhost}
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
      args:
        DOMAIN: ${DOMAIN:-playrke.com}
    container_name: workplace_certbot
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-certificates.sh"]
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/scripts/renew-ssl.sh:/usr/local/bin/renew-ssl.sh:ro
      - ./certbot/ssl-status.sh:/usr/local/bin/ssl-status.sh:ro
      - certbot_logs:/var/log/certbot:rw
      - letsencrypt_logs:/var/log/letsencrypt:rw
      - certbot_conf:/etc/letsencrypt:rw
    environment:
      - DOMAIN=${DOMAIN:-playrke.com}
      - STAGING_MODE=${STAGING_MODE:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEV_MODE=${DEV_MODE:-true}
      - EMAIL=${EMAIL:-admin@${DOMAIN:-playrke.com}}
      - CERTBOT_RENEWAL_INTERVAL=86400
    networks:
      - app_network
      - external_network
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 50
    read_only: false
    tmpfs:
      - /tmp:rw,size=20m,mode=1777
      - /var/tmp:rw,size=20m,mode=1777
      - /var/spool/cron/crontabs:rw,size=5m,mode=1755
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem && openssl x509 -checkend 86400 -noout -in /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=certbot"
        compress: "true"

  # Backup Strategy Services
  postgres_backup:
    image: postgres:16-alpine
    container_name: workplace_postgres_backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - postgres_backups:/backups
      - ./scripts/database/backup-postgres.sh:/backup.sh:ro
    command: >
      sh -c "
        echo 'Installing cron...' &&
        apk add --no-cache dcron &&
        echo '${BACKUP_SCHEDULE} /backup.sh' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis_backup:
    image: redis:7-alpine
    container_name: workplace_redis_backup
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      BACKUP_SCHEDULE: "0 3 * * *"  # Daily at 3 AM
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - redis_backups:/backups
      - ./scripts/database/backup-redis.sh:/backup.sh:ro
    command: >
      sh -c "
        echo 'Installing cron...' &&
        apk add --no-cache dcron &&
        echo '${BACKUP_SCHEDULE} /backup.sh' | crontab - &&
        crond -f -l 2
      "
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: workplace_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app_network
    cpus: "0.5"
    mem_limit: 512m
    mem_reservation: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: workplace_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest
    container_name: workplace_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:latest
    container_name: workplace_promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  nginx_cache:
  nginx_logs:
  nginx_tmp:
  nginx_run:
  certbot_logs:
  letsencrypt_logs:
  certbot_conf:
  prometheus_data:
  grafana_data:
  loki_data:
  postgres_backups:
  redis_backups:

networks:
  app_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    driver_opts:
      com.docker.network.bridge.name: workplace_br
      com.docker.network.driver.mtu: 1500
  external_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: workplace_ext
      com.docker.network.driver.mtu: 1500
