services:
  postgres:
    image: postgres:16-alpine
    container_name: workplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_level=replica
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 512mb
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: workplace_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --protected-mode yes
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    logging:
      driver: json-file
      options:
        labels: "redis"
        env: "os,customer"
        compress: "true"
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
    container_name: workplace_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo ' Running migrations...' &&
        npx prisma migrate deploy &&
        echo ' Done'
      "
    restart: "no"
    init: true
    networks:
      - app_network
    tmpfs:
      - /tmp

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: workplace_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: ${NODE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Production logging levels
      LOG_LEVEL: info
      DEBUG: false
      VERBOSE: false
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 3 http://localhost:${NODE_PORT}/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: workplace_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: false
    cpus: "0.75"
    mem_limit: 384m
    mem_reservation: 192m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: /api
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
      # Production logging levels
      LOG_LEVEL: warn
      ENVIRONMENT: production
      NUXT_DEBUG: false
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 5 http://localhost:${FRONTEND_PORT}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp
      - /app/frontend/.nuxt:rw,size=100m,mode=1777

  nginx:
    image: nginx:alpine
    container_name: workplace_nginx
    restart: unless-stopped
    init: true
    user: "root:root"
    entrypoint:
      - sh
      - -c
      - |
        export NGINX_PID=""
        export SETUP_PID=""
        
        # Iniciar nginx en background
        /bin/sh /nginx-entrypoint.sh &
        NGINX_PID=$!
        
        # Iniciar monitor SSL (solo si nginx inició correctamente)
        sleep 5
        if kill -0 $NGINX_PID 2>/dev/null; then
          /bin/sh /ssl-monitor.sh &
          MONITOR_PID=$!
        fi
        
        # Esperar proceso principal
        wait $NGINX_PID
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/nginx-ssl.conf.template:/nginx-ssl.conf.template:ro
      - ./nginx/conf.d/nginx-http.conf.template:/nginx-http.conf.template:ro
      - ./nginx/conf.d/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
      - ./nginx/conf.d/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./nginx/ssl-monitor.sh:/ssl-monitor.sh:ro
      - ./fallback:/var/www/fallback:ro
      - uploads_data:/var/www/uploads:ro
      - ./scripts/nginx/nginx-reload.sh:/usr/local/bin/nginx-reload:ro
      - ./etc/letsencrypt:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DOMAIN=${DOMAIN:-localhost}

  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
      args:
        DOMAIN: ${DOMAIN:-playrke.com}
    container_name: workplace_certbot
    restart: unless-stopped
    init: true
    # profiles: []  # certbot siempre inicia automáticamente
    entrypoint:
      - sh
      - -c
      - |
        export NGINX_PID=""
        export SETUP_PID=""
        
        # Iniciar configuración de certificados
        /usr/local/bin/setup-certificates.sh &
        SETUP_PID=$!
        
        # Esperar configuración inicial
        wait $SETUP_PID
        
        # Si todo está bien, iniciar monitor de estado
        if [ $? -eq 0 ]; then
          /usr/local/bin/ssl-status.sh &
        fi
        
        # Mantener contenedor activo
        tail -f /dev/null
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./etc/letsencrypt:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/scripts/renew-ssl.sh:/usr/local/bin/renew-ssl.sh:ro
      - ./certbot/ssl-status.sh:/usr/local/bin/ssl-status.sh:ro
      - /var/log/certbot:/var/log/certbot:rw
      - /var/log/letsencrypt:/var/log/letsencrypt:rw
    environment:
      - DOMAIN=${DOMAIN:-playrke.com}
      - STAGING_MODE=${STAGING_MODE:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEV_MODE=${DEV_MODE:-false}
    networks:
      - app_network
      - external_network
    cpus: "0.1"
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 50
    read_only: false
    tmpfs:
      - /tmp:rw,size=10m,mode=1777
      - /var/tmp:rw,size=10m,mode=1777
      - /var/spool/cron/crontabs:rw,size=5m,mode=1755
    depends_on: []
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem && openssl x509 -checkend 86400 -noout -in /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service=certbot"
        compress: "true"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    driver_opts:
      com.docker.network.bridge.name: workplace_br
      com.docker.network.driver.mtu: 1500
  external_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: workplace_ext
      com.docker.network.driver.mtu: 1500
