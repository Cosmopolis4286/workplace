services:
  postgres:
    image: postgres:16-alpine
    container_name: workplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_level=replica
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 512mb
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: workplace_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --protected-mode yes
      --tcp-keepalive 300
      --timeout 0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app_network
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 128m
    ulimits:
      nofile:
        soft: 10032
        hard: 10032
    logging:
      driver: json-file
      options:
        labels: "redis"
        env: "os,customer"
        compress: "true"
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
    container_name: workplace_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo ' Running migrations...' &&
        npx prisma migrate deploy &&
        echo ' Done'
      "
    restart: "no"
    init: true
    networks:
      - app_network
    tmpfs:
      - /tmp

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: workplace_backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: ${NODE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Production logging levels
      LOG_LEVEL: info
      DEBUG: false
      VERBOSE: false
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 3 http://localhost:${NODE_PORT}/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    tmpfs:
      - /tmp

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: workplace_frontend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: false
    cpus: "0.75"
    mem_limit: 384m
    mem_reservation: 192m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: /api
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${FRONTEND_PORT}
      # Production logging levels
      LOG_LEVEL: warn
      ENVIRONMENT: production
      NUXT_DEBUG: false
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 5 http://localhost:${FRONTEND_PORT}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    tmpfs:
      - /tmp
      - /app/frontend/.nuxt:rw,size=100m,mode=1777

  nginx:
    image: nginx:alpine
    container_name: workplace_nginx
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx"
        env: "os,customer"
        compress: "true"
    read_only: false
    cpus: "0.5"
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 100
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/${SSL_ENABLED:-false}/nginx.conf.template:/nginx.conf.template:ro
      - ./nginx/conf.d/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro
      - ./nginx/conf.d/upstreams.conf:/etc/nginx/conf.d/upstreams.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./fallback:/var/www/fallback:ro
      - uploads_data:/var/www/uploads:ro
      - ./scripts/nginx/nginx-reload.sh:/usr/local/bin/nginx-reload:ro
      - ./etc/letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:rw,size=100m,mode=1777
      - /var/run:rw,size=10m,mode=1755
      - /var/log/nginx:rw,size=50m,mode=1755
      - /var/tmp:rw,size=20m,mode=1777
      - /tmp:rw,size=20m,mode=1777
      - /etc/nginx/conf.d:rw,size=10m,mode=1755
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app_network
      - external_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DOMAIN=${DOMAIN:-localhost}
      - SSL_ENABLED=${SSL_ENABLED:-true}

  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
      args:
        DOMAIN: ${DOMAIN:-playrke.com}
    container_name: workplace_certbot
    restart: unless-stopped
    init: true
    # profiles: - ssl  # Comentado para auto-iniciar con SSL_ENABLED=true
    entrypoint:
      - sh
      - -c
      - |
        echo '🔧 Setting up SSL certificates...'
        
        # Create directory structure
        mkdir -p /etc/letsencrypt/live/${DOMAIN:-playrke.com}
        mkdir -p /var/www/certbot/.well-known/acme-challenge
        
        if [ '${SSL_ENABLED:-false}' = 'true' ]; then
          echo '🔒 SSL enabled - checking certificates...'
          
          # Check if certificates exist and are valid (not self-signed)
          if [ ! -f /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem ]; then
            echo '📦 No certificates found - requesting from Lets Encrypt...'
            REQUEST_CERT=true
          elif openssl x509 -in /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem -text -noout 2>/dev/null | grep -q 'Issuer:.*Let'"'"'s' Encrypt; then
            echo '✅ Valid Lets Encrypt certificate found'
            REQUEST_CERT=false
          else
            echo '🔄 Invalid or self-signed certificate detected - requesting from Lets Encrypt...'
            REQUEST_CERT=true
          fi
          
          if [ "$REQUEST_CERT" = 'true' ]; then
            echo '🚀 Requesting certificates from Let'\''s Encrypt via webroot...'
            # Use webroot mode (requires port 80 to be open)
            certbot certonly --webroot -w /var/www/certbot \
              --email admin@${DOMAIN:-playrke.com} \
              --agree-tos \
              --no-eff-email \
              --force-renewal \
              -d ${DOMAIN:-playrke.com} \
              ${STAGING_MODE:+--staging}
              
            echo '✅ Let'\''s Encrypt certificates obtained via webroot'
          fi
          
          echo '🚀 Certbot setup complete - starting renewal cron...'
          # Start renewal cron job
          echo '0 */12 * * * /usr/local/bin/renew-ssl.sh >> /var/log/certbot/renew.log 2>&1' | crontab -
          crond -f -l 2
          
        else
          echo '🚫 SSL disabled - exiting'
          exit 0
        fi
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./etc/letsencrypt:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/scripts/renew-ssl.sh:/usr/local/bin/renew-ssl.sh:ro
      - /var/log/certbot:/var/log/certbot:rw
      - /var/log/letsencrypt:/var/log/letsencrypt:rw
    environment:
      - DOMAIN=${DOMAIN:-playrke.com}
      - STAGING_MODE=${STAGING_MODE:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SSL_ENABLED=${SSL_ENABLED:-true}
    networks:
      - app_network
      - external_network
    cpus: "0.1"
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp:rw,size=10m,mode=1777
      - /var/tmp:rw,size=10m,mode=1777
    depends_on: []
    healthcheck:
      test: ["CMD", "sh", "-c", "if [ '${SSL_ENABLED:-false}' = 'true' ]; then test -f /etc/letsencrypt/live/${DOMAIN:-playrke.com}/fullchain.pem; else exit 0; fi"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
        labels: "service=certbot"
        compress: "true"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: workplace_br
      com.docker.network.driver.mtu: 1500
  external_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: workplace_ext
      com.docker.network.driver.mtu: 1500
