services:
  postgres:
    image: postgres:16-alpine
    container_name: workplace_postgres
    restart: unless-stopped

    # ❗ No exponer a internet (solo red interna de Docker)
    # ports:
    #   - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: workplace_redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production

    container_name: workplace_backend
    restart: unless-stopped

    env_file:
      - .env

    # 🔒 Solo accesible desde el propio servidor (Nginx)
    ports:
      - "127.0.0.1:3001:3001"

    environment:
      NODE_ENV: production
      PORT: 3001
      NODE_OPTIONS: --max-old-space-size=512

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

    networks:
      - app_network

  backend-migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations

    container_name: workplace_backend_migrations
    profiles:
      - migrations

    env_file:
      - .env

    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

    command: ["tail", "-f", "/dev/null"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production

    container_name: workplace_frontend
    restart: unless-stopped

    # 🔒 Solo accesible desde Nginx
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NUXT_PUBLIC_API_URL: /api
      NODE_OPTIONS: --max-old-space-size=256
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000

    depends_on:
      backend:
        condition: service_started

    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge