# 🚀 PgBouncer Configuration - Production Ready

[databases]
workplace = host=postgres port=5432 dbname=workplace_db

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Pool settings
pool_mode = session
server_reset_query = DISCARD ALL
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 0
max_db_connections = 80
max_user_connections = 50

# Timeouts
server_check_delay = 30
server_check_query = select 1
server_lifetime = 3600

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
verbose = 0
