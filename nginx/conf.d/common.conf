# =========================
# CONFIGURACIÓN COMÚN (Factorizada)
# =========================
# Este archivo contiene configuración compartida entre HTTP y HTTPS

# HEADERS DE SEGURIDAD (heredados de nginx.conf)
# Los headers de seguridad ya están configurados en nginx.conf

client_max_body_size 50M;

# =========================
# FRONTEND (Nuxt en contenedor) - Con upstream
# =========================
location / {
    limit_req zone=general_limit burst=50 nodelay;
    limit_conn conn_limit_per_ip 20;
    
    # Usar upstream configurado en nginx.conf para load balancing
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSR caching para Nuxt
    proxy_cache ssr_cache;
    proxy_cache_valid 200 5m;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 30s;
    error_page 502 503 504 = @frontend_fallback;
}

location @frontend_fallback {
    root /var/www/fallback;
    index fallback.html;
    try_files /fallback.html =503;
}

# =========================
# API (Backend en contenedor) - Con upstream y cache
# =========================
location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    limit_conn conn_limit_per_ip 10;

    # Usar upstream configurado en nginx.conf para load balancing
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API caching configuration
    proxy_cache api_cache;
    proxy_cache_valid 200 302 10m;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_pragma $http_authorization;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_intercept_errors on;

    error_page 502 503 504 = @api_fallback;
}

location @api_fallback {
    default_type application/json;
    return 503 '{"error":"Service temporarily unavailable"}';
}

# =========================
# STATIC CACHE (Nivel Enterprise)
# =========================
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
}

# =========================
# SSR CACHE (Nuxt específico)
# =========================
location ~* \.(html)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    
    # SSR cache para HTML
    proxy_cache ssr_cache;
    proxy_cache_valid 200 15m;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status;
}

# =========================
# ASSETS CACHE (corta duración)
# =========================
location ~* \.(json|xml)$ {
    expires 15m;
    add_header Cache-Control "public";
    
    # Cache para respuestas API estáticas
    proxy_cache api_cache;
    proxy_cache_valid 200 5m;
    add_header X-Cache-Status $upstream_cache_status;
}
