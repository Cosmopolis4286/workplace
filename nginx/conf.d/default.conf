# =========================
# HTTP PRINCIPAL (Híbrido DEV/PROD)
# =========================
server {
    listen 80;
    server_name localhost playrke.com www.playrke.com;

    # ACME Challenge para producción
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Configuración híbrida: DEV (HTTP) vs PROD (HTTPS redirect)
    location / {
        # Configuración proxy común (fuera del if)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR caching para Nuxt
        proxy_cache ssr_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias frontend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # En desarrollo (localhost) servir aplicación completa
        if ($host = "localhost") {
            # Configuración común
            client_max_body_size 50M;
            
            # =========================
            # FRONTEND (Nuxt en contenedor) - Con Load Balancing
            # =========================
            limit_req zone=general_limit burst=50 nodelay;
            limit_conn conn_limit_per_ip 20;
            
            # Load balancing con múltiples instancias frontend
            proxy_pass http://frontend_cluster;
            error_page 502 503 504 = @frontend_fallback;
            break;
        }
        
        # En producción (dominios reales) redirect a HTTPS
        return 301 https://$host$request_uri;
    }

    location @frontend_fallback {
        root /var/www/fallback;
        index fallback.html;
        try_files /fallback.html =503;
    }

    # =========================
    # API (Backend en contenedor) - Solo para desarrollo
    # =========================
    location /api/ {
        # Solo accesible en desarrollo
        if ($host != "localhost") {
            return 403;
        }
        
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit_per_ip 10;

        # Load balancing con múltiples instancias backend
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API caching para endpoints read-only
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias backend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # =========================
    # UPLOADS (Archivos estáticos) - Solo para desarrollo
    # =========================
    location /uploads/ {
        # Solo accesible en desarrollo
        if ($host != "localhost") {
            return 403;
        }
        
        limit_req zone=upload_limit burst=10 nodelay;
        limit_conn conn_limit_per_ip 5;
        
        # Servir archivos estáticos de uploads
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Seguridad para uploads
        location ~* \.(php|jsp|asp|sh|py)$ {
            deny all;
        }
    }
}
