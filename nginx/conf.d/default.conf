server {
    listen 80;
    server_name playrke.com www.playrke.com;

    # Redirige todo a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    # =========================
    # SSL
    # =========================
    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # =========================
    # Seguridad headers
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # =========================
    # Límites / performance
    # =========================
    client_max_body_size 50M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 16k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    # =========================
    # Compresión
    # =========================
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_proxied any;

    # =========================
    # Rate limiting (anti abuso)
    # =========================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # =========================
    # FRONTEND (Nuxt)
    # =========================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        error_page 502 503 = /fallback.html;
        limit_except GET HEAD { deny all; }
    }

    # =========================
    # BACKEND (API)
    # =========================
    # Health check público
    location = /api/health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        limit_except GET { deny all; }
    }

    # Resto de la API (protegida)
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        error_page 502 503 = /api-fallback.json;

        # Opcional: habilitar autenticación básica
        # auth_basic "Protected API";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        limit_except GET POST PUT DELETE PATCH { deny all; }
    }

    # =========================
    # Cache de assets
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =========================
    # Fallback UI
    # =========================
    location = /fallback.html {
        root /var/www/fallback;
        internal;
    }

    location = /api-fallback.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
        internal;
    }
}