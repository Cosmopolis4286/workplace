# =========================
# GLOBAL (http context)
# =========================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# =========================
# CLOUDFLARE REAL IP
# =========================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# =========================
# RATE LIMIT
# =========================
limit_req_zone $realip_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $realip_remote_addr zone=general_limit:10m rate=40r/s;


# =========================
# HTTP → HTTPS
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    return 301 https://$host$request_uri;
}

# =========================
# HTTPS
# =========================
server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # =========================
    # SEGURIDAD
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' https:;
    connect-src 'self' https: wss:;
    frame-ancestors 'none';
    " always;

    # =========================
    # LIMITES
    # =========================
    client_max_body_size 50M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # =========================
    # GZIP
    # =========================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # =========================
    # FRONTEND (NUXT)
    # =========================
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache_bypass $http_upgrade;

        error_page 502 503 504 = /fallback.html;
    }

    # =========================
    # API
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        error_page 502 503 504 = /api-fallback.json;
    }

    # =========================
    # STATIC CACHE
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # BLOQUEO DIRECTO (ANTI-BYPASS CF)
    # =========================
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    deny all;

    # =========================
    # Fallback UI
    # =========================
    location = /fallback.html {
        root /var/www/fallback;
        internal;
    }

    location = /api-fallback.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
        internal;
    }
}