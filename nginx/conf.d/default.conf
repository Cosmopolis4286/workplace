# =========================
# ACME CHALLENGE (Let's Encrypt)
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    
    # ACME Challenge - Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Configuración híbrida: DEV (HTTP) vs PROD (HTTPS)
    location / {
        # En desarrollo (localhost) servir HTTP
        # En producción (dominio real) redirect a HTTPS
        if ($host = "localhost") {
            # Servir aplicación en HTTP para desarrollo
            proxy_pass http://frontend_cluster;
            break;
        }
        
        # En producción redirect a HTTPS
        return 301 https://$host$request_uri;
    }
}

