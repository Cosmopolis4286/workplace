# =========================
# ZONAS DE RATE LIMIT (Nivel Enterprise)
# =========================
# Rate limit general - 10 req/s por IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# Rate limit API - 5 req/s por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Rate limit uploads - 2 req/s por IP
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Rate limit global - 100 req/s por IP (corregido)
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;

# Burst zones para picos temporales
limit_req_zone $binary_remote_addr zone=general_burst:10m rate=20r/s burst=40 nodelay;
limit_req_zone $binary_remote_addr zone=api_burst:10m rate=10r/s burst=20 nodelay;

# Connection limiting zones
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# =========================
# ACME CHALLENGE (Let's Encrypt)
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    
    # ACME Challenge - Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# HTTPS PRINCIPAL (HTTP/2 + Enterprise)
# =========================
server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    # SSL - COMENTADO TEMPORALMENTE
    # ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HEADERS DE SEGURIDAD (heredados de nginx.conf)
    # Los headers de seguridad ya están configurados en nginx.conf
    
    # Incluir configuración común factorizada
    include /etc/nginx/conf.d/common.conf;
    
    # =========================
    # BLOQUEO DIRECTO (ANTI-BYPASS CF) - Dinámico
    # =========================
    # Solo permitir tráfico desde Cloudflare o localhost
    set $allowed 0;
    if ($cloudflare_ip = 1) { set $allowed 1; }
    if ($remote_addr = 127.0.0.1) { set $allowed 1; }
    
    if ($allowed = 0) {
        return 403;
    }
}

# =========================
# HTTP PRINCIPAL (sin SSL para deploy interno)
# =========================
server {
    listen 80;
    server_name localhost;

    # ACME Challenge para localhost (testing)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }

    # HEADERS DE SEGURIDAD (heredados de nginx.conf)
    # Los headers de seguridad ya están configurados en nginx.conf
    
    # Configuración común
    client_max_body_size 50M;
    
    # =========================
    # FRONTEND (Nuxt en contenedor) - Con Load Balancing
    # =========================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        # Load balancing con múltiples instancias frontend
        # Nginx automáticamente descubrirá todas las instancias del servicio
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR caching para Nuxt
        proxy_cache ssr_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias frontend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @frontend_fallback;
    }

    location @frontend_fallback {
        root /var/www/fallback;
        index fallback.html;
        try_files /fallback.html =503;
    }

    # =========================
    # API (Backend en contenedor) - Con Load Balancing Real
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit_per_ip 10;

        # Load balancing con múltiples instancias backend
        # Nginx automáticamente descubrirá todas las instancias del servicio
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API caching para endpoints read-only
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias backend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # =========================
    # UPLOADS (Archivos estáticos y uploads)
    # =========================
    location /uploads/ {
        limit_req zone=upload_limit burst=10 nodelay;
        limit_conn conn_limit_per_ip 5;
        
        # Servir archivos estáticos de uploads
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Seguridad para uploads
        location ~* \.(php|jsp|asp|sh|py)$ {
            deny all;
        }
    }
}
