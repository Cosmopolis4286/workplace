# =========================
# ACME CHALLENGE (Let's Encrypt)
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    
    # ACME Challenge - Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Configuración híbrida: DEV (HTTP) vs PROD (HTTPS)
    location / {
        # En desarrollo (localhost) servir HTTP
        # En producción (dominio real) redirect a HTTPS
        if ($host = "localhost") {
            # Servir aplicación en HTTP para desarrollo
            proxy_pass http://frontend_cluster;
            break;
        }
        
        # En producción redirect a HTTPS
        return 301 https://$host$request_uri;
    }
}

# =========================
# HTTPS PRINCIPAL (HTTP/2 + Enterprise Security) - SOLO PRODUCCIÓN
# =========================
server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    # SSL Configuration - Enterprise Grade (solo producción)
    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/playrke.com/chain.pem;
    
    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_conf_command Options PrioritizeChaCha;
    
    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # HSTS - solo en producción con HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # CSP estricto para producción
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    
    # =========================
    # BLOQUEO DIRECTO (ANTI-BYPASS CF) - Solo producción
    # =========================
    # Solo permitir tráfico desde Cloudflare o localhost
    set $allowed 0;
    if ($cloudflare_ip = 1) { set $allowed 1; }
    if ($remote_addr = 127.0.0.1) { set $allowed 1; }
    
    if ($allowed = 0) {
        return 403;
    }
    
    # Configuración común a nivel server
    client_max_body_size 50M;
    
    # =========================
    # FRONTEND (HTTPS) - Production
    # =========================
    location / {
        # Rate limiting
        limit_req zone=general_limit burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        # Configuración proxy
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR caching para Nuxt
        proxy_cache ssr_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias frontend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # Load balancing con múltiples instancias frontend
        proxy_pass http://frontend_cluster;
        error_page 502 503 504 = @frontend_fallback;
    }

    location @frontend_fallback {
        root /var/www/fallback;
        index fallback.html;
        try_files /fallback.html =503;
    }

    # =========================
    # API (Backend en contenedor) - HTTPS
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit_per_ip 10;

        # Load balancing con múltiples instancias backend
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API caching para endpoints read-only
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias backend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # =========================
    # UPLOADS (Archivos estáticos) - HTTPS
    # =========================
    location /uploads/ {
        # Servir archivos estáticos de uploads
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Seguridad para uploads
        location ~* \.(php|jsp|asp|sh|py|pl|rb|bat|cmd)$ {
            deny all;
        }
    }
}

# =========================
# HTTP PRINCIPAL (Híbrido DEV/PROD)
# =========================
server {
    listen 80;
    server_name localhost playrke.com www.playrke.com;

    # ACME Challenge para producción
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Configuración común a nivel server
    client_max_body_size 50M;
    
    # Configuración híbrida: DEV (HTTP) vs PROD (HTTPS redirect)
    location / {
        # Rate limiting (fuera del if)
        limit_req zone=general_limit burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        # Configuración proxy común (fuera del if)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSR caching para Nuxt
        proxy_cache ssr_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias frontend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;

        # En desarrollo (localhost) servir aplicación completa
        if ($host = "localhost") {
            # Load balancing con múltiples instancias frontend
            proxy_pass http://frontend_cluster;
            error_page 502 503 504 = @frontend_fallback;
            break;
        }
        
        # En producción (dominios reales) redirect a HTTPS
        return 301 https://$host$request_uri;
    }

    location @frontend_fallback {
        root /var/www/fallback;
        index fallback.html;
        try_files /fallback.html =503;
    }

    # =========================
    # API (Backend en contenedor) - Solo para desarrollo
    # =========================
    location /api/ {
        # Solo accesible en desarrollo
        if ($host != "localhost") {
            return 403;
        }
        
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit_per_ip 10;

        # Load balancing con múltiples instancias backend
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API caching para endpoints read-only
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Failover automático entre instancias backend
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        return 503 '{"error": "Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }

    # =========================
    # UPLOADS (Archivos estáticos) - Solo para desarrollo
    # =========================
    location /uploads/ {
        # Solo accesible en desarrollo
        if ($host != "localhost") {
            return 403;
        }
        
        # Servir archivos estáticos de uploads
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Seguridad para uploads
        location ~* \.(php|jsp|asp|sh|py)$ {
            deny all;
        }
    }
}
