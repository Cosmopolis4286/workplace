# Configuración Nginx para Workplace default.conf
server {
    listen 80;
    server_name playrke.com www.playrke.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # ---------- FRONTEND ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        error_page 502 503 = /fallback.html;
    }

    # ---------- BACKEND ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        error_page 502 503 = /api-fallback.json;
    }

    # ---------- FALLBACK UI ----------
    location = /fallback.html {
        root /var/www/fallback;
        internal;
    }

    location = /api-fallback.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
        internal;
    }
}