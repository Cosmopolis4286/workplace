# =========================
# ZONAS DE RATE LIMIT (http context)
# =========================
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# =========================
# REDIRECCIÓN HTTP → HTTPS
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    return 301 https://$host$request_uri;
}

# =========================
# HTTPS PRINCIPAL
# =========================
server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # =========================
    # HEADERS DE SEGURIDAD
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' https:;
        connect-src 'self' https: wss:;
        frame-ancestors 'none';
    " always;

    client_max_body_size 50M;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # =========================
    # FRONTEND (Nuxt)
    # =========================
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        error_page 502 503 504 = @frontend_fallback;
    }

    # =========================
    # FALLBACK SPA / FRONTEND
    # =========================
    location @frontend_fallback {
        # ruta absoluta para fallback.html
        try_files /var/www/fallback/fallback.html =503;
    }

    # =========================
    # API
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    # =========================
    # STATIC CACHE
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # BLOQUEO DIRECTO (ANTI-BYPASS CF)
    # =========================
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    deny all;
}