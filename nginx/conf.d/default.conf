# =========================
# ZONAS DE RATE LIMIT (Nivel Empresa)
# =========================
# Rate limit general - 10 req/s por IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

# Rate limit API - 5 req/s por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# Rate limit auth - 3 req/s por IP (más restrictivo)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

# Rate limit uploads - 2 req/s por IP
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Rate limit global - 100 req/s total
limit_req_zone $server_name zone=global_limit:10m rate=100r/s;

# Burst zones para picos temporales
limit_req_zone $binary_remote_addr zone=general_burst:10m rate=20r/s burst=40 nodelay;
limit_req_zone $binary_remote_addr zone=api_burst:10m rate=10r/s burst=20 nodelay;

# =========================
# ACME CHALLENGE (Let's Encrypt)
# =========================
server {
    listen 80;
    server_name playrke.com www.playrke.com;
    
    # ACME Challenge - Let's Encrypt domain validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri $uri/ =404;
    }
    
    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# HTTPS PRINCIPAL
# =========================
server {
    listen 443;
    # http2 on;
    server_name playrke.com www.playrke.com;

    # SSL - COMENTADO TEMPORALMENTE
    # ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HEADERS DE SEGURIDAD
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' https:;
        connect-src 'self' https: wss:;
        frame-ancestors 'none';
    " always;

    client_max_body_size 50M;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # =========================
    # FRONTEND (Nuxt en contenedor)
    # =========================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://workplace_frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
        error_page 502 503 504 = @frontend_fallback;
    }

    location @frontend_fallback {
        root /var/www/fallback;
        index fallback.html;
        try_files /fallback.html =503;
    }

    # =========================
    # API (Backend en contenedor)
    # =========================
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://workplace_backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_intercept_errors on;

        error_page 502 503 504 = @api_fallback;
    }

    location @api_fallback {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    # =========================
    # STATIC CACHE
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # BLOQUEO DIRECTO (ANTI-BYPASS CF)
    # =========================
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    deny all;
}

