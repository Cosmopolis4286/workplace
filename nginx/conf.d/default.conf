server {
    listen 80;
    server_name playrke.com www.playrke.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name playrke.com www.playrke.com;

    # =========================
    # SSL
    # =========================
    ssl_certificate /etc/letsencrypt/live/playrke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playrke.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # =========================
    # Seguridad (mejorada)
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =========================
    # Límites / performance
    # =========================
    client_max_body_size 50M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    send_timeout 30s;

    # =========================
    # Compresión
    # =========================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 1000;

    # =========================
    # Rate limiting (anti abuso)
    # =========================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    # =========================
    # FRONTEND (Nuxt)
    # =========================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        error_page 502 503 = /fallback.html;
    }

    # =========================
    # BACKEND (API)
    # =========================
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;

        limit_req zone=api_limit burst=30 nodelay;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;

        error_page 502 503 = /api-fallback.json;
    }

    # =========================
    # Cache de assets (clave para rendimiento)
    # =========================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # Fallback UI
    # =========================
    location = /fallback.html {
        root /var/www/fallback;
        internal;
    }

    location = /api-fallback.json {
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
        internal;
    }
}