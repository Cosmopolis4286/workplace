# =========================
# DEVELOPMENT CONFIGURATION
# =========================
# HTTP only - Simple y rápido para desarrollo

server {
    listen 80;
    server_name localhost;

    # Headers estándar
    include /etc/nginx/conf.d/proxy-headers.conf;

    # Frontend location
    location / {
        proxy_pass http://frontend:3000;
    }

    # API location  
    location /api/ {
        proxy_pass http://backend:3001;
    }

    # Uploads location
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Headers específicos de desarrollo
    add_header X-Environment "development" always;
    add_header X-Debug "true" always;
}
