# =========================
# DEVELOPMENT CONFIGURATION AVANZADA
# =========================
# HTTP only - Optimizado para desarrollo con upstreams

server {
    listen 80;
    server_name localhost;

    # Rate limiting básico para desarrollo
    limit_req zone=general_limit burst=10 nodelay;
    limit_req zone=api_limit burst=5 nodelay;

    # Headers estándar avanzados
    include /etc/nginx/conf.d/proxy-headers.conf;

    # Frontend location con fallback (modo producción)
    location / {
        # Intentar servir del frontend primero
        proxy_pass http://frontend_cluster;
        include /etc/nginx/conf.d/proxy-headers.conf;
        
        # Fallback si frontend no está disponible
        error_page 502 503 504 = @frontend_fallback;
    }

    # Assets estáticos sin CORS headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://frontend_cluster;
        
        # Headers básicos para assets estáticos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status STATIC always;
        access_log off;
        
        # No CORS headers para assets estáticos
    }

    # Frontend fallback - servir página estática
    location @frontend_fallback {
        root /var/www/fallback;
        try_files /fallback.html =503;
        
        # Headers para fallback
        add_header X-Fallback "frontend" always;
        add_header X-Environment "development" always;
    }

    # API location con fallback
    location /api/ {
        # Intentar servir del backend primero
        proxy_pass http://backend_cluster;
        include /etc/nginx/conf.d/proxy-headers.conf;
        
        # Caching para API responses
        proxy_cache api_cache;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $cookie_nocache $arg_nocache $http_authorization;
        proxy_no_cache $cookie_nocache $arg_nocache $http_authorization;
        
        # Cache headers
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Cache-Key $scheme$proxy_host$request_uri always;
        
        # Rate limiting específico para API
        limit_req zone=api_limit burst=10 nodelay;
        
        # Fallback si backend no está disponible
        error_page 502 503 504 = @api_fallback;
    }

    # API fallback - servir JSON estático
    location @api_fallback {
        root /var/www/fallback;
        try_files /api-fallback.json =503;
        
        # Headers para fallback
        add_header Content-Type application/json;
        add_header X-Fallback "api" always;
        add_header X-Environment "development" always;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # Uploads location con caching largo
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # Seguridad para uploads
        location ~* \.(php|jsp|asp|sh|py|pl|rb)$ {
            deny all;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Headers específicos de desarrollo
    add_header X-Environment "development" always;
    add_header X-Debug "true" always;
    add_header X-Developer-Tools "enabled" always;
    
    # Logging extendido para desarrollo
    access_log /var/log/nginx/dev_access.log json_combined;
    error_log /var/log/nginx/dev_error.log warn;
}
