# =========================
# COMMON MACROS
# =========================
# Configuración compartida que puede ser incluida en server blocks

# Macro para frontend con caching
map $http_x_request_id $request_id {
    default    $request_id;
    ""         $request_id;
}

# Cache settings variables
map $sent_http_content_type $cache_control {
    default                    "no-cache";
    application/json           "public, max-age=300";
    text/css                   "public, max-age=31536000";
    text/javascript            "public, max-age=31536000";
    application/javascript     "public, max-age=31536000";
    image/png                  "public, max-age=31536000";
    image/jpeg                 "public, max-age=31536000";
    image/gif                  "public, max-age=31536000";
    image/svg+xml              "public, max-age=31536000";
}

# Rate limiting conditions
map $remote_addr $limit_key {
    default $binary_remote_addr;
}

# Security headers variables
map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains; preload";
    default "";
}
