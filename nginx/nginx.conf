user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enhanced log formats for observability
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" ' 
                    'rt=$request_time uct="$upstream_connect_time" ' 
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    
    # Advanced performance tuning
    worker_rlimit_nofile 65535;
    reset_timedout_connection on;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Brotli compression (better than gzip)
    brotli on;
    brotli_comp_level 5;
    brotli_buffers 16 8k;
    brotli_min_length 20;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/eot
        font/otf
        font/ttf;
    
    # Gzip fallback for older clients
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4; # Reduced since Brotli is primary
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Enhanced security headers (strict CSP - production grade)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Strict CSP - nivel enterprise (removido unsafe-eval, unsafe-inline mínimo)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$random'; style-src 'self' 'nonce-$random'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Hide server tokens
    server_tokens off;
    more_clear_headers Server;
    
    # Advanced proxy settings with failover
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_max_temp_file_size 1024m;
    
    # Failover configuration for high availability
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 30s;
    
    # Advanced HTTP cache for SSR/API responses
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/ssr levels=1:2 keys_zone=ssr_cache:10m max_size=500m inactive=30m use_temp_path=off;
    
    # Upstream configuration para rolling update real
    upstream backend_cluster {
        # Descubrimiento dinámico de contenedores backend
        # Docker DNS resolverá todas las instancias del servicio
        server backend:3001 max_fails=3 fail_timeout=30s;
        # La segunda instancia se agregará automáticamente cuando exista
        # nginx balanceará entre todas las instancias disponibles
        
        # Opciones de load balancing
        least_conn;  # Conexión al servidor con menos conexiones
        keepalive 32; # Mantener conexiones abiertas
        
        # Health check implícito via max_fails/fail_timeout
    }
    
    upstream frontend_cluster {
        # Similar para frontend rolling update
        server frontend:3000 max_fails=3 fail_timeout=30s;
        least_conn;
        keepalive 16;
    }
    
    # Caching configuration
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Include configurations
    include /etc/nginx/conf.d/*.conf;
}
