# 📦 Docker Compose BACKUP LITE - Container ligero de backups
# Consumo mínimo: ~50MB RAM

version: '3.8'

services:
  backup:
    image: alpine:3.19
    restart: unless-stopped
    container_name: workplace_backup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/workplace/backups:/backups
    command: >
      sh -c "
        echo 'Installing dependencies...' &&
        apk add --no-cache docker-cli postgresql-client redis &&
        echo 'Starting backup service...' &&
        while true; do
          echo 'Running backup cycle...' &&
          DATE=\$(date +%Y%m%d_%H%M%S) &&
          
          # PostgreSQL backup
          echo 'PostgreSQL backup...' &&
          if docker exec postgres pg_dump -U \${POSTGRES_USER} \${POSTGRES_DB} > /backups/postgres_\${DATE}.sql; then
            echo '✅ PostgreSQL OK'
            gzip /backups/postgres_\${DATE}.sql || true
          else
            echo '❌ PostgreSQL failed'
          fi &&
          
          # Redis backup
          echo 'Redis backup...' &&
          if docker exec redis redis-cli -a \${REDIS_PASSWORD} save; then
            sleep 2 &&
            if docker cp redis:/data/dump.rdb /backups/redis_\${DATE}.rdb; then
              echo '✅ Redis OK'
              gzip /backups/redis_\${DATE}.rdb || true
            else
              echo '❌ Redis failed'
            fi
          else
            echo '❌ Redis save failed'
          fi &&
          
          # Cleanup old backups
          echo 'Cleaning old backups...' &&
          find /backups -name '*.sql*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.sql.gz*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.rdb*' -mtime +7 -delete 2>/dev/null || true &&
          find /backups -name '*.rdb.gz*' -mtime +7 -delete 2>/dev/null || true &&
          
          echo 'Backup cycle completed. Sleeping 86400 seconds...' &&
          sleep 86400;
        done
      "
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - workplace_private_network
    cpus: "0.1"
    mem_limit: 64m
    mem_reservation: 32m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  workplace_private_network:
    external: true
